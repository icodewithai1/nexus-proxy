<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Access Denied</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <iframe id="frame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals"></iframe>

  <script>
    document.title = "Access Denied";

    fetch("https://github.com/CoolDude2349/Offline-HTML-Games-Pack/raw/refs/heads/master/offline/fancypantsadventure.html")
      .then(res => res.text())
      .then(html => {
        const frame = document.getElementById('frame');
        frame.srcdoc = html;
        
        // Keeps the tab name as "Access Denied" once the content loads
        frame.onload = () => {
          document.title = "Access Denied";
        };
      })
      .catch(err => console.error("Error loading HTML:", err));
  </script>
</body>
</html>
