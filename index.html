<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS5 UI & Browser</title>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --text-color: #ffffff;
            --highlight-color: #0070d1;
            --card-bg: #1a1e26;
            --nav-inactive: #7a7a7a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            /* Dark gradient background to match the PS5 UI vibe */
            background: radial-gradient(circle at 70% 30%, #1c2536 0%, #0b0f19 80%);
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            z-index: 10;
        }

        .top-left {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 14px;
            font-weight: 500;
        }

        .top-right {
            display: flex;
            align-items: center;
            gap: 20px;
            font-size: 14px;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.1);
            padding: 5px 15px;
            border-radius: 20px;
        }

        .user-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #4a5568;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Main Navigation */
        .main-nav {
            display: flex;
            align-items: center;
            padding: 0 40px;
            margin-top: 10px;
            gap: 30px;
            z-index: 10;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .nav-item {
            color: var(--nav-inactive);
            cursor: pointer;
            padding: 10px 0;
            position: relative;
            transition: color 0.3s;
        }

        .nav-item:hover, .nav-item.active {
            color: var(--text-color);
        }

        .nav-item.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: var(--text-color);
            border-radius: 2px;
        }

        .nav-item.active {
            border: 1px solid var(--text-color);
            padding: 5px 15px;
            border-radius: 15px;
        }

        .nav-item.active::after {
            display: none;
        }

        .nav-trigger {
            color: var(--nav-inactive);
            font-size: 12px;
            border: 1px solid var(--nav-inactive);
            padding: 2px 6px;
            border-radius: 4px;
            cursor: pointer;
        }

        /* Game Carousel */
        .carousel-container {
            flex: 1;
            display: flex;
            align-items: flex-end;
            padding: 0 40px 40px 40px;
            gap: 20px;
            z-index: 10;
            overflow-x: auto;
            overflow-y: hidden;
            scrollbar-width: none; /* Firefox */
        }

        .carousel-container::-webkit-scrollbar {
            display: none; /* Chrome */
        }

        .game-card {
            min-width: 200px;
            height: 260px;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            background-color: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .game-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.8);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .game-card.selected {
            outline: 2px solid var(--text-color);
            transform: scale(1.05);
        }

        .game-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.8;
            transition: opacity 0.3s;
        }

        .game-card:hover img {
            opacity: 1;
        }

        /* Bottom Action Bar */
        .bottom-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 20px 40px;
            gap: 30px;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            z-index: 10;
            font-size: 12px;
            font-weight: 600;
        }

        .action-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            color: #ccc;
            transition: color 0.3s;
        }

        .action-btn:hover {
            color: #fff;
        }

        .action-btn i {
            font-size: 14px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Browser Overlay */
        #browser-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0b0f19;
            z-index: 100;
            display: none;
            flex-direction: column;
        }

        .browser-header {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            background: #1a1e26;
            gap: 15px;
            border-bottom: 1px solid #333;
        }

        .browser-header input {
            flex: 1;
            background: #0b0f19;
            border: 1px solid #333;
            color: white;
            padding: 10px 15px;
            border-radius: 20px;
            outline: none;
            font-size: 14px;
        }

        .browser-header input:focus {
            border-color: var(--highlight-color);
        }

        .browser-header button {
            background: var(--highlight-color);
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .browser-header button:hover {
            background: #0056b3;
        }

        #render-frame {
            flex: 1;
            width: 100%;
            height: 100%;
            border: none;
            background: #ffffff;
        }

        .close-browser {
            background: transparent !important;
            color: #ff4d4d;
            font-size: 20px;
            padding: 0 10px !important;
        }

        .close-browser:hover {
            color: #ff1a1a;
        }
    </style>
</head>
<body>

    <!-- Top Bar -->
    <div class="top-bar">
        <div class="top-left">
            <span>21:35</span>
            <i class="fas fa-wifi"></i>
        </div>
        <div class="top-right">
            <i class="fas fa-bell"></i> <span>12</span>
            <i class="fas fa-comment-alt"></i> <span>9</span>
            <i class="fas fa-plus-circle" style="color: #f5c518;"></i>
            <div class="user-profile">
                <div class="user-avatar"><i class="fas fa-user"></i></div>
                <span>FallingStickman</span>
                <span style="color: #0070d1; font-size: 12px;"><i class="fas fa-trophy"></i> 14</span>
            </div>
        </div>
    </div>

    <!-- Main Navigation -->
    <div class="main-nav">
        <div class="nav-trigger">L1</div>
        <div class="nav-item active">ALL</div>
        <div class="nav-item">RACING</div>
        <div class="nav-item">ROLEPLAYING</div>
        <div class="nav-item">SPORTS</div>
        <div class="nav-item">ONLINE</div>
        <div class="nav-item">SHOOTER</div>
        <div class="nav-trigger">R1</div>
        <!-- The requested Browser Tab -->
        <div class="nav-item" id="browser-tab-btn" style="color: #0070d1; margin-left: auto;">BROWSER</div>
    </div>

    <!-- Game Carousel (Using CSS gradients as placeholders for the game art) -->
    <div class="carousel-container">
        <!-- Silent Hill 2 -->
        <div class="game-card" style="background: linear-gradient(45deg, #1a1a1a, #3a3a3a);">
            <div style="position: absolute; bottom: 10px; left: 10px; font-weight: bold; font-size: 14px; text-shadow: 1px 1px 3px #000;">SILENT HILL 2</div>
        </div>
        <!-- The Last of Us Part II (Selected) -->
        <div class="game-card selected" style="background: linear-gradient(45deg, #2b1b1b, #4a2a2a);">
            <div style="position: absolute; bottom: 10px; left: 10px; font-weight: bold; font-size: 16px; text-shadow: 1px 1px 3px #000;">THE LAST<br>OF US<br>PART II</div>
        </div>
        <!-- Death Stranding -->
        <div class="game-card" style="background: linear-gradient(45deg, #1b2b1b, #2a4a2a);">
            <div style="position: absolute; bottom: 10px; left: 10px; font-weight: bold; font-size: 14px; text-shadow: 1px 1px 3px #000;">DEATH<br>STRANDING</div>
        </div>
        <!-- FF7 Remake -->
        <div class="game-card" style="background: linear-gradient(45deg, #2b2b1b, #4a4a2a);">
            <div style="position: absolute; bottom: 10px; left: 10px; font-weight: bold; font-size: 14px; text-shadow: 1px 1px 3px #000;">FINAL FANTASY<br>VII REMAKE</div>
        </div>
        <!-- Ghost of Tsushima -->
        <div class="game-card" style="background: linear-gradient(45deg, #1b1b2b, #2a2a4a);">
            <div style="position: absolute; bottom: 10px; left: 10px; font-weight: bold; font-size: 14px; text-shadow: 1px 1px 3px #000;">GHOST OF<br>TSUSHIMA</div>
        </div>
        <!-- PlayStation Store -->
        <div class="game-card" style="background: #0070d1;">
            <div style="position: absolute; bottom: 10px; left: 10px; font-weight: bold; font-size: 14px; text-shadow: 1px 1px 3px #000;">PlayStation<br>Store</div>
        </div>
        <!-- Chrono Cross -->
        <div class="game-card" style="background: linear-gradient(45deg, #2b1b2b, #4a2a4a);">
            <div style="position: absolute; bottom: 10px; left: 10px; font-weight: bold; font-size: 14px; text-shadow: 1px 1px 3px #000;">CHRONO<br>CROSS</div>
        </div>
        <!-- Shadow of the Colossus -->
        <div class="game-card" style="background: linear-gradient(45deg, #1b2b2b, #2a4a4a);">
            <div style="position: absolute; bottom: 10px; left: 10px; font-weight: bold; font-size: 14px; text-shadow: 1px 1px 3px #000;">SHADOW OF THE<br>COLOSSUS</div>
        </div>
    </div>

    <!-- Bottom Action Bar -->
    <div class="bottom-bar">
        <div class="action-btn"><i class="fas fa-ellipsis-h"></i> OPTIONS</div>
        <div class="action-btn"><i class="fas fa-arrow-up"></i> TOP MENU</div>
        <div class="action-btn"><i class="fas fa-info-circle"></i> DETAILS</div>
        <div class="action-btn"><i class="fas fa-play"></i> PLAY</div>
    </div>

    <!-- Browser Overlay (Hidden by default) -->
    <div id="browser-overlay">
        <div class="browser-header">
            <button class="close-browser" onclick="closeBrowser()"><i class="fas fa-times"></i></button>
            <input type="text" id="url-input" placeholder="Enter URL (e.g., https://www.wikipedia.org)" onkeypress="handleUrlEnter(event)">
            <button onclick="navigate()">Go</button>
        </div>
        <iframe id="render-frame" sandbox="allow-same-origin allow-scripts allow-forms allow-popups"></iframe>
    </div>

    <script>
        // --- UI Interactions ---
        const browserTabBtn = document.getElementById('browser-tab-btn');
        const browserOverlay = document.getElementById('browser-overlay');
        const renderFrame = document.getElementById('render-frame');
        const urlInput = document.getElementById('url-input');

        // Open Browser
        browserTabBtn.addEventListener('click', () => {
            browserOverlay.style.display = 'flex';
            urlInput.focus();
        });

        // Close Browser
        function closeBrowser() {
            browserOverlay.style.display = 'none';
            // Clear the iframe source to stop any background processes/videos
            renderFrame.src = 'about:blank'; 
        }

        // Handle Enter key in the URL bar
        function handleUrlEnter(event) {
            if (event.key === 'Enter') {
                navigate();
            }
        }

        // Navigate to the URL
        function navigate() {
            let url = urlInput.value.trim();
            if (!url) return;

            // Simple URL formatting: add https:// if missing
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
                urlInput.value = url;
            }

            console.log(`Navigating to: ${url}`);
            
            // Set the iframe source
            renderFrame.src = url;
        }
    </script>
</body>
</html>
