<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus - Browser in a Browser</title>
    <style>
        :root {
            --bg-primary: #121212;
            --bg-secondary: #1e1e1e;
            --bg-tertiary: #252525;
            --bg-input: #1a1a1a;
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0a0;
            --border-color: #3d3d3d;
            --accent-purple: #9b30ff;
            --accent-black: #000000;
            --hover-bg: #2a2a2a;
            --sidebar-width: 60px;
            --topbar-height: 44px;
            --tabbar-height: 40px;
            --gradient-outline: linear-gradient(90deg, var(--accent-black), var(--accent-purple), var(--accent-black));
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            overflow: hidden;
            height: 100vh;
        }

        .app-container {
            display: flex;
            height: 100vh;
        }

        /* --- Animated Gradient Border Utility --- */
        .g-border {
            background: 
                linear-gradient(var(--bg-secondary), var(--bg-secondary)) padding-box,
                var(--gradient-outline) border-box;
            background-size: 100% 100%, 200% 100%;
            border: 1px solid transparent;
            border-radius: 8px;
            animation: borderSlide 3s linear infinite;
        }

        .g-border-active {
            background: 
                linear-gradient(var(--bg-primary), var(--bg-primary)) padding-box,
                var(--gradient-outline) border-box;
            background-size: 100% 100%, 200% 100%;
            border: 1px solid transparent;
            border-radius: 8px;
            animation: borderSlide 3s linear infinite;
        }

        .g-border-input {
            background: 
                linear-gradient(var(--bg-input), var(--bg-input)) padding-box,
                var(--gradient-outline) border-box;
            background-size: 100% 100%, 200% 100%;
            border: 1px solid transparent;
            border-radius: 20px;
            animation: borderSlide 3s linear infinite;
        }

        @keyframes borderSlide {
            0% { background-position: 0% 0%, 0% 0%; }
            100% { background-position: 0% 0%, 200% 0%; }
        }

        /* --- Left Sidebar --- */
        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--bg-primary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 0;
            gap: 8px;
            flex-shrink: 0;
        }

        .sidebar-icon {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            border-radius: 8px; /* Kept rounded but removed outline */
        }

        .sidebar-icon:hover {
            background: var(--hover-bg);
        }

        .sidebar-icon svg {
            width: 20px;
            height: 20px;
            stroke: var(--text-secondary);
            fill: none;
            stroke-width: 2;
            transition: stroke 0.2s;
        }

        .sidebar-icon.active svg {
            stroke: var(--accent-purple);
        }

        .sidebar-tooltip {
            position: absolute;
            left: 50px;
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            z-index: 100;
            border: 1px solid var(--border-color);
        }

        .sidebar-icon:hover .sidebar-tooltip {
            opacity: 1;
        }

        /* --- Main Section --- */
        .main-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-color: var(--bg-primary);
        }

        /* --- Top Bar (Tabs + Address) --- */
        .top-bar {
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        /* Tabs Row */
        .tabs-container {
            height: var(--tabbar-height);
            display: flex;
            align-items: center;
            padding: 0 10px;
            gap: 6px;
        }

        .tab {
            display: flex;
            align-items: center;
            padding: 8px 14px;
            cursor: pointer;
            font-size: 13px;
            color: var(--text-secondary);
            transition: all 0.2s;
            height: 32px;
        }

        .tab.active {
            color: var(--text-primary);
        }

        .tab-close {
            margin-left: 10px;
            width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            opacity: 0.7;
            transition: opacity 0.2s, background 0.2s;
        }

        .tab-close:hover {
            opacity: 1;
            background: var(--hover-bg);
        }

        .new-tab-btn {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all 0.2s;
        }

        .new-tab-btn:hover {
            background: var(--hover-bg);
            color: var(--text-primary);
        }

        /* Address Bar Row */
        .address-bar-container {
            height: var(--topbar-height);
            display: flex;
            align-items: center;
            padding: 0 12px;
            gap: 10px;
        }

        .nav-btn {
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all 0.2s;
        }

        .nav-btn:hover {
            background: var(--hover-bg);
            color: var(--text-primary);
        }

        .nav-btn svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
        }

        .address-bar {
            flex: 1;
            height: 36px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            color: var(--text-primary);
            font-size: 14px;
        }

        .address-bar input {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 14px;
        }

        .address-icon {
            margin-right: 10px;
            color: var(--text-secondary);
        }

        /* --- Content Area --- */
        .content-area {
            flex: 1;
            background-color: var(--bg-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-secondary);
            font-size: 24px;
            position: relative;
            overflow: hidden;
        }

        .new-tab-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            z-index: 2;
            width: 100%;
            max-width: 600px;
            margin-top: -100px; /* Shift content up slightly */
        }

        /* Nexus Logo Styles */
        .logo-text {
            font-size: 100px;
            font-weight: 900;
            color: #ffffff;
            line-height: 1;
            letter-spacing: -5px;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.2);
        }

        .central-search-container {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .central-search {
            width: 100%;
            height: 50px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            background: var(--bg-input);
        }

        .central-search input {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 16px;
            height: 100%;
        }

        .central-search-icon {
            margin-right: 12px;
            color: var(--text-secondary);
        }

        /* Bookmarks / Shortcuts */
        .new-tab-shortcuts {
            display: flex;
            gap: 25px;
            justify-content: center;
            align-items: center;
        }

        .shortcut-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .shortcut-item:hover {
            transform: translateY(-3px);
        }

        .shortcut-circle {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--bg-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
        }

        .shortcut-circle svg {
            width: 24px;
            height: 24px;
        }

        .shortcut-label {
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }
    </style>
</head>

    <script>
        // Basic interactivity
        const sidebarIcons = document.querySelectorAll('.sidebar-icon');
        sidebarIcons.forEach(icon => {
            icon.addEventListener('click', () => {
                sidebarIcons.forEach(i => i.classList.remove('active'));
                icon.classList.add('active');
            });
        });

        document.querySelector('.tab-close').addEventListener('click', (e) => {
            e.stopPropagation();
            alert('Close tab');
        });

        document.querySelector('.new-tab-btn').addEventListener('click', () => {
            alert('New tab');
        });

        // Central Search functionality
        document.getElementById('centralSearchInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                alert('Searching for: ' + this.value + '\n(Proxy functionality would handle this request)');
            }
        });
    </script>
