<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS5 Home UI & Browser</title>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Note: In a real implementation, you would load Epoxy and Libcurl.js here -->
    <!-- <script src="path/to/epoxy.js"></script> -->
    <!-- <script src="path/to/libcurl.js"></script> -->

    <style>
        :root {
            --bg-color: #0b0f19;
            --text-color: #ffffff;
            --highlight-color: #0070d1;
            --card-bg: #1a1e26;
            --nav-inactive: #7a7a7a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            background-image: url('https://image.tmdb.org/t/p/original/5fc2A9gC6Fj3zX2Qx6y5q4X3e2.jpg'); /* Placeholder for Ellie BG */
            background-size: cover;
            background-position: center;
        }

        /* Dark overlay for background image */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to right, rgba(11, 15, 25, 0.95) 0%, rgba(11, 15, 25, 0.6) 50%, rgba(11, 15, 25, 0.8) 100%);
            z-index: 0;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            z-index: 10;
        }

        .top-left {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 14px;
            font-weight: 500;
        }

        .top-right {
            display: flex;
            align-items: center;
            gap: 20px;
            font-size: 14px;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.1);
            padding: 5px 15px;
            border-radius: 20px;
        }

        .user-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #4a5568;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Main Navigation */
        .main-nav {
            display: flex;
            align-items: center;
            padding: 0 40px;
            margin-top: 10px;
            gap: 30px;
            z-index: 10;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .nav-item {
            color: var(--nav-inactive);
            cursor: pointer;
            padding: 10px 0;
            position: relative;
            transition: color 0.3s;
        }

        .nav-item:hover, .nav-item.active {
            color: var(--text-color);
        }

        .nav-item.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: var(--text-color);
            border-radius: 2px;
        }

        .nav-item.active {
            border: 1px solid var(--text-color);
            padding: 5px 15px;
            border-radius: 15px;
        }

        .nav-item.active::after {
            display: none;
        }

        .nav-trigger {
            color: var(--nav-inactive);
            font-size: 12px;
            border: 1px solid var(--nav-inactive);
            padding: 2px 6px;
            border-radius: 4px;
            cursor: pointer;
        }

        /* Game Carousel */
        .carousel-container {
            flex: 1;
            display: flex;
            align-items: flex-end;
            padding: 0 40px 40px 40px;
            gap: 20px;
            z-index: 10;
            overflow-x: auto;
            overflow-y: hidden;
            scrollbar-width: none; /* Firefox */
        }

        .carousel-container::-webkit-scrollbar {
            display: none; /* Chrome */
        }

        .game-card {
            min-width: 200px;
            height: 260px;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            background-color: var(--card-bg);
        }

        .game-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.8);
        }

        .game-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.8;
            transition: opacity 0.3s;
        }

        .game-card:hover img {
            opacity: 1;
        }

        .game-card.selected {
            outline: 2px solid var(--text-color);
            transform: scale(1.05);
        }

        /* Bottom Action Bar */
        .bottom-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 20px 40px;
            gap: 30px;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            z-index: 10;
            font-size: 12px;
            font-weight: 600;
        }

        .action-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            color: #ccc;
            transition: color 0.3s;
        }

        .action-btn:hover {
            color: #fff;
        }

        .action-btn i {
            font-size: 14px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Browser Overlay */
        #browser-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0b0f19;
            z-index: 100;
            display: none;
            flex-direction: column;
        }

        .browser-header {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            background: #1a1e26;
            gap: 15px;
            border-bottom: 1px solid #333;
        }

        .browser-header input {
            flex: 1;
            background: #0b0f19;
            border: 1px solid #333;
            color: white;
            padding: 10px 15px;
            border-radius: 20px;
            outline: none;
            font-size: 14px;
        }

        .browser-header button {
            background: var(--highlight-color);
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        .browser-header button:hover {
            background: #0056b3;
        }

        #render-frame {
            flex: 1;
            width: 100%;
            height: 100%;
            border: none;
            background: white; /* Default web page background */
        }

        .close-browser {
            background: transparent !important;
            color: #ff4d4d;
            font-size: 20px;
            padding: 0 10px !important;
        }
    </style>
</head>
<body>

    <!-- Top Bar -->
    <div class="top-bar">
        <div class="top-left">
            <span>21:35</span>
            <i class="fas fa-wifi"></i>
        </div>
        <div class="top-right">
            <i class="fas fa-bell"></i> <span>12</span>
            <i class="fas fa-comment-alt"></i> <span>9</span>
            <i class="fas fa-plus-circle" style="color: #f5c518;"></i>
            <div class="user-profile">
                <div class="user-avatar"><i class="fas fa-user"></i></div>
                <span>FallingStickman</span>
                <span style="color: #0070d1; font-size: 12px;"><i class="fas fa-trophy"></i> 14</span>
            </div>
        </div>
    </div>

    <!-- Main Navigation -->
    <div class="main-nav">
        <div class="nav-trigger">L1</div>
        <div class="nav-item active">ALL</div>
        <div class="nav-item">RACING</div>
        <div class="nav-item">ROLEPLAYING</div>
        <div class="nav-item">SPORTS</div>
        <div class="nav-item">ONLINE</div>
        <div class="nav-item">SHOOTER</div>
        <div class="nav-trigger">R1</div>
        <!-- The requested Browser Tab -->
        <div class="nav-item" id="browser-tab-btn" style="color: #0070d1; margin-left: auto;">BROWSER</div>
    </div>

    <!-- Game Carousel -->
    <div class="carousel-container">
        <!-- Placeholder images representing the games in the screenshot -->
        <div class="game-card">
            <img src="https://image.tmdb.org/t/p/w500/silent_hill_2.jpg" alt="Silent Hill 2" onerror="this.src='https://via.placeholder.com/200x260/1a1e26/ffffff?text=Silent+Hill+2'">
        </div>
        <div class="game-card selected">
            <img src="https://image.tmdb.org/t/p/w500/tlou2.jpg" alt="The Last of Us Part II" onerror="this.src='https://via.placeholder.com/200x260/1a1e26/ffffff?text=The+Last+of+Us+Part+II'">
        </div>
        <div class="game-card">
            <img src="https://image.tmdb.org/t/p/w500/death_stranding.jpg" alt="Death Stranding" onerror="this.src='https://via.placeholder.com/200x260/1a1e26/ffffff?text=Death+Stranding'">
        </div>
        <div class="game-card">
            <img src="https://image.tmdb.org/t/p/w500/ff7_remake.jpg" alt="Final Fantasy VII Remake" onerror="this.src='https://via.placeholder.com/200x260/1a1e26/ffffff?text=FF7+Remake'">
        </div>
        <div class="game-card">
            <img src="https://image.tmdb.org/t/p/w500/ghost_tsushima.jpg" alt="Ghost of Tsushima" onerror="this.src='https://via.placeholder.com/200x260/1a1e26/ffffff?text=Ghost+of+Tsushima'">
        </div>
        <div class="game-card">
            <img src="https://via.placeholder.com/200x260/0070d1/ffffff?text=PlayStation+Store" alt="PS Store">
        </div>
        <div class="game-card">
            <img src="https://image.tmdb.org/t/p/w500/chrono_cross.jpg" alt="Chrono Cross" onerror="this.src='https://via.placeholder.com/200x260/1a1e26/ffffff?text=Chrono+Cross'">
        </div>
        <div class="game-card">
            <img src="https://image.tmdb.org/t/p/w500/shadow_colossus.jpg" alt="Shadow of the Colossus" onerror="this.src='https://via.placeholder.com/200x260/1a1e26/ffffff?text=Shadow+of+the+Colossus'">
        </div>
        <div class="game-card">
            <img src="https://image.tmdb.org/t/p/w500/resident_evil.jpg" alt="Resident Evil" onerror="this.src='https://via.placeholder.com/200x260/1a1e26/ffffff?text=Resident+Evil'">
        </div>
    </div>

    <!-- Bottom Action Bar -->
    <div class="bottom-bar">
        <div class="action-btn"><i class="fas fa-ellipsis-h"></i> OPTIONS</div>
        <div class="action-btn"><i class="fas fa-arrow-up"></i> TOP MENU</div>
        <div class="action-btn"><i class="fas fa-info-circle"></i> DETAILS</div>
        <div class="action-btn"><i class="fas fa-play"></i> PLAY</div>
    </div>

    <!-- Browser Overlay (Hidden by default) -->
    <div id="browser-overlay">
        <div class="browser-header">
            <button class="close-browser" onclick="closeBrowser()"><i class="fas fa-times"></i></button>
            <input type="text" id="url-input" placeholder="Enter URL (e.g., https://www.youtube.com)" onkeypress="handleUrlEnter(event)">
            <button onclick="navigate()">Go</button>
        </div>
        <iframe id="render-frame" sandbox="allow-same-origin allow-scripts allow-forms allow-popups"></iframe>
    </div>

    <script>
        // --- UI Interactions ---
        const browserTabBtn = document.getElementById('browser-tab-btn');
        const browserOverlay = document.getElementById('browser-overlay');
        const renderFrame = document.getElementById('render-frame');
        const urlInput = document.getElementById('url-input');

        browserTabBtn.addEventListener('click', () => {
            browserOverlay.style.display = 'flex';
            urlInput.focus();
        });

        function closeBrowser() {
            browserOverlay.style.display = 'none';
            renderFrame.src = 'about:blank'; // Clear frame to stop background processes
        }

        function handleUrlEnter(event) {
            if (event.key === 'Enter') {
                navigate();
            }
        }

        // --- Browser Logic (Epoxy + Libcurl.js + Blob Rendering) ---

        // Mock Epoxy implementation
        async function fetchViaEpoxy(url) {
            console.log(`[Epoxy] Attempting to fetch: ${url}`);
            // In a real scenario with Epoxy loaded, it would look something like:
            // return await epoxy.fetch(url).then(res => res.text());
            
            // For this demo, we simulate a successful fetch by throwing an error 
            // to test the fallback, unless it's a simple same-origin request.
            if (url.startsWith(window.location.origin)) {
                return await fetch(url).then(res => res.text());
            }
            throw new Error("Epoxy failed or not loaded. Falling back to Libcurl.");
        }

        // Mock Libcurl.js fallback implementation
        async function fetchViaLibCurl(url) {
            console.log(`[Libcurl.js] Fallback fetching: ${url}`);
            // In a real scenario with Libcurl.js WASM loaded:
            // await libcurl.init();
            // const response = await libcurl.fetch(url);
            // return await response.text();
            
            // For this demo, we will just throw an error because we don't actually have a proxy backend running.
            throw new Error("Libcurl.js fallback failed. A backend proxy server is required to bypass CORS.");
        }

        // Function to patch HTML before rendering in the blob
        function patchHtml(html, originalUrl) {
            // Ensure the URL has a protocol for the base tag
            let baseUrl = originalUrl;
            if (!baseUrl.startsWith('http://') && !baseUrl.startsWith('https://')) {
                baseUrl = 'https://' + baseUrl;
            }
            
            // Inject a <base> tag to fix relative paths (CSS, JS, Images)
            // This is crucial for the Blob URL to correctly resolve resources.
            const baseTag = `<base href="${baseUrl}">`;
            
            // If there's a <head>, inject right after it. Otherwise, prepend.
            if (html.includes('<head>')) {
                html = html.replace('<head>', `<head>\n${baseTag}`);
            } else {
                html = baseTag + html;
            }

            // Note: Real proxies do extensive URL rewriting here, including 
            // intercepting window.fetch, XMLHttpRequest, and WebSockets 
            // to route them through the proxy backend.
            
            return html;
        }

        async function navigate() {
            let url = urlInput.value.trim();
            if (!url) return;

            // Basic URL formatting
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
                urlInput.value = url;
            }

            renderFrame.src = 'about:blank'; // Clear frame
            document.body.style.cursor = 'wait';

            try {
                let htmlContent;
                
                // 1. Try Epoxy
                try {
                    htmlContent = await fetchViaEpoxy(url);
                } catch (epoxyError) {
                    console.warn(epoxyError.message);
                    // 2. Fallback to Libcurl.js
                    htmlContent = await fetchViaLibCurl(url);
                }

                // 3. Patch the HTML
                const patchedHtml = patchHtml(htmlContent, url);

                // 4. Create a Blob and render it
                const blob = new Blob([patchedHtml], { type: 'text/html' });
                const blobUrl = URL.createObjectURL(blob);
                
                console.log(`[Renderer] Rendering blob URL: ${blobUrl}`);
                renderFrame.src = blobUrl;

            } catch (error) {
                console.error("Navigation failed:", error);
                // Render an error page inside the iframe
                const errorHtml = `
                    <html>
                        <body style="background:#1a1e26; color:#fff; font-family:sans-serif; padding:40px; text-align:center;">
                            <h2 style="color:#ff4d4d;">Proxy Error</h2>
                            <p>Failed to load: <strong>${url}</strong></p>
                            <p style="color:#aaa; max-width:600px; margin: 20px auto; line-height: 1.6;">
                                Note: Pure frontend browsers cannot fetch cross-origin websites (like YouTube) without a dedicated backend proxy server (e.g., Wisp, Ultraviolet, or a custom Node.js Epoxy server). 
                                <br><br>
                                The browser attempted to use Epoxy, then fell back to Libcurl.js, but both require a running proxy backend to bypass CORS and CSP headers.
                            </p>
                        </body>
                    </html>
                `;
                const blob = new Blob([errorHtml], { type: 'text/html' });
                renderFrame.src = URL.createObjectURL(blob);
            } finally {
                document.body.style.cursor = 'default';
            }
        }
    </script>
</body>
</html>
