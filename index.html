<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexus</title>
<link rel="icon" id="fav" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230c0c0e'/%3E%3Cpath d='M20 46V18h5l14 18V18h5v28h-5L25 28v18z' fill='%2386efac'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/gh/luminsdk/script@latest/lumin.min.js" defer></script>
<style>
:root{--pill:#17171a;--line:#232327;--txt:#f4f4f5;--mut:#9d9da6;--acc:#86efac}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#0b0b0d;color:var(--txt);font-family:'Space Grotesk',system-ui,sans-serif;overflow:hidden}
.hidden{display:none!important}

/* ---------- animated backgrounds ---------- */
#bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:#07080c}
#bg .blob{position:absolute;width:52vmax;height:52vmax;border-radius:50%;filter:blur(90px);opacity:.5;mix-blend-mode:screen}
#bg .b1{background:#123b2a;top:-18vmax;left:-12vmax;animation:dr1 26s ease-in-out infinite alternate}
#bg .b2{background:#0e2b46;bottom:-20vmax;right:-14vmax;animation:dr2 32s ease-in-out infinite alternate}
#bg .b3{background:#2a1440;top:30%;left:44%;width:34vmax;height:34vmax;animation:dr3 22s ease-in-out infinite alternate}
@keyframes dr1{to{transform:translate(14vmax,10vmax) scale(1.15)}}
@keyframes dr2{to{transform:translate(-12vmax,-8vmax) scale(1.2)}}
@keyframes dr3{to{transform:translate(-16vmax,6vmax) scale(.8)}}
#bg.wall{background-size:cover;background-position:center}
#bg.wall::after{content:'';position:absolute;inset:0;background:rgba(4,6,10,.5)}
#bg.wall .blob{display:none}

/* nav */
#nav{position:fixed;top:14px;left:50%;transform:translateX(-50%);width:min(560px,94vw);height:62px;background:rgba(23,23,26,.92);border:1px solid var(--line);border-radius:18px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;z-index:40;backdrop-filter:blur(8px)}
#nav .logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.5px}
#nav .acts{display:flex;gap:6px}
#nav button{background:none;border:0;color:#e8e8ea;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;cursor:pointer}
#nav button:hover{background:#232327}
#nav svg.li{width:22px;height:22px}

main{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;z-index:1;padding-top:40px}
h1#hero{font-size:clamp(40px,6vw,60px);font-weight:700;letter-spacing:-1px}
h1#hero span{color:var(--acc)}

#dock{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;max-width:760px}
.tile{width:84px;height:84px;border-radius:20px;border:0;cursor:pointer;display:grid;place-items:center;position:relative;transition:transform .15s;box-shadow:0 6px 18px rgba(0,0,0,.45)}
.tile:hover{transform:translateY(-4px) scale(1.04)}
.tile svg{width:46px;height:46px}
.tile .lbl{position:absolute;bottom:7px;left:0;right:0;text-align:center;font-size:11px;font-weight:700;color:#fff}
.tile .ini{font-size:30px;font-weight:700;color:#fff}

#searchwrap{width:min(430px,88vw);height:56px;background:rgba(20,20,22,.9);border:1px solid var(--line);border-radius:999px;display:flex;align-items:center;gap:10px;padding:0 20px}
#searchwrap svg{width:18px;height:18px;color:var(--mut)}
#search{flex:1;background:none;border:0;outline:0;color:var(--txt);font:500 15px 'Space Grotesk';text-align:center}
#search::placeholder{color:var(--mut)}

.view{position:fixed;inset:0;padding:100px 5vw 40px;overflow:auto;z-index:5;background:rgba(7,8,12,.55);backdrop-filter:blur(6px)}
.vhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.vhead h2{font-size:26px;font-weight:700}
.vhead input{background:#141416;border:1px solid var(--line);border-radius:999px;color:var(--txt);padding:10px 18px;font:500 14px 'Space Grotesk';outline:none;width:240px}
#idbBadge{margin-left:auto;font-size:12.5px;color:var(--mut);border:1px solid var(--line);padding:7px 12px;border-radius:999px}
#idbBadge.ok{color:var(--acc);border-color:#1f3a2a}
#ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.gcard{background:var(--pill);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;text-align:left}
.gcard:hover{border-color:#3a3a41}
.gcard .im{height:96px;background:#202024;display:grid;place-items:center;font-size:30px;font-weight:700;color:#3f3f46}
.gcard .im img{width:100%;height:100%;object-fit:cover}
.gcard .tt{padding:10px 12px;font-size:13.5px;font-weight:500}
.gcard .cc{padding:0 12px 10px;font-size:11px;color:var(--mut)}
#appsGrid{display:flex;gap:18px;flex-wrap:wrap}
#luminHost{display:none}

#proxyView{position:fixed;inset:0;background:#0b0b0d;z-index:30;display:flex;flex-direction:column}
#pbar{height:54px;background:var(--pill);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 12px}
#pbar button{background:none;border:0;color:#d6d6da;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;cursor:pointer}
#pbar button:hover{background:#232327}
#purl{flex:1;background:#101013;border:1px solid var(--line);border-radius:999px;color:var(--txt);padding:9px 18px;font:500 13px 'Space Grotesk';outline:none}
#via{font-size:11px;color:var(--mut);max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#frame{flex:1;border:0;background:#fff}
#pload{position:absolute;inset:54px 0 0;display:grid;place-items:center;background:#0b0b0d;color:var(--mut);font-size:14px;z-index:2}

#player{position:fixed;inset:0;z-index:60;background:#000;display:flex;flex-direction:column}
#player .pb{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:#111}
#player button{background:#222;border:0;color:#fff;border-radius:8px;width:32px;height:32px;cursor:pointer}
#player iframe{flex:1;border:0}

.pop{position:fixed;top:88px;right:5vw;width:350px;background:var(--pill);border:1px solid var(--line);border-radius:16px;padding:16px;z-index:50}
.pop h3{font-size:13px;margin-bottom:10px;color:var(--mut);font-weight:500}
.rrow{display:flex;align-items:center;gap:10px;font-size:12.5px;padding:7px 0;border-top:1px solid var(--line)}
.rrow .dot{width:8px;height:8px;border-radius:50%;background:#555;flex:none}
.rrow .dot.ok{background:var(--acc)} .rrow .dot.bad{background:#f87171}
.rrow .ms{margin-left:auto;color:var(--mut)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:70;display:grid;place-items:center}
.modal .box{width:min(480px,92vw);background:var(--pill);border:1px solid var(--line);border-radius:18px;padding:22px}
.modal h3{margin-bottom:14px}
.modal label{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13.5px;color:#d6d6da;padding:8px 0}
.modal select{background:#101013;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:13px 'Space Grotesk'}
.modal textarea{width:100%;height:80px;background:#101013;color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:10px;font:12px monospace;margin:8px 0}
.modal .row{display:flex;gap:10px;justify-content:flex-end;margin-top:12px}
.modal button{background:#26262b;border:0;color:var(--txt);border-radius:10px;padding:9px 16px;cursor:pointer;font-weight:600}
.modal button.prime{background:var(--acc);color:#08110b}
#gear{position:fixed;bottom:16px;right:16px;z-index:40;background:var(--pill);border:1px solid var(--line);color:var(--mut);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;cursor:pointer}

/* cloak */
#cloak{position:fixed;inset:0;background:#fff;z-index:100;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#202124;overflow:auto}
#cloak .wrap{max-width:640px;margin:0 auto;padding:12vh 24px 0}
#cloak h1{font-size:22px;font-weight:600;margin-bottom:10px}
#cloak p{font-size:14px;color:#5f6368;line-height:1.6}
#cloak .err{margin-top:26px;font-size:13px;color:#5f6368}
#cloak .btns{margin-top:26px}
#cloak .btns button{background:#f2f6fd;border:1px solid #dadce0;color:#1a73e8;border-radius:6px;padding:8px 22px;font-size:13px;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<div id="bg" class="aurora"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i></div>

<nav id="nav">
  <div class="logo">
    <svg width="27" height="27" viewBox="0 0 24 24" fill="none">
      <defs><linearGradient id="lg1" x1="0" y1="0" x2="24" y2="24"><stop stop-color="#86efac"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs>
      <path d="M12 2l8.5 5v10L12 22l-8.5-5V7z" stroke="url(#lg1)" stroke-width="1.7"/>
      <path d="M9.2 15.8V8.6l5.6 7.2V8.6" stroke="url(#lg1)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span>ne<b style="color:var(--acc)">x</b>us</span>
  </div>
  <div class="acts">
    <button id="navGames" title="games"><i data-lucide="gamepad-2"></i></button>
    <button id="navApps" title="apps"><i data-lucide="layout-grid"></i></button>
    <button id="navRelays" title="relays & engine"><i data-lucide="handshake"></i></button>
    <button id="navAdd" title="add shortcut"><i data-lucide="plus"></i></button>
  </div>
</nav>

<main id="viewHome">
  <h1 id="hero">ne<span>x</span>us</h1>
  <div id="dock"></div>
  <div id="searchwrap">
    <i data-lucide="search"></i>
    <input id="search" placeholder="search anything..." autocomplete="off" spellcheck="false">
  </div>
</main>

<section id="viewGames" class="view hidden">
  <div class="vhead">
    <h2>games</h2>
    <input id="gsearch" placeholder="search games..." autocomplete="off">
    <span id="idbBadge">IndexedDB: connecting…</span>
  </div>
  <div id="ggrid"></div>
  <div id="luminHost"></div>
</section>

<section id="viewApps" class="view hidden">
  <div class="vhead"><h2>apps</h2></div>
  <div id="appsGrid"></div>
</section>

<div id="relayPop" class="pop hidden">
  <h3>engine: libcurl.js (WASM TLS) → Wisp relays → CORS relays → patch layer</h3>
  <div id="relayRows"></div>
</div>

<div id="settings" class="modal hidden">
  <div class="box">
    <h3>nexus settings</h3>
    <label>background
      <select id="optBg">
        <option value="aurora">Aurora (animated)</option>
        <option value="space">Space BG</option>
        <option value="planet">Planet BG</option>
        <option value="oled">OLED BG</option>
        <option value="oled2">OLED BG 2</option>
      </select>
    </label>
    <label>auto-cloak when switching tabs <input type="checkbox" id="optCloak" checked></label>
    <label>cloak tab title + favicon <input type="checkbox" id="optTitle" checked></label>
    <label style="display:block">Wisp relays (one per line)
      <textarea id="optRelays"></textarea>
    </label>
    <div class="row">
      <button id="setClose">close</button>
      <button id="setSave" class="prime">save</button>
    </div>
  </div>
</div>

<div id="proxyView" class="hidden">
  <div id="pbar">
    <button id="pBack" title="back"><i data-lucide="arrow-left"></i></button>
    <button id="pReload" title="reload"><i data-lucide="rotate-cw"></i></button>
    <input id="purl" spellcheck="false">
    <span id="via"></span>
    <button id="pClose" title="close"><i data-lucide="x"></i></button>
  </div>
  <div id="pload">routing through relays…</div>
  <iframe id="frame" allow="autoplay; fullscreen; encrypted-media; picture-in-picture; gamepad"></iframe>
</div>

<div id="player" class="hidden">
  <div class="pb"><b id="pTitle">game</b><button id="pExit">✕</button></div>
  <iframe id="pFrame" allow="autoplay; fullscreen; pointer-lock; gamepad"></iframe>
</div>

<button id="gear" title="settings"><i data-lucide="settings"></i></button>

<div id="cloak">
  <div class="wrap">
    <div class="ico">
      <svg width="72" height="72" viewBox="0 0 72 72" fill="none"><circle cx="36" cy="36" r="30" stroke="#9aa0a6" stroke-width="4"/><path d="M24 24l24 24M48 24L24 48" stroke="#9aa0a6" stroke-width="4" stroke-linecap="round"/></svg>
    </div>
    <h1>This site can’t be reached</h1>
    <p><b id="cloakHost"></b> refused to connect.</p>
    <div class="btns"><button onclick="location.reload()">Reload</button></div>
    <p class="err">ERR_ACCESS_DENIED</p>
  </div>
</div>

<script>
'use strict';
const $ = (s) => document.querySelector(s);

/* ================= relays & transports ================= */
const DEFAULT_RELAYS = ['wss://wisp.mercurywork.shop/'];
const CORS = [
  { name: 'corsproxy.io', w: (u) => 'https://corsproxy.io/?url=' + encodeURIComponent(u) },
  { name: 'allorigins',   w: (u) => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u) },
  { name: 'allorigins-get', w: (u) => 'https://api.allorigins.win/get?url=' + encodeURIComponent(u),
    unwrap: async (r) => { const j = await r.json(); return { buf: new TextEncoder().encode(j.contents || ''), ct: (j.content_type || 'text/html').split(';')[0] }; } },
  { name: 'codetabs',     w: (u) => 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u) },
];
let assetIdx = 0;                       // CORS relay currently used for <img>/<link>/…
function getRelays(){ try { const v = JSON.parse(localStorage.getItem('nx_relays') || 'null'); if (Array.isArray(v) && v.length) return v; } catch(e){} return DEFAULT_RELAYS; }

/* libcurl.js inside a Blob worker (single-file: no extra assets) */
const LCW_SRC = `
let bootErr = null;
try { importScripts('https://cdn.jsdelivr.net/npm/libcurl.js@0.7.1/libcurl.js'); }
catch (e) { bootErr = 'importScripts: ' + (e && e.message || e); }
let ready = null, cur = null;
self.onmessage = async (e) => {
  const { id, url, relay } = e.data || {};
  try {
    if (bootErr) throw new Error(bootErr);
    if (!ready) ready = libcurl.load_wasm('https://cdn.jsdelivr.net/npm/libcurl.js@0.7.1/libcurl.wasm');
    await ready;
    if (relay && relay !== cur) { libcurl.set_websocket(relay); cur = relay; }
    const r = await libcurl.fetch(url);
    const buf = await r.arrayBuffer();
    const headers = [];
    if (Array.isArray(r.raw_headers)) headers.push(...r.raw_headers);
    else r.headers.forEach((v, k) => headers.push([k, v]));
    self.postMessage({ id, ok: r.ok, status: r.status, headers, buf }, [buf]);
  } catch (err) { self.postMessage({ id, error: String((err && err.message) || err) }); }
};
`;
let lcw = null, lcwDead = false;
const lcq = {}; let lcid = 0;
function getLCW(){
  if (lcwDead) return null;
  if (lcw) return lcw;
  try {
    lcw = new Worker(URL.createObjectURL(new Blob([LCW_SRC], { type: 'text/javascript' })));
  } catch (e) { lcwDead = true; return null; }
  lcw.onmessage = (e) => { const d = e.data || {}; const cb = lcq[d.id]; if (cb) { delete lcq[d.id]; cb(d); } };
  lcw.onerror = () => { lcwDead = true; };
  return lcw;
}
function libcurlFetch(url, relay) {
  return new Promise((res, rej) => {
    const w = getLCW(); if (!w) return rej(new Error('no worker'));
    const id = ++lcid;
    const t = setTimeout(() => { if (lcq[id]) { delete lcq[id]; rej(new Error('libcurl timeout')); } }, 15000);
    lcq[id] = (d) => { clearTimeout(t); d.error ? rej(new Error(d.error)) : res(d); };
    w.postMessage({ id, url, relay });
  });
}

/* raced chain for the main document; remembers which CORS relay is alive */
async function chainFetch(url) {
  const relays = getRelays();
  const attempts = [];
  attempts.push((async () => {
    let last = null;
    for (let pass = 0; pass < 2; pass++) {
      for (const relay of relays) {
        for (let k = 0; k < 2; k++) {
          try {
            const d = await libcurlFetch(url, relay);
            if (d && d.buf && (d.ok || d.status < 500)) return { buf: d.buf, ct: (new Map(d.headers)).get('content-type') || 'text/html', via: 'libcurl<' + relay.replace(/wss?:\/\//, '') + '>' };
          } catch (e) { last = e; }
        }
      }
      lcw = null;   // fresh worker: clears libcurl pooled-connection SSL flakes
    }
    throw last || new Error('libcurl failed');
  })());
  CORS.forEach((c, i) => attempts.push(fetch(c.w(url), { credentials: 'omit' }).then(async (r) => {
    if (!r.ok) throw new Error(c.name + ' ' + r.status);
    if (c.unwrap) { const u = await c.unwrap(r); assetIdx = i; return { buf: u.buf, ct: u.ct, via: c.name }; }
    assetIdx = i;
    return { buf: await r.arrayBuffer(), ct: r.headers.get('content-type') || 'text/html', via: c.name };
  })));
  attempts.push(fetch(url, { credentials: 'omit' }).then(async (r) => {
    if (!r.ok) throw new Error('direct ' + r.status);
    return { buf: await r.arrayBuffer(), ct: r.headers.get('content-type') || 'text/html', via: 'direct' };
  }));
  try { return await Promise.any(attempts); }
  catch (e) { throw new Error((e.errors || [e]).map(x => x.message || x).join(' | ')); }
}

/* ================= patcher (page context, has DOMParser) ================= */
function abs(target, u) { try { const a = new URL(u, target).href; return /^https?:\/\//i.test(a) ? a : null; } catch (e) { return null; } }
function wrapAsset(target, u) { const a = abs(target, u); return a ? CORS[assetIdx].w(a) : u; }
function cssRewrite(css, target) {
  return String(css || '').replace(/url\(\s*(['"]?)([^)"']+)\1\s*\)/gi, (m, q, u) => {
    const a = abs(target, u); return a ? 'url(' + q + CORS[assetIdx].w(a) + q + ')' : m;
  });
}
const URL_ATTRS = [['a','href'],['link','href'],['img','src'],['script','src'],['iframe','src'],['frame','src'],['embed','src'],['object','data'],['source','src'],['track','src'],['video','src'],['video','poster'],['audio','src'],['input','src'],['form','action'],['body','background']];
function patchDoc(html, target) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  doc.querySelectorAll('meta[http-equiv]').forEach((m) => {
    const v = (m.getAttribute('http-equiv') || '').toLowerCase();
    if (v.includes('content-security-policy')) m.remove();
  });
  let base = doc.querySelector('base');
  if (!base) { base = doc.createElement('base'); (doc.head || doc.documentElement).prepend(base); }
  base.setAttribute('href', target);
  for (const [tag, at] of URL_ATTRS) doc.querySelectorAll(tag + '[' + at + ']').forEach((el) => {
    const a = abs(target, el.getAttribute(at)); if (a) el.setAttribute(at, CORS[assetIdx].w(a));
  });
  doc.querySelectorAll('[srcset]').forEach((el) => el.setAttribute('srcset', el.getAttribute('srcset').split(',').map(p => {
    const s = p.trim().split(/\s+/); const a = abs(target, s[0]); if (a) s[0] = CORS[assetIdx].w(a); return s.join(' ');
  }).join(', ')));
  doc.querySelectorAll('[integrity]').forEach(el => el.removeAttribute('integrity'));
  doc.querySelectorAll('[crossorigin]').forEach(el => el.removeAttribute('crossorigin'));
  doc.querySelectorAll('[style]').forEach(el => el.setAttribute('style', cssRewrite(el.getAttribute('style'), target)));
  doc.querySelectorAll('style').forEach(st => (st.textContent = cssRewrite(st.textContent, target)));
  const s = doc.createElement('script');
  s.textContent = SHIM
    .replace(/__NX_TARGET__/g, () => JSON.stringify(target))
    .replace(/__NX_CORS__/g, () => JSON.stringify(CORS.map(c => c.name)))
    .replace(/__NX_CORSW__/g, () => JSON.stringify(CORS.map(c => c.w('U')) .map(t => t.replace('U', '\u0001'))))
    .replace(/__NX_RELAYS__/g, () => JSON.stringify(getRelays()))
    .replace(/__NX_ASSET__/g, () => String(assetIdx));
  (doc.head || doc.documentElement).prepend(s);
  return '<!DOCTYPE html>' + doc.documentElement.outerHTML;
}

/* ================= shim injected into proxied docs ================= */
const SHIM = `(function(){
if (window.__NX_SHIM) return; window.__NX_SHIM = 1;
var TARGET = __NX_TARGET__;
var RELAYS = __NX_RELAYS__;
var NAMES = __NX_CORS__;
var TMPL = __NX_CORSW__;
var AIDX = __NX_ASSET__;
function W(u, i){ var a; try { a = new URL(u, TARGET).href; } catch(e){ return u; }
  if (!/^https?:\\/\\//i.test(a)) return u;
  return TMPL[i == null ? AIDX : i].replace('\\u0001', encodeURIComponent(a)); }
window.__nxW = W;
var of = window.fetch;
window.fetch = function(i, init){
  if (typeof i === 'string' && /^https?:/i.test(i)) {
    var chain = [AIDX,0,1,2].filter(function(v,idx,arr){ return arr.indexOf(v)===idx; });
    var k = 0; var self=this; var args=arguments;

  r.onupgradeneeded=()=>{ const db=r.result; if(!db.objectStoreNames.contains('kv')) db.createObjectStore('kv'); if(!db.objectStoreNames.contains('games')) db.createObjectStore('games',{keyPath:'id'}); };

  else renderGames(await gamesAll(), false);

  $('#optBg').value = localStorage.getItem('nx_bg') || 'aurora';
  $('#optCloak').checked = localStorage.getItem('nx_cloak') !== '0';
  $('#optTitle').checked = localStorage.getItem('nx_title') !== '0';
  $('#optRelays').value = getRelays().join('\n');
};
$('#setClose').onclick = () => $('#settings').classList.add('hidden');
$('#setSave').onclick = () => {
  localStorage.setItem('nx_cloak', $('#optCloak').checked ? '1':'0');
  localStorage.setItem('nx_title', $('#optTitle').checked ? '1':'0');
  const relays = $('#optRelays').value.split('\n').map(s=>s.trim()).filter(Boolean);
  localStorage.setItem('nx_relays', JSON.stringify(relays.length ? relays : DEFAULT_RELAYS));
  applyBg($('#optBg').value);
  $('#settings').classList.add('hidden');
};

/* ================= cloak ================= */
let unlocked = false;
const CLOAK_FAV = 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%228%22 fill=%22%23fff%22/%3E%3Cpath d=%22M14 8h24l12 12v36H14z%22 fill=%22%234285F4%22/%3E%3C/svg%3E';
$('#cloakHost').textContent = location.hostname || 'this site';
function cloakOn(){ $('#cloak').classList.remove('hidden'); unlocked=false;
  if (localStorage.getItem('nx_title') !== '0') { document.title='Google Docs'; $('#fav').href=CLOAK_FAV; } }
function cloakOff(){ $('#cloak').classList.add('hidden'); unlocked=true; document.title='Nexus'; }
window.addEventListener('keydown', e => { if (e.key==='~' || e.key==='`') unlocked ? cloakOn() : cloakOff(); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (localStorage.getItem('nx_title')!=='0'){ document.title='Google Docs'; $('#fav').href=CLOAK_FAV; } }
  else if (localStorage.getItem('nx_cloak')!=='0') cloakOn();
});

/* ================= boot ================= */
window.addEventListener('load', () => {
  applyBg(localStorage.getItem('nx_bg') || 'aurora');
  (async () => { for (let i = 0; i < CORS.length; i++) { try { const r = await fetch(CORS[i].w('https://example.com')); if (r.ok) { assetIdx = i; return; } } catch (e) {} } })();
  if (window.lucide) lucide.createIcons();
  renderDock(); renderApps(); cloakOn();
  setTimeout(()=>{ if (window.lucide) lucide.createIcons(); }, 800);
});
</script>
