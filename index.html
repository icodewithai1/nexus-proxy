<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hyperion — libcurl.js Browser</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌐</text></svg>">
<style>
/* Hyperion browser — dark theme */
:root{
  --bg0:#0d1017; --bg1:#141926; --bg2:#1b2233; --bg3:#232c42;
  --fg0:#e8ecf6; --fg1:#a9b3c9; --fg2:#6b7690;
  --acc:#5b8cff; --acc2:#7c5bff; --ok:#3ddc84; --warn:#ffb454; --err:#ff5f6d;
  --line:#262f47; --omni:#10141f;
  --mono:ui-monospace,"Cascadia Mono","SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  background:var(--bg0);color:var(--fg0);
  font:13px/1.45 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  display:flex;
}
#app{display:flex;flex-direction:column;width:100%;height:100%}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font:inherit;color:inherit}

/* ── tab strip ─────────────────────────────────── */
#tabstrip{
  display:flex;align-items:flex-end;gap:4px;
  background:var(--bg0);padding:6px 8px 0;min-height:38px;
  border-bottom:1px solid var(--line);user-select:none;
}
#tabs{display:flex;gap:4px;overflow-x:auto;max-width:calc(100% - 44px);scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{
  display:flex;align-items:center;gap:7px;
  min-width:110px;max-width:220px;padding:7px 10px;
  background:var(--bg1);border:1px solid var(--line);border-bottom:none;
  border-radius:9px 9px 0 0;color:var(--fg1);cursor:pointer;
  white-space:nowrap;overflow:hidden;flex-shrink:0;
}
.tab.active{background:var(--bg2);color:var(--fg0)}
.tab .favicon{width:14px;height:14px;flex:0 0 14px;object-fit:contain;border-radius:3px}
.tab .tab-title{overflow:hidden;text-overflow:ellipsis;flex:1;font-size:12px}
.tab .tab-close{
  width:16px;height:16px;line-height:14px;text-align:center;border-radius:4px;
  font-size:12px;opacity:.55;flex:0 0 16px
}
.tab .tab-close:hover{background:#ffffff22;opacity:1}
.tab.loading .favicon{animation:pulse 1s infinite alternate}
@keyframes pulse{from{opacity:.35}to{opacity:1}}
#btn-newtab{
  margin-bottom:4px;width:30px;height:28px;border-radius:7px;
  color:var(--fg1);font-size:15px
}
#btn-newtab:hover{background:var(--bg2)}

/* ── toolbar ───────────────────────────────────── */
#toolbar{
  display:flex;align-items:center;gap:4px;
  background:var(--bg2);padding:7px 9px;border-bottom:1px solid var(--line);
}
.iconbtn{
  width:32px;height:30px;border-radius:7px;color:var(--fg1);
  font-size:14px;display:flex;align-items:center;justify-content:center;flex:0 0 auto
}
.iconbtn:hover{background:#ffffff14;color:var(--fg0)}
.iconbtn:disabled{opacity:.3;cursor:default;background:none}
#omni-wrap{
  flex:1;display:flex;align-items:center;gap:6px;
  background:var(--omni);border:1px solid var(--line);
  border-radius:18px;padding:0 6px 0 10px;height:32px;margin:0 6px;
}
#omni-wrap:focus-within{border-color:var(--acc);box-shadow:0 0 0 2px #5b8cff33}
#engine-badge{
  font:10.5px/1 var(--mono);padding:3px 7px;border-radius:9px;
  background:#5b8cff26;color:#9db9ff;border:1px solid #5b8cff44;
  white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis
}
#engine-badge.relay{background:#3ddc8422;color:#7ce8ad;border-color:#3ddc8444}
#engine-badge.public{background:#ffb45422;color:#ffd39a;border-color:#ffb45444}
#engine-badge.err{background:#ff5f6d22;color:#ff9aa4;border-color:#ff5f6d55}
#engine-badge.dim{background:#ffffff10;color:var(--fg1);border-color:var(--line)}
#omni{flex:1;background:none;border:none;outline:none;font-size:13.5px;min-width:40px}
#btn-go{width:26px;height:26px;font-size:13px}
#engine-select-wrap select{
  background:var(--omni);border:1px solid var(--line);border-radius:7px;
  font:11px var(--mono);padding:5px 4px;outline:none;color:var(--fg1)
}

/* ── bookmark bar ──────────────────────────────── */
#bookmarkbar{
  display:flex;gap:2px;background:var(--bg1);
  border-bottom:1px solid var(--line);padding:3px 10px;min-height:0;
  overflow-x:auto;scrollbar-width:none
}
#bookmarkbar:empty{display:none}
.bm-chip{
  font-size:11.5px;color:var(--fg1);padding:3px 9px;border-radius:6px;
  white-space:nowrap;display:flex;gap:6px;align-items:center
}
.bm-chip:hover{background:#ffffff14;color:var(--fg0)}
.bm-chip .x{opacity:.4;font-size:10px}
.bm-chip .x:hover{opacity:1;color:var(--err)}

/* ── viewport ──────────────────────────────────── */
#viewport{flex:1;position:relative;background:#fff;overflow:hidden}
.tabview{position:absolute;inset:0;display:none}
.tabview.active{display:block}
.tabview iframe{
  position:absolute;inset:0;width:100%;height:100%;border:none;background:#fff
}
.tabview .overlay{
  position:absolute;inset:0;overflow:auto;display:none;
  background:
    radial-gradient(1000px 500px at 20% -10%, #5b8cff1f, transparent),
    radial-gradient(900px 600px at 90% 110%, #7c5bff1c, transparent),
    var(--bg0);
}
.tabview .overlay.show{display:block}

/* start page */
.start{max-width:860px;margin:0 auto;padding:9vh 30px 40px;color:var(--fg0)}
.start h1{
  font-size:44px;font-weight:800;letter-spacing:-1.5px;
  background:linear-gradient(92deg,var(--acc),var(--acc2),#ff6bd6);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  display:flex;align-items:baseline;gap:14px
}
.start h1 small{font-size:13px;font-weight:600;color:var(--fg2);letter-spacing:0}
.start .sub{color:var(--fg1);margin:10px 0 30px;font-size:14px}
.start .sub b{color:#9db9ff;font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{
  background:var(--bg1);border:1px solid var(--line);border-radius:12px;
  padding:14px;cursor:pointer;transition:.12s;text-align:left
}
.tile:hover{border-color:var(--acc);transform:translateY(-2px);background:var(--bg2)}
.tile .t-ico{font-size:20px}
.tile .t-name{font-weight:600;margin-top:8px;font-size:13px}
.tile .t-url{color:var(--fg2);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.start .hint{margin-top:28px;color:var(--fg2);font-size:12px;line-height:1.9}
.start .hint code{background:var(--bg2);padding:1px 6px;border-radius:5px;font-family:var(--mono)}

/* error page */
.errpage{max-width:640px;margin:0 auto;padding:12vh 30px;text-align:center}
.errpage .big{font-size:52px}
.errpage h2{margin:14px 0 8px;font-size:20px}
.errpage p{color:var(--fg1);font-family:var(--mono);font-size:12px;word-break:break-all}
.errpage .row{margin-top:22px;display:flex;gap:10px;justify-content:center}
.btn{
  background:var(--bg2);border:1px solid var(--line);color:var(--fg0);
  padding:8px 16px;border-radius:9px;cursor:pointer;font-size:13px
}
.btn:hover{border-color:var(--acc);background:var(--bg3)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}

/* ── devtools ──────────────────────────────────── */
#devtools{
  height:280px;min-height:120px;display:flex;flex-direction:column;
  background:var(--bg1);border-top:1px solid var(--line);resize:vertical;
  overflow:hidden
}
#devtools.hidden{display:none}
#dev-head{
  display:flex;align-items:center;justify-content:space-between;
  background:var(--bg2);border-bottom:1px solid var(--line);padding:0 6px
}
#dev-tabs{display:flex}
.dev-tab{
  padding:8px 14px;font-size:12px;color:var(--fg1);
  border-bottom:2px solid transparent
}
.dev-tab.active{color:var(--fg0);border-bottom-color:var(--acc)}
.dev-head-actions{display:flex;gap:4px}
.mini{
  font-size:11px;color:var(--fg1);padding:3px 9px;border-radius:6px;
  border:1px solid var(--line)
}
.mini:hover{background:#ffffff14;color:var(--fg0)}
#dev-body{flex:1;position:relative;overflow:hidden}
.dev-pane{position:absolute;inset:0;display:none;overflow:auto}
.dev-pane.active{display:block}

/* console */
#dev-console{display:none;flex-direction:column}
#dev-console.active{display:flex}
#console-lines{flex:1;overflow:auto;padding:6px 0;font-family:var(--mono);font-size:12px}
.cline{padding:2px 12px;white-space:pre-wrap;word-break:break-word;border-bottom:1px solid #ffffff08}
.cline.warn{background:#ffb4540f;color:var(--warn)}
.cline.error{background:#ff5f6d12;color:#ff8f98}
.cline.info{color:#8fd3ff}
.cline.debug{color:var(--fg2)}
.cline .csrc{color:var(--fg2);font-size:10px;margin-left:8px}
#console-input-row{
  display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);
  padding:6px 12px;background:var(--bg2)
}
#console-input-row .prompt{color:var(--acc);font-family:var(--mono);font-weight:700}
#console-input{
  flex:1;background:none;border:none;outline:none;
  font-family:var(--mono);font-size:12.5px
}

/* network */
#net-table{width:100%;border-collapse:collapse;font-size:12px}
#net-table th{
  text-align:left;padding:6px 10px;color:var(--fg2);font-weight:500;
  background:var(--bg2);position:sticky;top:0;border-bottom:1px solid var(--line);
  font-size:11px
}
#net-table td{padding:4px 10px;border-bottom:1px solid #ffffff08;font-family:var(--mono);
  white-space:nowrap;max-width:420px;overflow:hidden;text-overflow:ellipsis}
#net-table tr:hover td{background:#ffffff0a;cursor:pointer}
.st-2{color:var(--ok)} .st-3{color:#9db9ff} .st-4,.st-5{color:var(--err)} .st-0{color:var(--warn)}
.eng-libcurl{color:#c3a6ff} .eng-relay{color:#7ce8ad} .eng-public{color:#ffd39a}

/* source */
#source-view{
  font-family:var(--mono);font-size:12px;padding:12px;white-space:pre-wrap;
  word-break:break-all;color:#cfe0ff
}

/* ── status bar ────────────────────────────────── */
#statusbar{
  display:flex;gap:16px;align-items:center;background:var(--bg0);
  border-top:1px solid var(--line);padding:3px 12px;font-size:11px;
  color:var(--fg1);font-family:var(--mono);user-select:none;min-height:22px
}
.st-item.ok{color:var(--ok)} .st-item.dim{color:var(--fg2);flex:1;text-align:right;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:50%}
.st-spacer{flex:0}

/* ── library panel ─────────────────────────────── */
#library{
  position:absolute;right:0;top:78px;bottom:24px;width:340px;z-index:40;
  background:var(--bg1);border-left:1px solid var(--line);
  display:flex;flex-direction:column;box-shadow:-14px 0 40px #00000066;
  border-radius:10px 0 0 0
}
#library.hidden{display:none}
#library-head{display:flex;align-items:center;background:var(--bg2);
  border-bottom:1px solid var(--line);padding:4px 6px;gap:4px}
.lib-tab{padding:6px 12px;font-size:12px;color:var(--fg1);border-radius:6px}
.lib-tab.active{background:#ffffff14;color:var(--fg0)}
#library-close{margin-left:auto}
#library-body{flex:1;overflow:auto;padding:6px 0}
.lib-item{padding:7px 14px;cursor:pointer;border-bottom:1px solid #ffffff08;
  display:flex;flex-direction:column;gap:2px}
.lib-item:hover{background:#ffffff0a}
.lib-item .li-title{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lib-item .li-url{font-size:10.5px;color:var(--fg2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-family:var(--mono)}
.lib-item .li-date{font-size:10px;color:var(--fg2)}
.lib-empty{padding:30px;text-align:center;color:var(--fg2);font-size:12px}

/* ── toasts ────────────────────────────────────── */
#toasts{position:fixed;bottom:36px;left:50%;transform:translateX(-50%);z-index:99;
  display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{
  background:var(--bg3);border:1px solid var(--line);color:var(--fg0);
  padding:9px 18px;border-radius:10px;font-size:12.5px;
  box-shadow:0 8px 30px #00000088;animation:tin .18s ease
}
.toast.err{border-color:#ff5f6d77}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#2c3652;border-radius:6px}
::-webkit-scrollbar-track{background:transparent}

</style>
</head>
<body>

<div id="app">

  <!-- ── tab strip ─────────────────────────────────────────────── -->
  <div id="tabstrip">
    <div id="tabs" role="tablist"></div>
    <button class="iconbtn" id="btn-newtab" title="New tab (Ctrl+T)">＋</button>
  </div>

  <!-- ── toolbar ───────────────────────────────────────────────── -->
  <div id="toolbar">
    <button class="iconbtn" id="btn-back" title="Back (Alt+←)">←</button>
    <button class="iconbtn" id="btn-fwd" title="Forward (Alt+→)">→</button>
    <button class="iconbtn" id="btn-reload" title="Reload (Ctrl+R)">⟳</button>
    <button class="iconbtn" id="btn-home" title="Home">⌂</button>

    <div id="omni-wrap">
      <span id="engine-badge" title="Active network engine">…</span>
      <input id="omni" type="text" spellcheck="false" autocomplete="off"
             placeholder="Search the web or enter a URL">
      <button class="iconbtn" id="btn-go" title="Go">➜</button>
    </div>

    <button class="iconbtn" id="btn-bookmark" title="Bookmark this page">☆</button>
    <button class="iconbtn" id="btn-library" title="History & bookmarks">☰</button>
    <button class="iconbtn" id="btn-source" title="View source">{ }</button>
    <button class="iconbtn" id="btn-dev" title="Developer tools (F12)">⌨</button>
    <div id="engine-select-wrap" title="Network engine">
      <select id="engine-select">
        <option value="auto">auto</option>
        <option value="libcurl">libcurl + wisp</option>
        <option value="relay">local relay</option>
        <option value="public">public cors</option>
      </select>
    </div>
  </div>

  <!-- ── bookmark bar ──────────────────────────────────────────── -->
  <div id="bookmarkbar"></div>

  <!-- ── viewport (tab views injected here) ────────────────────── -->
  <div id="viewport"></div>

  <!-- ── devtools drawer ───────────────────────────────────────── -->
  <div id="devtools" class="hidden">
    <div id="dev-head">
      <div id="dev-tabs">
        <button class="dev-tab active" data-dev="console">Console</button>
        <button class="dev-tab" data-dev="network">Network</button>
        <button class="dev-tab" data-dev="source">Source</button>
      </div>
      <div class="dev-head-actions">
        <button class="mini" id="dev-clear">clear</button>
        <button class="mini" id="dev-close">✕</button>
      </div>
    </div>
    <div id="dev-body">
      <div id="dev-console" class="dev-pane active">
        <div id="console-lines"></div>
        <div id="console-input-row">
          <span class="prompt">›</span>
          <input id="console-input" spellcheck="false"
                 placeholder="evaluate in page context (runs in sandbox)">
        </div>
      </div>
      <div id="dev-network" class="dev-pane">
        <table id="net-table">
          <thead><tr><th>▼</th><th>Status</th><th>Method</th><th>Name</th>
            <th>Engine</th><th>Size</th><th>Time</th></tr></thead>
          <tbody id="net-rows"></tbody>
        </table>
      </div>
      <div id="dev-source" class="dev-pane">
        <pre id="source-view">// open a page, then click “view source”</pre>
      </div>
    </div>
  </div>

  <!-- ── status bar ────────────────────────────────────────────── -->
  <div id="statusbar">
    <span id="st-engine" class="st-item">engine: booting…</span>
    <span id="st-wisp" class="st-item">wisp: …</span>
    <span id="st-curl" class="st-item">libcurl: …</span>
    <span class="st-spacer"></span>
    <span id="st-scripts" class="st-item ok">scripts: auto-allowed ✓</span>
    <span id="st-url" class="st-item dim"></span>
  </div>

  <!-- ── library side panel (history + bookmarks) ──────────────── -->
  <div id="library" class="hidden">
    <div id="library-head">
      <button class="lib-tab active" data-lib="history">History</button>
      <button class="lib-tab" data-lib="bookmarks">Bookmarks</button>
      <button class="mini" id="library-close">✕</button>
    </div>
    <div id="library-body"></div>
  </div>

  <div id="toasts"></div>
</div>

<script>
/* Hyperion — a browser built on libcurl.js (WebAssembly) + Wisp + local relay.

"use strict";

/* ═══════════════════════ state ═══════════════════════ */
const P = location.origin + "/proxy/";           // path-form proxy prefix
const CHROME_UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36";
const IOS_UA = "Mozilla/5.0 (iPhone; CPU iPhone OS 17_5 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.5 Mobile/15E148 Safari/604.1";

const state = {
  tabs: [],
  active: null,
  enginePref: localStorage.getItem("hyperion.engine") || "auto",
  lastEngine: "—",
  libcurlReady: false,
  wispOk: false,
  libcurlErr: null,
  localMode: false,           // true: served by server.py (local /proxy + /wisp/)
  cookieSession: null,
  runtimeSrc: "",
  ua: localStorage.getItem("hyperion.ua") || CHROME_UA,
  history: loadJSON("hyperion.history", []),
  bookmarks: loadJSON("hyperion.bookmarks", []),
  devOpen: false,
  devTab: "console",

function toast(msg, isErr) {
  const el = document.createElement("div");
  el.className = "toast" + (isErr ? " err" : "");

  $("toasts").appendChild(el);
  setTimeout(() => el.remove(), 3800);

/* ═══════════════════════ engines ═══════════════════════
   Each engine returns:
   {status, statusText, headers:[[k,v]], body:ArrayBuffer, finalUrl, engine}  */

function wispUrl() {
  const custom = localStorage.getItem("hyperion.wisp");
  if (custom) return custom.endsWith("/") ? custom : custom + "/";
  if (state.localMode) return location.origin + "/wisp/";
  return "wss://wisp.mercurywork.shop/";       // official public wisp server
}

    const h = new URL(wispUrl()).host;
    return h === location.host ? "local" : h;
  } catch { return "wisp"; }

async function engineLibcurl(method, url, opts = {}) {
  if (!state.libcurlReady) throw new Error("libcurl wasm not ready");
  const headers = [...(opts.headers || [])];
  if (!headers.some(([k]) => k.toLowerCase() === "user-agent"))
    headers.push(["User-Agent", state.ua]);

  const f = sess ? sess.fetch.bind(sess) : libcurl.fetch.bind(libcurl);

    status: r.status, statusText: r.statusText, headers: hdrs, body,
    finalUrl: (r.url && /^https?:/.test(r.url)) ? r.url : url,

async function engineRelay(method, url, opts = {}) {
  const headers = new Headers();
  for (const [k, v] of opts.headers || []) {
    const lk = k.toLowerCase();

    status: r.status, statusText: r.statusText, headers: hdrs, body,

const PUBLIC_PROXIES = [

  (u) => "https://api.cors.lol/?url=" + encodeURIComponent(u),
  (u) => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u),
  (u) => "https://api.codetabs.com/v1/proxy/?quest=" + encodeURIComponent(u),

async function enginePublic(method, url, opts = {}) {
  if (method !== "GET" && method !== "HEAD") throw new Error("public proxy: GET only");

    const tpl = PUBLIC_PROXIES[(publicIdx + i) % PUBLIC_PROXIES.length];
    try {
      const r = await fetch(tpl(url), { method, signal: opts.signal, mode: "cors" });
      if (!r.ok) throw new Error("HTTP " + r.status);

  const local = state.localMode;
  switch (state.enginePref) {
    case "libcurl": return local ? ["libcurl", "relay", "public"] : ["libcurl", "public"];
    case "relay": return local ? ["relay"] : ["libcurl"];
    case "public": return ["public"];

async function engineFetch(method, url, opts = {}) {
  const chain = engineChain().filter((n) =>
    (n !== "libcurl" || (state.libcurlReady && state.wispOk)) &&

      state.lastEngine = res.engine;

      if (e && e.name === "AbortError") throw e;
      lastErr = e;

  if (!state.cookieSession) return;
  try {
    const jar = state.cookieSession.export_cookies();
    if (jar) localStorage.setItem("hyperion.jar", jar);
  } catch {}

/* ═══════════════════════ net log ═══════════════════════ */
function netAdd(tab, row) {
  row.id = ++state.netSeq;
  row.ts = Date.now();
  tab.net.unshift(row);

function headerGet(headers, name) {
  const ln = name.toLowerCase();
  for (const [k, v] of headers || []) if (k.toLowerCase() === ln) return v;
  return null;
}

/* ═══════════════════════ console ═══════════════════════ */
function consoleLog(level, text, src) {
  const tab = state.active;
  if (!tab) return;
  tab.console.push({ level, text: String(text), src, ts: Date.now() });
  if (tab.console.length > 800) tab.console.shift();

/* ═══════════════════════ tabs ═══════════════════════ */

    ["⬛", "Hacker News", "https://news.ycombinator.com"],
    ["🧩", "MDN Web Docs", "https://developer.mozilla.org"],
    ["🔎", "DuckDuckGo", "https://duckduckgo.com"],
    ["📌", "Example", "https://example.com"],
    ["📰", "Stack Overflow", "https://stackoverflow.com"],
  ];
  showOverlay(tab, `
    <div class="start">
      <h1>Hyperion <small>libcurl.js · wisp · relay</small></h1>
      <div class="sub">A browser that fetches <b>everything</b> through a real
        curl compiled to WebAssembly. Scripts are auto-allowed; every request
        of the page flows back through the proxy engine.</div>
      <div class="tiles">
        ${tiles.map(([i, n, u]) => `
          <button class="tile" data-url="${esc(u)}">
            <div class="t-ico">${i}</div>
            <div class="t-name">${n}</div>
            <div class="t-url">${esc(u.replace(/^https?:\/\//, ""))}</div>
          </button>`).join("")}
      </div>
      <div class="hint">
        Type any address or search above · <code>Ctrl+T</code> new tab ·
        <code>Ctrl+R</code> reload · <code>Ctrl+L</code> address bar ·
        <code>F12</code> devtools (console + network + source) ·
        engine switcher at the right of the toolbar.
      </div>
    </div>`);
  tab.overlay.onclick = (e) => {
    const t = e.target.closest("[data-url]");
    if (t) navigate(tab, t.dataset.url);
  };
  syncOmnibox(); renderTabs();
}

function renderError(tab, url, err) {
  tab.status = "idle"; renderTabState(tab);
  showOverlay(tab, `
    <div class="errpage">
      <div class="big">🛰️</div>
      <h2>Couldn’t reach this site</h2>
      <p>${esc(url)}</p>
      <p style="color:var(--err)">${esc(err && (err.message || String(err)))}</p>
      <div class="row">
        <button class="btn primary" data-act="retry">Retry (auto engine)</button>
        <button class="btn" data-act="relay">Force local relay</button>
        <button class="btn" data-act="home">Start page</button>
      </div>
    </div>`);
  tab.overlay.onclick = (e) => {
    const b = e.target.closest("[data-act]");
    if (!b) return;
    if (b.dataset.act === "retry") navigate(tab, url, { noPush: true });
    if (b.dataset.act === "relay") {
      state.enginePref = "relay"; $("engine-select").value = "relay";
      navigate(tab, url, { noPush: true });
    }
    if (b.dataset.act === "home") navigate(tab, "about:start");
  };
}

function looksHtml(buf, ct) {
  return /text\/html|application\/xhtml\+xml/i.test(ct) ||
    (!ct && new TextDecoder().decode(buf.slice(0, 512)).trimStart().startsWith("<"));
}

function textViewerHtml(text, url, ct) {
  return `<!DOCTYPE html><html><head><meta charset="utf-8">
<title>${esc(hostOf(url))}</title>
<style>body{background:#0d1017;color:#cfe0ff;font:12.5px/1.55 ui-monospace,Menlo,Consolas,monospace;margin:0;padding:18px}
header{position:sticky;top:-18px;background:#0d1017;padding:4px 0 12px;color:#6b7690;border-bottom:1px solid #262f47;margin:-4px 0 14px}
pre{white-space:pre-wrap;word-break:break-all}</style></head>
<body><header>${esc(ct || "text")} · ${esc(url)}</header><pre>${esc(text)}</pre></body></html>`;
}

function renderTextViewer(tab, text, url, ct) {
  setIframeSrcdoc(tab, textViewerHtml(text, url, ct));
}

function setIframeSrcdoc(tab, html) {
  tab.iframe.removeAttribute("src");
  tab.iframe.srcdoc = html;
}
function setIframeSrc(tab, url) {
  tab.iframe.srcdoc = "";
  tab.iframe.src = url;
}

/* ═══════════════════════ navigation ═══════════════════════ */
async function navigate(tab, rawUrl, opts = {}) {
  let url = normalizeUrl(rawUrl) || searchUrl(rawUrl);
  const seq = ++tab.seq;
  ++state.navSeq;

  if (url === "about:start" || url === "about:blank") {
    if (tab.ctrl) tab.ctrl.abort();
    renderStart(tab);
    if (!opts.noPush) pushHistory(tab, { url });
    tab.lastNav = null;
    syncOmnibox();
    return;
  }

  const method = (opts.method || "GET").toUpperCase();
  tab.status = "loading";
  tab.overlay.onclick = null;
  renderTabState(tab);
  $("btn-reload").innerHTML = "✕";

  const ctrl = new AbortController();
  tab.ctrl = ctrl;
  const t0 = performance.now();
  let headers = [["accept", "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"],
                 ["accept-language", "en-US,en;q=0.9"]];
  let body = null;

  if (method !== "GET" && method !== "HEAD" && opts.entries) {
    const entries = opts.entries;
    if ((opts.enctype || "").includes("multipart") || opts.hasFile) {
      const fd = new FormData();
      for (const en of entries) {
        if (en.file) fd.append(en.k, new Blob([en.file.buf], { type: en.file.type }), en.file.name);
        else fd.append(en.k, en.v ?? "");
      }
      body = fd;
    } else {
      const sp = new URLSearchParams();
      for (const en of entries) sp.append(en.k, en.v ?? "");
      body = sp.toString();
      headers.push(["content-type", "application/x-www-form-urlencoded"]);
    }
  }

  try {
    const res = await engineFetch(method, url, { headers, body, signal: ctrl.signal });
    if (seq !== tab.seq) return;                 // superseded
    const ms = Math.round(performance.now() - t0);
    const ct = headerGet(res.headers, "content-type") || "";
    const buf = res.body;

    netAdd(tab, {
      status: res.status, method, url: res.finalUrl, engine: res.engine,
      size: buf.byteLength, ms, type: "document",
    });

    if (res.status >= 400)
      throw new Error(`HTTP ${res.status} ${res.statusText || ""}`.trim());

    tab.lastNav = { url, method, opts: { method, entries: opts.entries, enctype: opts.enctype, hasFile: opts.hasFile } };
    tab.url = res.finalUrl;
    tab.status = "idle";

    const isHtml = looksHtml(buf, ct);

    if (isHtml) {
      const text = decodeBuf(buf, ct);
      tab.raw = text;
      setIframeSrcdoc(tab, processHtml(text, res.finalUrl, true));
      tab.title = titleFrom(text) || hostOf(res.finalUrl);
      tab.icon = null;
    } else if (/^(text\/|application\/(json|xml|javascript|x-javascript)|.*\+(xml|json))/i.test(ct)) {
      const text = decodeBuf(buf, ct);
      tab.raw = text;
      setIframeSrcdoc(tab, textViewerHtml(text, res.finalUrl, ct));
      tab.title = hostOf(res.finalUrl);
    } else {
      tab.raw = "";
      // binary: standalone shows it via a blob URL; local mode offloads to the proxy
      if (state.localMode) {
        setIframeSrc(tab, toProxy(res.finalUrl));
      } else {
        const blob = new Blob([buf], { type: ct || "application/octet-stream" });
        setIframeSrc(tab, URL.createObjectURL(blob));
      }
      tab.title = hostOf(res.finalUrl);
    }

    hideOverlay(tab);
    if (!opts.noPush && !opts.replaceHist) pushHistory(tab, { url, method, opts: tab.lastNav.opts });
    if (opts.histIdx != null) tab.hidx = opts.histIdx;
    syncOmnibox(true);
    renderTabState(tab);
    document.title = (tab.title || hostOf(tab.url)) + " · Hyperion";
    if (state.cookieSession) saveCookies();
  } catch (e) {
    if (e && e.name === "AbortError") {
      if (seq === tab.seq) { tab.status = "idle"; renderTabState(tab); $("btn-reload").innerHTML = "⟳"; }
      return;
    }
    if (seq !== tab.seq) return;
    netAdd(tab, { status: 0, method, url, engine: state.lastEngine, size: 0,
                  ms: Math.round(performance.now() - t0), type: "document",
                  error: e.message || String(e) });
    renderError(tab, url, e);
    toast("Navigation failed: " + (e.message || e), true);
  } finally {
    if (seq === tab.seq) { $("btn-reload").innerHTML = "⟳"; $("btn-reload").disabled = false; }
  }
}

function titleFrom(html) {
  const m = /<title[^>]*>([\s\S]*?)<\/title>/i.exec(html);
  return m ? m[1].replace(/\s+/g, " ").trim().slice(0, 120) : null;
}
function decodeBuf(buf, ct) {
  let enc = "utf-8";
  const m = /charset=([\w-]+)/i.exec(ct || "");
  if (m) enc = m[1];
  try { return new TextDecoder(enc).decode(buf); }
  catch { return new TextDecoder("utf-8").decode(buf); }
}

function pushHistory(tab, entry) {
  tab.hist = tab.hist.slice(0, tab.hidx + 1);
  tab.hist.push({ ...entry, ts: Date.now(), title: tab.title });
  if (tab.hist.length > 200) tab.hist.shift();
  tab.hidx = tab.hist.length - 1;
  if (tab === state.active) {
    state.history.unshift({ url: entry.url, title: tab.title || hostOf(entry.url), ts: Date.now() });
    if (state.history.length > 500) state.history.pop();
    saveJSON("hyperion.history", state.history);
  }
  updateNavButtons();
}

function goBack(tab = state.active) {
  if (!tab || tab.hidx <= 0) return;
  const e = tab.hist[--tab.hidx];
  navigate(tab, e.url, { noPush: true, ...e.opts, histIdx: tab.hidx });
  updateNavButtons();
}
function goFwd(tab = state.active) {
  if (!tab || tab.hidx >= tab.hist.length - 1) return;
  const e = tab.hist[++tab.hidx];
  navigate(tab, e.url, { noPush: true, ...e.opts, histIdx: tab.hidx });
  updateNavButtons();
}
function updateNavButtons() {
  const t = state.active;
  $("btn-back").disabled = !t || t.hidx <= 0;
  $("btn-fwd").disabled = !t || t.hidx >= t.hist.length - 1;
}

function syncOmnibox(force) {
  const o = $("omni");
  if (!force && document.activeElement === o) return;
  const t = state.active;
  o.value = !t || t.url === "about:start" ? "" : unproxy(t.url);
  if (document.activeElement === o) o.select();
  $("st-url").textContent = t ? t.url === "about:start" ? "start page" : t.url : "";
  updateNavButtons();
}

/* ═══════════════════════ messages from pages ═══════════════════════ */
window.addEventListener("message", async (e) => {
  const d = e.data;
  if (!d || typeof d !== "object" || !d.h) return;
  const tab = state.tabs.find((t) => t.iframe.contentWindow === e.source);
  if (!tab) return;                                // validate by source window

  switch (d.h) {
    case "console":
      tab.console.push({ level: d.level, text: d.text, src: hostOf(tab.url), ts: Date.now() });
      if (tab.console.length > 800) tab.console.shift();
      if (tab === state.active) renderConsole();
      break;

    case "title":
      if (d.title) { tab.title = d.title; renderTabs();
        if (tab === state.active) document.title = d.title + " · Hyperion"; }
      break;

    case "favicon":
      if (d.href) {
        if (!/^https?:/i.test(d.href)) {
          tab.icon = d.href;                       // data:/blob: — usable as-is
          renderTabs();
        } else if (state.localMode) {
          tab.icon = toProxy(d.href);
          renderTabs();
        } else {
          // standalone: fetch through the engine, show as blob URL
          engineFetch("GET", d.href, {}).then((r) => {
            if (tab.icon && tab.icon.startsWith("blob:")) URL.revokeObjectURL(tab.icon);
            tab.icon = URL.createObjectURL(new Blob([r.body],
              { type: headerGet(r.headers, "content-type") || "image/x-icon" }));
            renderTabs();
          }).catch(() => {});
        }
      }
      break;

    case "ready":
      tab.status = "idle"; renderTabState(tab);
      hideOverlay(tab);
      if (d.title && (!tab.title || tab.title === hostOf(tab.url))) {
        tab.title = d.title; renderTabs();
      }
      break;

    case "nav":
      navigate(tab, d.url, {
        method: d.method, entries: d.entries,
        enctype: d.enctype, hasFile: d.hasFile,
      });
      break;

    case "open":
      const nt = makeTab();
      navigate(nt, d.url);
      activateTab(nt);
      break;

    case "req":                                    // page fetch/XHR via engine
    case "page":                                   // nested iframe document
      handlePageRequest(tab, d);
      break;

    case "res-pong": break;

    case "eval-result":
      tab.console.push({
        level: d.ok ? "log" : "error",
        text: d.result, src: "‹console›", ts: Date.now(),
      });
      if (tab === state.active) renderConsole();
      break;
  }
});

/* nested iframe document via the engine — runtime asked for a whole page */
async function handleFrameDoc(tab, d) {
  const t0 = performance.now();
  try {
    const res = await engineFetch("GET", d.url, {
      headers: [["accept", "text/html,application/xhtml+xml,*/*;q=0.8"]],
    });
    const ct = headerGet(res.headers, "content-type") || "";
    netAdd(tab, {
      status: res.status, method: "GET", url: d.url, engine: res.engine,
      size: res.body.byteLength, ms: Math.round(performance.now() - t0),
      type: "iframe",
    });
    if (res.status >= 400)
      throw new Error(`HTTP ${res.status} ${res.statusText || ""}`.trim());
    let html = null, raw = null;
    if (looksHtml(res.body, ct)) {
      html = processHtml(decodeBuf(res.body, ct), res.finalUrl, false);
    } else if (/^(text\/|application\/(json|xml|javascript|x-javascript)|.*\+(xml|json))/i.test(ct)) {
      html = textViewerHtml(decodeBuf(res.body, ct), res.finalUrl, ct);
    } else {
      raw = res.finalUrl;                 // binary → runtime falls back to raw src
    }
    tab.iframe.contentWindow.postMessage(
      { h: "res", id: d.id, kind: "page", html, raw }, "*");
  } catch (err) {
    netAdd(tab, {
      status: 0, method: "GET", url: d.url, engine: state.lastEngine, size: 0,
      ms: Math.round(performance.now() - t0), type: "iframe",
      error: err.message || String(err),
    });
    tab.iframe.contentWindow.postMessage(
      { h: "res", id: d.id, kind: "page", error: err.message || "network error", raw: d.url }, "*");
  }
}

async function handlePageRequest(tab, d) {
  if (d.h === "page") return handleFrameDoc(tab, d);
  const t0 = performance.now();
  const method = (d.method || "GET").toUpperCase();
  const headers = (d.headers || []).map((h) => [String(h[0]), String(h[1])]);
  let body = null;
  if (d.body && typeof d.body === "object" && d.body.__form) {
    const fd = new FormData();
    for (const en of d.body.__form) {
      if (en.file) fd.append(en.k, new Blob([en.file.buf], { type: en.file.type }), en.file.name);
      else fd.append(en.k, en.v ?? "");
    }
    body = fd;
  } else if (d.body != null) body = d.body;

  try {
    const res = await engineFetch(method, d.url, { headers, body });
    netAdd(tab, {
      status: res.status, method, url: d.url, engine: res.engine,
      size: res.body.byteLength, ms: Math.round(performance.now() - t0),
      type: "xhr",
    });
    tab.iframe.contentWindow.postMessage({
      h: "res", id: d.id, status: res.status, statusText: res.statusText,
      headers: res.headers, body: res.body,
    }, "*");
  } catch (err) {
    netAdd(tab, {
      status: 0, method, url: d.url, engine: state.lastEngine, size: 0,
      ms: Math.round(performance.now() - t0), type: "xhr",
      error: err.message || String(err),
    });
    tab.iframe.contentWindow.postMessage(
      { h: "res", id: d.id, error: err.message || "network error" }, "*");
  }
}

/* ═══════════════════════ devtools ═══════════════════════ */
function setDev(open, tabName) {
  state.devOpen = open;
  $("devtools").classList.toggle("hidden", !open);
  if (tabName) state.devTab = tabName;
  document.querySelectorAll(".dev-tab").forEach((b) =>
    b.classList.toggle("active", b.dataset.dev === state.devTab));
  document.querySelectorAll(".dev-pane").forEach((p) =>
    p.classList.toggle("active", p.id === "dev-" + state.devTab));
  renderConsole(); renderNetwork(); renderSource();
}

function renderConsole() {
  const box = $("console-lines");
  if (!state.devOpen || state.devTab !== "console") return;
  const tab = state.active;
  const lines = tab ? tab.console : [];
  box.innerHTML = lines.map((l) =>
    `<div class="cline ${esc(l.level)}">${esc(l.text)}${
      l.src ? `<span class="csrc">— ${esc(l.src)}</span>` : ""}</div>`).join("");
  box.scrollTop = box.scrollHeight;
}

function renderNetwork() {
  if (!state.devOpen || state.devTab !== "network") return;
  const tab = state.active;
  const rows = tab ? tab.net : [];
  $("net-rows").innerHTML = rows.map((r) => {
    const stCls = r.status === 0 ? "st-0" : "st-" + Math.floor(r.status / 100);
    const name = unproxy(r.url).replace(/^https?:\/\//, "");
    return `<tr title="${esc(unproxy(r.url))}${r.error ? "\n" + esc(r.error) : ""}">
      <td>${r.type === "document" ? "📄" : r.type === "xhr" ? "⚡" : "🔗"}</td>
      <td class="${stCls}">${r.status || (r.error ? "ERR" : "—")}</td>
      <td>${esc(r.method)}</td>
      <td>${esc(name)}</td>
      <td class="eng-${esc(r.engine)}">${esc(r.engine)}</td>
      <td>${r.size ? fmtSize(r.size) : "—"}</td>
      <td>${r.ms != null ? r.ms + "ms" : "—"}</td>
    </tr>`;
  }).join("");
}
function fmtSize(n) {
  if (n < 1024) return n + "B";
  if (n < 1048576) return (n / 1024).toFixed(1) + "kB";
  return (n / 1048576).toFixed(1) + "MB";
}

function renderSource() {
  if (!state.devOpen || state.devTab !== "source") return;
  const tab = state.active;
  $("source-view").textContent = tab && tab.raw
    ? tab.raw : "// no source for this page (binary / start page)";
}

function showSource() {
  setDev(true, "source");
  renderSource();
}

document.querySelectorAll(".dev-tab").forEach((b) =>
  b.addEventListener("click", () => setDev(true, b.dataset.dev)));
$("btn-dev").addEventListener("click", () => setDev(!state.devOpen));
$("dev-close").addEventListener("click", () => setDev(false));
$("dev-clear").addEventListener("click", () => {
  const tab = state.active;
  if (!tab) return;
  if (state.devTab === "console") { tab.console = []; renderConsole(); }
  else if (state.devTab === "network") { tab.net = []; renderNetwork(); }
  else { tab.raw = ""; renderSource(); }
});
$("btn-source").addEventListener("click", showSource);

let evalSeq = 0;
$("console-input").addEventListener("keydown", (e) => {
  if (e.key !== "Enter") return;
  const code = e.target.value.trim();
  if (!code) return;
  e.target.value = "";
  const tab = state.active;
  tab.console.push({ level: "input", text: "› " + code, src: "", ts: Date.now() });
  tab.iframe.contentWindow.postMessage({ h: "eval", id: ++evalSeq, code }, "*");
  renderConsole();
  // if the frame has no runtime, answer with an error so the line resolves
  setTimeout(() => {
    const last = tab.console[tab.console.length - 1];
    if (last && last.level === "input" && last.text === "› " + code) {
      tab.console.push({ level: "debug", text: "(no runtime responding in this frame)", src: "" });
      if (tab === state.active) renderConsole();
    }
  }, 1500);
});

/* ═══════════════════════ library (history/bookmarks) ═══════════════════════ */
function setLibrary(open, which) {
  $("library").classList.toggle("hidden", !open);
  if (which) {
    document.querySelectorAll(".lib-tab").forEach((b) =>
      b.classList.toggle("active", b.dataset.lib === which));
  }
  renderLibrary();
}
function renderLibrary() {
  if ($("library").classList.contains("hidden")) return;
  const which = document.querySelector(".lib-tab.active")?.dataset.lib || "history";
  const body = $("library-body");
  const items = which === "history" ? state.history : state.bookmarks;
  if (!items.length) {
    body.innerHTML = `<div class="lib-empty">Nothing here yet.</div>`;
    return;
  }
  body.innerHTML = items.map((it, i) => `
    <div class="lib-item" data-url="${esc(it.url)}" data-i="${i}">
      <div class="li-title">${esc(it.title || hostOf(it.url))}</div>
      <div class="li-url">${esc(it.url)}</div>
      <div class="li-date">${which === "history" ? new Date(it.ts).toLocaleString() : ""}</div>
    </div>`).join("");
  body.onclick = (e) => {
    const el = e.target.closest(".lib-item");
    if (!el) return;
    if (e.target.classList.contains("li-del")) return;
    navigate(state.active, el.dataset.url);
    setLibrary(false);
  };
}
$("btn-library").addEventListener("click", () =>
  setLibrary($("library").classList.contains("hidden")));
$("library-close").addEventListener("click", () => setLibrary(false));
document.querySelectorAll(".lib-tab").forEach((b) =>
  b.addEventListener("click", () => {
    document.querySelectorAll(".lib-tab").forEach((x) => x.classList.toggle("active", x === b));
    renderLibrary();
  }));

function renderBookmarkBar() {
  const bar = $("bookmarkbar");
  bar.innerHTML = state.bookmarks.map((b, i) => `
    <button class="bm-chip" data-url="${esc(b.url)}" title="${esc(b.url)}">
      <span>${esc(b.title || hostOf(b.url))}</span><span class="x" data-del="${i}">×</span>
    </button>`).join("");
  bar.onclick = (e) => {
    const del = e.target.closest("[data-del]");
    if (del) {
      state.bookmarks.splice(+del.dataset.del, 1);
      saveJSON("hyperion.bookmarks", state.bookmarks);
      renderBookmarkBar(); syncBookmarkStar();
      return;
    }
    const chip = e.target.closest("[data-url]");
    if (chip) navigate(state.active, chip.dataset.url);
  };
}
function isBookmarked(url) {
  return state.bookmarks.some((b) => b.url === url);
}
function syncBookmarkStar() {
  const t = state.active;
  const on = t && t.url && t.url !== "about:start" && isBookmarked(t.url);
  $("btn-bookmark").textContent = on ? "★" : "☆";
}
$("btn-bookmark").addEventListener("click", () => {
  const t = state.active;
  if (!t || t.url === "about:start") return;
  if (isBookmarked(t.url)) {
    state.bookmarks = state.bookmarks.filter((b) => b.url !== t.url);
  } else {
    state.bookmarks.unshift({ url: t.url, title: t.title || hostOf(t.url) });
  }
  saveJSON("hyperion.bookmarks", state.bookmarks);
  renderBookmarkBar(); syncBookmarkStar();
});

/* ═══════════════════════ toolbar ═══════════════════════ */
$("btn-back").addEventListener("click", () => goBack());
$("btn-fwd").addEventListener("click", () => goFwd());
$("btn-home").addEventListener("click", () => navigate(state.active, "about:start"));
$("btn-reload").addEventListener("click", () => {
  const t = state.active;
  if (!t) return;
  if (t.status === "loading" && t.ctrl) { t.ctrl.abort(); return; }
  if (t.lastNav) navigate(t, t.url, { noPush: true, method: t.lastNav.method,
    entries: t.lastNav.opts?.entries, enctype: t.lastNav.opts?.enctype,
    hasFile: t.lastNav.opts?.hasFile });
  else if (t.url && t.url !== "about:start") navigate(t, t.url, { noPush: true });
  else renderStart(t);
});
$("btn-go").addEventListener("click", submitOmnibox);
$("omni").addEventListener("keydown", (e) => { if (e.key === "Enter") submitOmnibox(); });
$("omni").addEventListener("focus", (e) => e.target.select());

function submitOmnibox() {
  const v = $("omni").value;
  if (!v.trim()) return;
  navigate(state.active, v.trim());
}

$("engine-select").value = state.enginePref;
$("engine-select").addEventListener("change", (e) => {
  state.enginePref = e.target.value;
  localStorage.setItem("hyperion.engine", state.enginePref);
  updateBadges();
  toast("Engine: " + state.enginePref);
});

function updateBadges() {
  const b = $("engine-badge");
  const eng = state.enginePref === "auto" ? state.lastEngine : state.enginePref;
  b.textContent = eng === "libcurl" ? "curl·wasm ⇄ wisp" :
    eng === "relay" ? "local relay" :
    eng === "public" ? "public cors" : eng;
  b.className = eng === "relay" ? "relay" : eng === "public" ? "public" :
    eng === "libcurl" ? "" : (eng === "—" ? "dim" : "err");

  const mode = state.localMode ? "" : " · standalone";
  $("st-engine").textContent = "engine: " +
    (state.enginePref === "auto" ? "auto → " + state.lastEngine : state.enginePref) + mode;
  $("st-wisp").textContent = "wisp: " +
    (state.wispOk ? "connected ✓ · " + wispLabel()
      : state.libcurlReady ? "unavailable (" + (state.localMode ? "relay" : "public") + " fallback)" : "…");
  $("st-wisp").className = "st-item " + (state.wispOk ? "ok" : "");
  let ver = "libcurl: …";
  if (state.libcurlErr) ver = "libcurl: failed";
  else if (state.libcurlReady && typeof libcurl !== "undefined" && libcurl.version) {
    const v = libcurl.version;
    ver = `libcurl: ${v.libcurl || v.lib || "?"} · wisp ${v.wisp || "?"}`;
  }
  $("st-curl").textContent = ver;
}

/* ═══════════════════════ keyboard ═══════════════════════ */
document.addEventListener("keydown", (e) => {
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase() === "t") { e.preventDefault(); makeTab(); }
  else if (mod && e.key.toLowerCase() === "w") { e.preventDefault(); closeTab(state.active); }
  else if (mod && e.key.toLowerCase() === "l") { e.preventDefault(); $("omni").focus(); $("omni").select(); }
  else if (mod && e.key.toLowerCase() === "r") { e.preventDefault(); $("btn-reload").click(); }
  else if (e.key === "F5") { e.preventDefault(); $("btn-reload").click(); }
  else if (e.key === "F12") { e.preventDefault(); setDev(!state.devOpen); }
  else if (e.altKey && e.key === "ArrowLeft") { e.preventDefault(); goBack(); }
  else if (e.altKey && e.key === "ArrowRight") { e.preventDefault(); goFwd(); }
  else if (mod && e.key === "Tab") { e.preventDefault(); newTabSwitch(e.shiftKey ? -1 : 1); }
});
function newTabSwitch(dir) {
  const i = state.tabs.indexOf(state.active);
  activateTab(state.tabs[(i + dir + state.tabs.length) % state.tabs.length]);
}

/* ═══════════════════════ boot ═══════════════════════ */
function probeWisp() {
  return new Promise((resolve) => {
    let ws;
    try { ws = new WebSocket(wispUrl()); }
    catch { return resolve(false); }
    let done = false;
    const fin = (v) => {
      if (done) return;
      done = true;
      clearTimeout(timer);
      try { ws.close(); } catch {}
      resolve(v);
    };
    const timer = setTimeout(() => fin(false), 7000);
    ws.binaryType = "arraybuffer";
    ws.onmessage = () => fin(true);       // first frame = Wisp initial window
    ws.onerror = () => fin(false);
    ws.onclose = () => fin(false);
  });
}

/* libcurl.js loader — local vendor copy with jsdelivr CDN fallback */
const LIBCURL_CDN = "https://cdn.jsdelivr.net/npm/libcurl.js@0.7.4/libcurl.js";
const LIBCURL_WASM_CDN = "https://cdn.jsdelivr.net/npm/libcurl.js@0.7.4/libcurl.wasm";

function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = src;
    s.onload = () => res();
    s.onerror = () => rej(new Error("script load failed: " + src));
    document.head.appendChild(s);
  });
}
async function headOk(url, ms = 4000) {
  try {
    const c = new AbortController();
    const t = setTimeout(() => c.abort(), ms);
    const r = await fetch(url, { method: "HEAD", signal: c.signal, cache: "no-store" });
    clearTimeout(t);
    return r.ok;
  } catch { return false; }
}

/* standalone = file:// or no local /proxy relay (X-Proxy-Engine header) */
async function detectMode() {
  if (location.protocol === "file:") { state.localMode = false; return; }
  try {
    const c = new AbortController();
    const t = setTimeout(() => c.abort(), 4000);
    const r = await fetch("/proxy?url=" + encodeURIComponent("https://example.com"),
      { method: "HEAD", signal: c.signal, cache: "no-store" });
    clearTimeout(t);
    state.localMode = r.ok && r.headers.get("X-Proxy-Engine") === "relay";
  } catch {
    state.localMode = false;
  }
}

async function initLibcurl() {
  try {
    if (typeof libcurl === "undefined" && location.protocol !== "file:") {
      try { await loadScript("/vendor/libcurl.js"); } catch { /* fall to CDN */ }
    }
    if (typeof libcurl === "undefined") await loadScript(LIBCURL_CDN);
    libcurl.logger = (type, text) => {
      if (type === "error" || type === "warn")
        consoleLog(type === "error" ? "error" : "debug", "[libcurl] " + text, "libcurl");
    };
    let wasmUrl = LIBCURL_WASM_CDN;
    if (location.protocol !== "file:" && await headOk("/vendor/libcurl.wasm"))
      wasmUrl = "/vendor/libcurl.wasm";
    await libcurl.load_wasm(wasmUrl);
    libcurl.set_websocket(wispUrl());
    state.libcurlReady = true;
    try {
      const jar = localStorage.getItem("hyperion.jar");
      state.cookieSession = jar
        ? new libcurl.HTTPSession({ enable_cookies: true, cookie_jar: jar })
        : new libcurl.HTTPSession({ enable_cookies: true });
    } catch (e) {
      console.warn("cookie session failed", e);
      try { state.cookieSession = new libcurl.HTTPSession(); } catch {}
    }
    state.wispOk = await probeWisp();
    if (!state.wispOk)
      toast("Wisp tunnel unreachable — falling back to " +
        (state.localMode ? "the local relay" : "public proxies"), true);
    updateBadges();
  } catch (e) {
    state.libcurlErr = e;
    console.warn("libcurl init failed:", e);
    toast("libcurl.js unavailable — " +
      (state.localMode ? "using local relay" : "public proxies only") +
      " (" + (e.message || e) + ")", true);
    updateBadges();
  }
}

let booted = false;
async function boot() {
  if (booted) return;
  booted = true;

  // mode first (local relay vs standalone), then the page runtime
  await detectMode();

  if (typeof HYPERION_INJECTED !== "undefined" && HYPERION_INJECTED) {
    state.runtimeSrc = HYPERION_INJECTED;               // single-file build
  } else {
    try {
      state.runtimeSrc = await (await fetch("/injected.js")).text();
    } catch { state.runtimeSrc = ""; }
  }

  updateBadges();
  renderBookmarkBar();
  makeTab();
  syncBookmarkStar();

  initLibcurl().then(() => {
    syncBookmarkStar();
    updateBadges();
  });

  // keep star + url bar in sync after navigations
  setInterval(syncBookmarkStar, 1500);
}

document.addEventListener("DOMContentLoaded", boot);
if (document.readyState !== "loading") boot();

</script>
