<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Mercury Workshop Epoxy Transport & libcurl.js WebAssembly Transports -->
  <script src="https://cdn.jsdelivr.net/npm/libcurl.js@0.7.1/libcurl.js"></script>
  <script src="https://unpkg.com/@mercuryworkshop/epoxy-transport@2.1.3/dist/index.js"></script>

  <style>
    :root {
      --bg-color: #08080a;
      --capsule-bg: rgba(20, 20, 24, 0.82);
      --capsule-border: rgba(255, 255, 255, 0.08);
      --text-main: #ffffff;
      --text-muted: #8e8e93;
      --search-bg: rgba(22, 22, 26, 0.88);
      --search-border: rgba(255, 255, 255, 0.07);
      --brand-mint: #76e289;
      --accent-glow: rgba(118, 226, 137, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-drag: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Starfield Background Canvas */
    #stars-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* Top Capsule Navbar */
    .top-nav {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-width: 420px;
      max-width: 90vw;
      height: 52px;
      padding: 0 18px;
      background: var(--capsule-bg);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--capsule-border);
      border-radius: 9999px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .top-nav:hover {
      border-color: rgba(255, 255, 255, 0.14);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.75);
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .mascot-icon {
      width: 24px;
      height: 24px;
      fill: var(--brand-mint);
      filter: drop-shadow(0 0 6px rgba(118, 226, 137, 0.4));
      transition: transform 0.2s ease;
    }

    .nav-left:hover .mascot-icon {
      transform: rotate(-10deg) scale(1.12);
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .nav-btn {
      background: transparent;
      border: none;
      color: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      border-radius: 8px;
      opacity: 0.88;
      transition: all 0.2s ease;
    }

    .nav-btn:hover {
      opacity: 1;
      transform: translateY(-1px) scale(1.08);
      color: var(--brand-mint);
    }

    .nav-btn svg {
      width: 21px;
      height: 21px;
      fill: currentColor;
    }

    /* Main Dashboard Layout */
    .dashboard-container {
      position: relative;
      z-index: 10;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: 7vh;
      width: 100%;
    }

    /* Title */
    .hero-title {
      font-size: 3rem;
      font-weight: 800;
      letter-spacing: -0.8px;
      color: #ffffff;
      margin-bottom: 34px;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.6);
    }

    /* App Quick-Launch Row */
    .app-grid {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    .app-card {
      width: 76px;
      height: 76px;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      transition: all 0.28s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      outline: none;
    }

    .app-card:hover {
      transform: translateY(-7px) scale(1.06);
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.65);
    }

    .app-card:active {
      transform: scale(0.96);
    }

    /* Individual App Badges */
    .app-card.instagram {
      background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
    }

    .app-card.movies {
      background: linear-gradient(135deg, #2b1055 0%, #4c1d95 100%);
      color: #ffffff;
    }

    .app-card.tiktok {
      background: #000000;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .app-card.twitch {
      background: #9146ff;
    }

    .app-card.youtube {
      background: #ff0000;
    }

    .app-card.discord {
      background: #5865f2;
    }

    /* Movies Card Label */
    .movies-badge-label {
      font-size: 11px;
      font-weight: 700;
      margin-top: 4px;
      letter-spacing: -0.2px;
      color: #ffffff;
    }

    /* Search Bar Capsule */
    .search-box-wrapper {
      position: relative;
      width: 440px;
      max-width: 90vw;
    }

    .search-input {
      width: 100%;
      height: 52px;
      border-radius: 9999px;
      background: var(--search-bg);
      border: 1px solid var(--search-border);
      color: #ffffff;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 500;
      text-align: center;
      padding: 0 24px;
      outline: none;
      backdrop-filter: blur(14px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      transition: all 0.25s ease;
      user-select: text;
    }

    .search-input::placeholder {
      color: #8c8c93;
      font-weight: 500;
    }

    .search-input:focus {
      border-color: rgba(255, 255, 255, 0.24);
      background: rgba(28, 28, 34, 0.95);
      box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.04), 0 12px 32px rgba(0, 0, 0, 0.7);
    }

    /* In-App Browser Viewport Overlay */
    #browser-view {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #0e0e12;
      z-index: 100;
      display: none;
      flex-direction: column;
    }

    .browser-toolbar {
      height: 56px;
      background: #141418;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
      z-index: 102;
    }

    .browser-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #ffffff;
      border-radius: 8px;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .browser-btn:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .browser-omnibox {
      flex: 1;
      height: 36px;
      background: #09090c;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 0 14px;
      color: #ffffff;
      font-family: inherit;
      font-size: 0.9rem;
      user-select: text;
      outline: none;
    }

    .browser-omnibox:focus {
      border-color: var(--brand-mint);
    }

    .engine-status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      color: #34d399;
      white-space: nowrap;
    }

    .engine-status-badge.libcurl {
      background: rgba(6, 182, 212, 0.12);
      border-color: rgba(6, 182, 212, 0.3);
      color: #22d3ee;
    }

    .engine-status-badge.loading {
      background: rgba(234, 179, 8, 0.12);
      border-color: rgba(234, 179, 8, 0.3);
      color: #facc15;
    }

    #loading-indicator-bar {
      height: 2px;
      width: 0%;
      background: linear-gradient(90deg, #76e289, #38bdf8);
      transition: width 0.3s ease;
    }

    #sandbox-viewport {
      flex: 1;
      width: 100%;
      height: calc(100% - 58px);
      border: none;
      background: #ffffff;
    }

    /* Modal System */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .modal-card {
      width: 540px;
      max-width: 90vw;
      max-height: 80vh;
      background: #121316;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-title {
      font-size: 1.25rem;
      font-weight: 700;
    }

    .modal-close {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.5rem;
    }

    .modal-close:hover {
      color: #fff;
    }

    .relay-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-radius: 12px;
      background: #18191e;
      border: 1px solid rgba(255, 255, 255, 0.04);
      margin-bottom: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .relay-item:hover, .relay-item.active {
      border-color: var(--brand-mint);
      background: #1f2128;
    }

    .relay-name {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .relay-url {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .relay-latency {
      font-size: 0.75rem;
      font-weight: 700;
      color: #34d399;
      padding: 3px 8px;
      background: rgba(52, 211, 153, 0.1);
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <!-- Starfield Canvas -->
  <canvas id="stars-canvas"></canvas>

  <!-- Top Floating Capsule Navigation -->
  <header class="top-nav">
    <div class="nav-left" title="Nexus Home" onclick="closeBrowser()">
      <!-- Mint Mascot Frog Icon -->
      <svg class="mascot-icon" viewBox="0 0 24 24">
        <path d="M7 2a3 3 0 0 0-3 3c0 .8.3 1.5.8 2C3.1 8 2 10 2 12.5 2 15 4 17 6.5 17c.5 0 1-.1 1.5-.2C9 18.2 10.4 19 12 19s3-.8 4-2.2c.5.1 1 .2 1.5.2 2.5 0 4.5-2 4.5-4.5 0-2.5-1.1-4.5-2.8-5.5.5-.5.8-1.2.8-2a3 3 0 0 0-3-3c-1.3 0-2.3.8-2.7 2H9.7C9.3 2.8 8.3 2 7 2zm0 2c.6 0 1 .4 1 1s-.4 1-1 1-1-.4-1-1 .4-1 1-1zm10 0c.6 0 1 .4 1 1s-.4 1-1 1-1-.4-1-1 .4-1 1-1zm-8.5 7a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zm7 0a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3z"/>
      </svg>
    </div>

    <div class="nav-right">
      <!-- Gamepad Icon (Games Library) -->
      <button class="nav-btn" title="Games Library" onclick="openModal('games-modal')">
        <svg viewBox="0 0 24 24">
          <path d="M6 5h12a7 7 0 0 1 7 7c0 2.8-1.5 5.2-3.8 6.4-.9.5-2 .2-2.6-.6l-1.5-2.2c-.3-.4-.7-.6-1.1-.6H7c-.4 0-.8.2-1.1.6L4.4 17.8c-.6.8-1.7 1.1-2.6.6C-0.5 17.2-2 14.8-2 12a7 7 0 0 1 8-7zm2 5v4m-2-2h4m8-1.5a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4zm2 3a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4z" stroke="currentColor" stroke-width="0.5"/>
        </svg>
      </button>

      <!-- Grid Icon (Apps Catalog) -->
      <button class="nav-btn" title="Apps" onclick="openModal('apps-modal')">
        <svg viewBox="0 0 24 24">
          <rect x="3" y="3" width="7.5" height="7.5" rx="2" />
          <rect x="13.5" y="3" width="7.5" height="7.5" rx="2" />
          <rect x="3" y="13.5" width="7.5" height="7.5" rx="2" />
          <rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2" />
        </svg>
      </button>

      <!-- Handshake Icon (Wisp Relays) -->
      <button class="nav-btn" title="Wisp Relays & Status" onclick="openModal('relays-modal')">
        <svg viewBox="0 0 24 24">
          <path d="M19.5 8.5l-3.2 3.2c-.4.4-1 .4-1.4 0l-2.1-2.1a1 1 0 0 0-1.4 0l-4.5 4.5c-.4.4-.4 1 0 1.4l1.4 1.4c.4.4 1 .4 1.4 0l3.8-3.8 2.1 2.1c.8.8 2 .8 2.8 0l4.5-4.5c.8-.8.8-2 0-2.8l-1.4-1.4c-.6-.7-1.4-.7-2.1 0zM4 14l3.5-3.5 1.4 1.4L5.4 15.4c-.8.8-2 .8-2.8 0L1.2 14c-.8-.8-.8-2 0-2.8L5.7 6.7c.8-.8 2-.8 2.8 0l3.5 3.5-1.4 1.4-3.5-3.5-3.1 3.1c-.4.4-.4 1 0 1.4L4 14z"/>
        </svg>
      </button>

      <!-- Plus Icon (Settings / Custom Add) -->
      <button class="nav-btn" title="Engine Settings" onclick="openModal('settings-modal')">
        <svg viewBox="0 0 24 24">
          <path d="M12 4v16m8-8H4" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Central Dashboard Content -->
  <main class="dashboard-container">
    <h1 class="hero-title">nexus</h1>

    <!-- App Quick Launch Badges -->
    <section class="app-grid">
      <!-- Instagram -->
      <div class="app-card instagram" title="Instagram" onclick="launchApp('https://instagram.com')">
        <svg viewBox="0 0 24 24" width="38" height="38" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
          <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
          <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
        </svg>
      </div>

      <!-- movies -->
      <div class="app-card movies" title="Movies" onclick="launchApp('https://fmoviesz.to')">
        <svg viewBox="0 0 24 24" width="30" height="30" fill="url(#glossyPlayGrad)">
          <defs>
            <linearGradient id="glossyPlayGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#ffffff"/>
              <stop offset="100%" stop-color="#c4b5fd"/>
            </linearGradient>
          </defs>
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
        <span class="movies-badge-label">movies</span>
      </div>

      <!-- TikTok -->
      <div class="app-card tiktok" title="TikTok" onclick="launchApp('https://tiktok.com')">
        <svg viewBox="0 0 24 24" width="36" height="36" fill="#ffffff">
          <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64c.29 0 .58.04.86.12V9.42a6.34 6.34 0 0 0-.86-.06A6.33 6.33 0 0 0 3 15.69 6.34 6.34 0 0 0 9.34 22a6.34 6.34 0 0 0 6.34-6.31V9.22a8.16 8.16 0 0 0 4.91 1.63V7.4a4.85 4.85 0 0 1-1-.71z"/>
        </svg>
      </div>

      <!-- Twitch -->
      <div class="app-card twitch" title="Twitch" onclick="launchApp('https://twitch.tv')">
        <svg viewBox="0 0 24 24" width="36" height="36" fill="#ffffff">
          <path d="M2.15 2L1 6.57v13.72h5.71V24h3.71l3.72-3.71h4.86L23 16V2H2.15zm18.85 13.14l-3.43 3.43H12.7l-3.71 3.71v-3.71H4.43V4.29h16.57v10.85zm-4-6.85h-2.29v5.71H17V8.29zm-5.71 0H9v5.71h2.29V8.29z"/>
        </svg>
      </div>

      <!-- YouTube -->
      <div class="app-card youtube" title="YouTube" onclick="launchApp('https://youtube.com')">
        <svg viewBox="0 0 24 24" width="38" height="38" fill="#ffffff">
          <path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6A3 3 0 0 0 .5 6.2 31.4 31.4 0 0 0 0 12a31.4 31.4 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.6 9.4.6 9.4.6s7.5 0 9.4-.6a3 3 0 0 0 2.1-2.1 31.4 31.4 0 0 0 .5-5.8 31.4 31.4 0 0 0-.5-5.8zm-14 9.3v-7l6.2 3.5-6.2 3.5z"/>
        </svg>
      </div>

      <!-- Discord -->
      <div class="app-card discord" title="Discord" onclick="launchApp('https://discord.com')">
        <svg viewBox="0 0 24 24" width="36" height="36" fill="#ffffff">
          <path d="M20.32 4.37a19.8 19.8 0 0 0-4.9-1.52.07.07 0 0 0-.08.03c-.21.38-.45.87-.61 1.25a18.27 18.27 0 0 0-5.46 0 12.64 12.64 0 0 0-.62-1.25.08.08 0 0 0-.08-.03 19.74 19.74 0 0 0-4.9 1.52.07.07 0 0 0-.03.03C.53 9.03-.32 13.55.1 18a20 20 0 0 0 6.07 3.08.08.08 0 0 0 .09-.03c.47-.64.88-1.32 1.24-2.03a.08.08 0 0 0-.04-.11 13.1 13.1 0 0 1-1.87-.89.08.08 0 0 1 0-.13c.13-.1.25-.19.37-.29a.08.08 0 0 1 .08-.01c3.93 1.8 8.18 1.8 12.07 0a.08.08 0 0 1 .08.01c.12.1.25.2.37.3a.08.08 0 0 1 0 .12 12.28 12.28 0 0 1-1.87.9.08.08 0 0 0-.04.11c.36.71.78 1.39 1.24 2.03a.08.08 0 0 0 .09.03A19.9 19.9 0 0 0 23.9 18c.5-5.18-.85-9.68-3.55-13.6a.07.07 0 0 0-.03-.03zM8.02 15.33c-1.18 0-2.16-1.09-2.16-2.42s.96-2.42 2.16-2.42c1.21 0 2.18 1.1 2.16 2.42 0 1.33-.96 2.42-2.16 2.42zm7.96 0c-1.18 0-2.15-1.09-2.15-2.42s.96-2.42 2.15-2.42c1.21 0 2.18 1.1 2.16 2.42 0 1.33-.95 2.42-2.16 2.42z"/>
        </svg>
      </div>
    </section>

    <!-- Search Input -->
    <div class="search-box-wrapper">
      <input type="text" id="nexus-search-bar" class="search-input" placeholder="search anything..." autocomplete="off" spellcheck="false">
    </div>
  </main>

  <!-- In-App Proxied Browser Viewport -->
  <div id="browser-view">
    <div class="browser-toolbar">
      <button class="browser-btn" title="Back" onclick="historyBack()">←</button>
      <button class="browser-btn" title="Reload" onclick="reloadCurrent()">↻</button>
      <button class="browser-btn" title="Home" onclick="closeBrowser()">⌂</button>
      
      <input type="text" id="browser-url-bar" class="browser-omnibox" spellcheck="false">
      
      <!-- Live Transport Engine Badge -->
      <div id="engine-badge" class="engine-status-badge">
        <span id="engine-badge-icon">⚡</span>
        <span id="engine-badge-name">Epoxy (Wasm TLS)</span>
      </div>

      <button class="browser-btn" title="Close" onclick="closeBrowser()">✕</button>
    </div>
    <div id="loading-indicator-bar"></div>
    <iframe id="sandbox-viewport" sandbox="allow-scripts allow-forms allow-same-origin allow-modals"></iframe>
  </div>

  <!-- Relays Modal -->
  <div id="relays-modal" class="modal-backdrop" onclick="closeModalOnBg(event, 'relays-modal')">
    <div class="modal-card">
      <div class="modal-header">
        <h2 class="modal-title">Active Wisp Relays</h2>
        <button class="modal-close" onclick="closeModal('relays-modal')">&times;</button>
      </div>
      <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 16px;">
        Multiplexed TCP/TLS packets are tunneled via Wisp. Tap a relay below to activate it.
      </p>
      <div id="relays-list"></div>
      <button onclick="pingAllRelays()" style="margin-top: 10px; padding: 10px; background: #22242c; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #fff; cursor: pointer; font-weight: 600;">
        Ping All Relays
      </button>
    </div>
  </div>

  <!-- Games Modal -->
  <div id="games-modal" class="modal-backdrop" onclick="closeModalOnBg(event, 'games-modal')">
    <div class="modal-card">
      <div class="modal-header">
        <h2 class="modal-title">Nexus Games</h2>
        <button class="modal-close" onclick="closeModal('games-modal')">&times;</button>
      </div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <button onclick="launchApp('https://play2048.co')" style="padding: 14px; background: #1c1d22; border: 1px solid rgba(255,255,255,0.06); border-radius: 10px; color: #fff; cursor: pointer;">2048</button>
        <button onclick="launchApp('https://retrobowl.me')" style="padding: 14px; background: #1c1d22; border: 1px solid rgba(255,255,255,0.06); border-radius: 10px; color: #fff; cursor: pointer;">Retro Bowl</button>
        <button onclick="launchApp('https://slopegame.online')" style="padding: 14px; background: #1c1d22; border: 1px solid rgba(255,255,255,0.06); border-radius: 10px; color: #fff; cursor: pointer;">Slope</button>
        <button onclick="launchApp('https://flappybird.io')" style="padding: 14px; background: #1c1d22; border: 1px solid rgba(255,255,255,0.06); border-radius: 10px; color: #fff; cursor: pointer;">Flappy Bird</button>
      </div>
    </div>
  </div>

  <!-- Apps Modal -->
  <div id="apps-modal" class="modal-backdrop" onclick="closeModalOnBg(event, 'apps-modal')">
    <div class="modal-card">
      <div class="modal-header">
        <h2 class="modal-title">Apps</h2>
        <button class="modal-close" onclick="closeModal('apps-modal')">&times;</button>
      </div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <button onclick="launchApp('https://duckduckgo.com')" style="padding: 14px; background: #1c1d22; border: 1px solid rgba(255,255,255,0.06); border-radius: 10px; color: #fff; cursor: pointer;">DuckDuckGo</button>
        <button onclick="launchApp('https://github.com')" style="padding: 14px; background: #1c1d22; border: 1px solid rgba(255,255,255,0.06); border-radius: 10px; color: #fff; cursor: pointer;">GitHub</button>
        <button onclick="launchApp('https://wikipedia.org')" style="padding: 14px; background: #1c1d22; border: 1px solid rgba(255,255,255,0.06); border-radius: 10px; color: #fff; cursor: pointer;">Wikipedia</button>
        <button onclick="launchApp('https://reddit.com')" style="padding: 14px; background: #1c1d22; border: 1px solid rgba(255,255,255,0.06); border-radius: 10px; color: #fff; cursor: pointer;">Reddit</button>
      </div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div id="settings-modal" class="modal-backdrop" onclick="closeModalOnBg(event, 'settings-modal')">
    <div class="modal-card">
      <div class="modal-header">
        <h2 class="modal-title">Nexus Settings</h2>
        <button class="modal-close" onclick="closeModal('settings-modal')">&times;</button>
      </div>
      <label style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 6px; display: block;">Custom Wisp Relay URL:</label>
      <input type="text" id="custom-relay-input" placeholder="wss://..." style="width: 100%; padding: 10px; background: #0b0b0e; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #fff; margin-bottom: 14px;">
      <button onclick="saveCustomRelay()" style="padding: 10px; background: var(--brand-mint); border: none; border-radius: 8px; color: #000; font-weight: 700; cursor: pointer;">
        Save & Apply Relay
      </button>
    </div>
  </div>

  <script>
    /* =========================================================================
       1. STARFIELD BACKGROUND ENGINE
       ========================================================================= */
    const canvas = document.getElementById('stars-canvas');
    const ctx = canvas.getContext('2d');
    let stars = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      initStars();
    }

    function initStars() {
      stars = [];
      const numStars = Math.floor((canvas.width * canvas.height) / 7000);
      for (let i = 0; i < numStars; i++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          size: Math.random() * 1.5 + 0.5,
          alpha: Math.random() * 0.7 + 0.3,
          speed: Math.random() * 0.015 + 0.005,
          flickerDir: Math.random() > 0.5 ? 1 : -1
        });
      }
    }

    function drawStars() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let s of stars) {
        s.alpha += s.speed * s.flickerDir;
        if (s.alpha > 0.9) { s.alpha = 0.9; s.flickerDir = -1; }
        else if (s.alpha < 0.2) { s.alpha = 0.2; s.flickerDir = 1; }

        ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
      }
      requestAnimationFrame(drawStars);
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    drawStars();

    /* =========================================================================
       2. WISP RELAYS REGISTRY
       ========================================================================= */
    const WISP_RELAYS = [
      { id: 'mw', name: 'Mercury Workshop Demo', url: 'wss://wisp.mercurywork.shop/', ping: null },
      { id: 'anura', name: 'Anura Pro Relay', url: 'wss://anura.pro/', ping: null },
      { id: 'ruby', name: 'Ruby Network', url: 'wss://ruby.rubynetwork.co/wisp/', ping: null },
      { id: 'pydodge', name: 'PyDodge Wisp', url: 'wss://wisp.pydodge.com/', ping: null },
      { id: 'shuttle', name: 'Shuttle Proxy', url: 'wss://mercury.shuttleproxy.com/', ping: null }
    ];

    let currentRelayIndex = 0;

    function renderRelays() {
      const container = document.getElementById('relays-list');
      container.innerHTML = '';
      WISP_RELAYS.forEach((relay, idx) => {
        const item = document.createElement('div');
        item.className = `relay-item ${idx === currentRelayIndex ? 'active' : ''}`;
        item.onclick = () => selectRelay(idx);
        item.innerHTML = `
          <div>
            <div class="relay-name">${relay.name}</div>
            <div class="relay-url">${relay.url}</div>
          </div>
          <div class="relay-latency">${relay.ping ? relay.ping + ' ms' : 'Select'}</div>
        `;
        container.appendChild(item);
      });
    }

    function selectRelay(index) {
      currentRelayIndex = index;
      renderRelays();
      closeModal('relays-modal');
    }

    async function pingAllRelays() {
      for (let r of WISP_RELAYS) {
        const start = performance.now();
        try {
          const ws = new WebSocket(r.url);
          await new Promise((resolve, reject) => {
            ws.onopen = () => {
              r.ping = Math.round(performance.now() - start);
              ws.close();
              resolve();
            };
            ws.onerror = reject;
            setTimeout(() => { ws.close(); reject(new Error('Timeout')); }, 2500);
          });
        } catch {
          r.ping = 'Offline';
        }
        renderRelays();
      }
    }

    function saveCustomRelay() {
      const val = document.getElementById('custom-relay-input').value.trim();
      if (val.startsWith('wss://') || val.startsWith('ws://')) {
        WISP_RELAYS.unshift({ id: 'custom', name: 'Custom Relay', url: val, ping: null });
        currentRelayIndex = 0;
        renderRelays();
        closeModal('settings-modal');
      }
    }

    renderRelays();

    /* =========================================================================
       3. TRANSPORT LAYER: EPOXY (Primary) -> LIBCURL.JS (Fallback)
       ========================================================================= */
    let currentNavUrl = '';
    let navHistory = [];

    async function fetchWithWispFallback(targetUrl) {
      const activeRelay = WISP_RELAYS[currentRelayIndex].url;
      updateLoadingBar(30);

      // --- STEP 1: Attempt with Epoxy (Rustls WASM over Wisp) ---
      try {
        console.log(`[Nexus] Requesting ${targetUrl} via Epoxy on relay ${activeRelay}`);
        if (window.EpoxyClient || (window.EpoxyTransport && window.EpoxyTransport.EpoxyClient)) {
          const ClientClass = window.EpoxyClient || window.EpoxyTransport.EpoxyClient;
          const epoxy = new ClientClass({ wisp: activeRelay });
          
          const res = await epoxy.fetch(targetUrl);
          const html = await res.text();
          return {
            html,
            engineName: 'Epoxy (Wasm TLS)',
            isFallback: false
          };
        }
      } catch (epoxyErr) {
        console.warn('[Nexus] Epoxy fetch failed. Engaging libcurl.js fallback...', epoxyErr);
      }

      // --- STEP 2: Fallback to libcurl.js (WASM libcurl over Wisp) ---
      updateLoadingBar(60);
      try {
        console.log(`[Nexus] Requesting ${targetUrl} via libcurl.js on relay ${activeRelay}`);
        if (window.libcurl && typeof window.libcurl.fetch === 'function') {
          window.libcurl.set_websocket(activeRelay.endsWith('/') ? activeRelay : activeRelay + '/');
          window.libcurl.transport = 'wisp';

          const res = await window.libcurl.fetch(targetUrl);
          const html = await res.text();
          return {
            html,
            engineName: 'libcurl.js (Wasm)',
            isFallback: true
          };
        }
      } catch (curlErr) {
        console.error('[Nexus] libcurl.js fetch failed:', curlErr);
      }

      throw new Error(`Failed to load through both Epoxy and libcurl.js over ${activeRelay}`);
    }

    /* =========================================================================
       4. HTML/CSS/JS RUNNER & REWRITER
       ========================================================================= */
    async function navigateTo(rawInput) {
      let targetUrl = formatUrl(rawInput);
      if (!targetUrl) return;

      currentNavUrl = targetUrl;
      navHistory.push(targetUrl);

      // Open Browser UI
      openBrowserUI(targetUrl);
      setEngineStatus('Loading...', 'loading');
      updateLoadingBar(10);

      try {
        const { html, engineName, isFallback } = await fetchWithWispFallback(targetUrl);
        updateLoadingBar(85);

        // Process and run HTML, CSS, JS
        const processedHtml = executeSitePipeline(html, targetUrl);

        // Render into sandboxed iframe
        const iframe = document.getElementById('sandbox-viewport');
        iframe.srcdoc = processedHtml;

        setEngineStatus(engineName, isFallback ? 'libcurl' : 'epoxy');
        updateLoadingBar(100);
        setTimeout(() => updateLoadingBar(0), 400);

      } catch (err) {
        updateLoadingBar(0);
        setEngineStatus('Error', 'libcurl');
        const iframe = document.getElementById('sandbox-viewport');
        iframe.srcdoc = `
          <body style="background:#111;color:#eee;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;flex-direction:column;">
            <h2 style="color:#f87171;">Connection Failed</h2>
            <p style="color:#aaa;max-width:500px;text-align:center;">${err.message}</p>
            <p style="color:#666;font-size:0.8rem;">Try switching to another Wisp relay via the handshake icon in Nexus.</p>
          </body>
        `;
      }
    }

    function executeSitePipeline(rawHtml, targetUrl) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(rawHtml, 'text/html');

      // 1. Inject <base> tag so relative CSS, JS, fonts, and images resolve
      let baseTag = doc.querySelector('base');
      if (!baseTag) {
        baseTag = doc.createElement('base');
        doc.head.insertBefore(baseTag, doc.head.firstChild);
      }
      baseTag.setAttribute('href', targetUrl);

      // 2. Intercept clicked hyperlinks so navigation stays inside Nexus
      const clientInterceptor = doc.createElement('script');
      clientInterceptor.textContent = `
        (function() {
          document.addEventListener('click', function(e) {
            const anchor = e.target.closest('a');
            if (anchor && anchor.href && !anchor.href.startsWith('javascript:')) {
              e.preventDefault();
              window.parent.postMessage({ type: 'NEXUS_LINK_CLICK', url: anchor.href }, '*');
            }
          }, true);

          // Prevent frame-busting scripts from breaking out of viewport
          try {
            window.top = window.self;
            window.parent = window.self;
          } catch(e) {}
        })();
      `;
      doc.head.appendChild(clientInterceptor);

      return '<!DOCTYPE html>\n' + doc.documentElement.outerHTML;
    }

    // Handle intercepted navigation from inside iframe
    window.addEventListener('message', (event) => {
      if (event.data && event.data.type === 'NEXUS_LINK_CLICK') {
        navigateTo(event.data.url);
      }
    });

    /* =========================================================================
       5. URL FORMATTING & UI CONTROLS
       ========================================================================= */
    function formatUrl(val) {
      val = val.trim();
      if (!val) return '';
      if (/^https?:\/\//i.test(val)) return val;
      if (/^[a-zA-Z0-9-]+(\.[a-zA-Z0-9-]+)+/i.test(val)) return 'https://' + val;
      return 'https://duckduckgo.com/html/?q=' + encodeURIComponent(val);
    }

    function openBrowserUI(url) {
      document.getElementById('browser-view').style.display = 'flex';
      document.getElementById('browser-url-bar').value = url;
    }

    function closeBrowser() {
      document.getElementById('browser-view').style.display = 'none';
      document.getElementById('sandbox-viewport').srcdoc = '';
    }

    function setEngineStatus(label, variant) {
      const badge = document.getElementById('engine-badge');
      const badgeName = document.getElementById('engine-badge-name');
      const badgeIcon = document.getElementById('engine-badge-icon');

      badge.className = `engine-status-badge ${variant}`;
      badgeName.textContent = label;
      badgeIcon.textContent = variant === 'epoxy' ? '⚡' : (variant === 'libcurl' ? '🔄' : '⌛');
    }

    function updateLoadingBar(percent) {
      document.getElementById('loading-indicator-bar').style.width = percent + '%';
    }

    function reloadCurrent() {
      if (currentNavUrl) navigateTo(currentNavUrl);
    }

    function historyBack() {
      if (navHistory.length > 1) {
        navHistory.pop(); // remove current
        const prev = navHistory.pop();
        navigateTo(prev);
      }
    }

    function launchApp(url) {
      navigateTo(url);
    }

    // Search bar submit
    const searchInput = document.getElementById('nexus-search-bar');
    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') navigateTo(searchInput.value);
    });

    // Omnibox submit
    const omnibox = document.getElementById('browser-url-bar');
    omnibox.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') navigateTo(omnibox.value);
    });

    // Modals
    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    function closeModalOnBg(e, id) { if (e.target.id === id) closeModal(id); }
  </script>
</body>
</html>
