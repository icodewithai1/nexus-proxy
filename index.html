<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #0f1014;
            color: #ffffff;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Background Simulation */
        .bg-gradient {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 60% 40%, rgba(40, 50, 70, 0.4) 0%, rgba(15, 16, 20, 1) 100%);
            z-index: 0;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            z-index: 10;
            font-size: 14px;
            font-weight: 600;
        }

        .top-left {
            display: flex;
            align-items: center;
            gap: 15px;
            color: #d1d5db;
        }

        .top-right {
            display: flex;
            align-items: center;
            gap: 20px;
            color: #d1d5db;
        }

        .icons {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .icon {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .badge {
            position: absolute;
            top: -8px;
            right: -8px;
            background-color: transparent;
            color: #fff;
            font-size: 10px;
            font-weight: bold;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f5a623, #d0021b);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            color: #fff;
        }

        /* Navigation */
        .nav {
            display: flex;
            align-items: center;
            gap: 25px;
            padding: 0 40px;
            margin-top: 10px;
            z-index: 10;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .trigger {
            border: 1px solid #6b7280;
            border-radius: 20px;
            padding: 2px 8px;
            font-size: 11px;
            color: #9ca3af;
            cursor: pointer;
        }

        .nav-item {
            color: #9ca3af;
            cursor: pointer;
            transition: all 0.2s ease;
            padding: 6px 16px;
            border-radius: 20px;
        }

        .nav-item.active {
            background-color: #0070d1;
            color: #ffffff;
        }

        .nav-item:hover:not(.active) {
            color: #ffffff;
        }

        /* Content Row */
        .content-row {
            position: absolute;
            bottom: 120px;
            width: 100%;
            display: flex;
            gap: 20px;
            padding: 0 40px;
            overflow-x: auto;
            z-index: 10;
            scrollbar-width: none; /* Firefox */
            min-height: 220px;
            align-items: flex-end;
        }

        .content-row::-webkit-scrollbar {
            display: none; /* Chrome */
        }

        /* Game Card */
        .game-card {
            flex: 0 0 auto;
            width: 180px;
            height: 180px;
            border-radius: 8px;
            background: linear-gradient(135deg, #1f2937, #111827);
            border: 1px solid #374151;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding: 10px;
            text-align: center;
            font-size: 12px;
            font-weight: 700;
            color: #e5e7eb;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
            text-decoration: none;
        }

        .game-card:hover {
            transform: translateY(-10px) scale(1.05);
            border-color: #0070d1;
            box-shadow: 0 15px 30px rgba(0, 112, 209, 0.3);
        }

        .game-card span {
            position: relative;
            z-index: 2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        .game-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.3) 60%, rgba(0,0,0,0) 100%);
            z-index: 1;
        }

        .game-icon {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
            z-index: 0;
        }

        .provider-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.7);
            color: #00c3e3;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 9px;
            font-weight: 600;
            z-index: 3;
            letter-spacing: 0.5px;
        }

        /* Loading & Error states */
        .loading-state {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 180px;
            color: #9ca3af;
            font-size: 14px;
            font-weight: 600;
            width: 100%;
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid #374151;
            border-top: 3px solid #0070d1;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 12px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Bottom Bar */
        .bottom-bar {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            z-index: 10;
            font-size: 12px;
            font-weight: 600;
            color: #9ca3af;
        }

        .ps-logo {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #d1d5db;
        }

        .controls {
            display: flex;
            gap: 25px;
            align-items: center;
        }

        .control-item {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .control-item:hover {
            color: #ffffff;
        }

        .btn-icon {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid #9ca3af;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
        }

        .btn-icon.triangle { border-color: #00c3e3; color: #00c3e3; }
        .btn-icon.square { border-color: #e5007d; color: #e5007d; }
        .btn-icon.cross { border-color: #8bc53f; color: #8bc53f; }
        .btn-icon.options { border-radius: 4px; border: 2px solid #9ca3af; }

    </style>
</head>
<body>

    <div class="bg-gradient"></div>

    <!-- Top Bar -->
    <header class="top-bar">
        <div class="top-left">
            <span>21:35</span>
            <div class="icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12.55a11 11 0 0 1 14.08 0"></path><path d="M1.42 9a16 16 0 0 1 21.16 0"></path><path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path><line x1="12" y1="20" x2="12.01" y2="20"></line></svg>
            </div>
        </div>
        <div class="top-right">
            <div class="icons">
                <div class="icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                    <span class="badge">12</span>
                </div>
                <div class="icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                    <span class="badge">9</span>
                </div>
                <div class="icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    <span class="badge">14</span>
                </div>
            </div>
            <div class="user-profile">
                <div class="avatar">F</div>
                <span>FallingStickman</span>
            </div>
        </div>
    </header>

    <!-- Navigation -->
    <nav class="nav">
        <span class="trigger">L1</span>
        <span class="nav-item active">ALL</span>
        <span class="nav-item">RACING</span>
        <span class="nav-item">ROLEPLAYING</span>
        <span class="nav-item">SPORTS</span>
        <span class="nav-item">ONLINE</span>
        <span class="nav-item">SHOOTE</span>
        <span class="trigger">R1</span>
    </nav>

    <!-- Games Row (Dynamically Populated) -->
    <main class="content-row" id="games-container">
        <div class="loading-state" id="loading-indicator">
            <div class="spinner"></div>
            Loading game libraries...
        </div>
    </main>

    <!-- Bottom Bar -->
    <footer class="bottom-bar">
        <div class="ps-logo">PS5</div>
        <div class="controls">
            <div class="control-item">
                <div class="btn-icon options"></div>
                <span>OPTIONS</span>
            </div>
            <div class="control-item">
                <div class="btn-icon triangle">&#9651;</div>
                <span>TOP MENU</span>
            </div>
            <div class="control-item">
                <div class="btn-icon square">&#9633;</div>
                <span>DETAILS</span>
            </div>
            <div class="control-item">
                <div class="btn-icon cross">&#10005;</div>
                <span>PLAY</span>
            </div>
        </div>
    </footer>

    <!-- Game Library Integration & Blob Execution Script -->
    <script>
        (function() {
            'use strict';

            /**
             * ============================================================
             *  NEXUS GAME PROVIDER MODULE
             * ============================================================
             *  Fetches game data (icon, name, htmlUrl) from multiple
             *  providers. Each provider has a different API structure,
             *  so we normalize the results into a common format:
             *  { name, icon, htmlUrl, provider }
             * ============================================================
             */

            const GameProvider = {
                // ---- CONFIGURATION ------------------------------------
                config: {
                    // Add your GameMonetize Hash/ID here if you have one.
                    // Get it from your GameMonetize control panel.
                    gameMonetizeHash: 'YOUR_GAMEMONETIZE_HASH_HERE',

                    // Add your GamePix SID here if you have one.
                    // Get it from your GamePix developer dashboard.
                    gamePixSid: 'YOUR_GAMEPIX_SID_HERE',

                    // GNMath CDN endpoint (public, no auth required)
                    gnMathZonesUrl: 'https://cdn.jsdelivr.net/gh/gn-math/games/zones.json',

                    // Lumin SDK endpoint (placeholder - update if you have a real one)
                    luminSdkUrl: 'https://luminsdk.com/api/games',

                    // How many games to show from each provider
                    gamesPerProvider: 8
                },

                // ---- UNIFIED FETCH METHODS ----------------------------

                /**
                 * Fetch games from Lumin SDK.
                 * Lumin SDK typically returns an array of game objects.
                 * Expected fields: id, title, thumbnail, url
                 */
                async fetchLuminGames() {
                    try {
                        const res = await fetch(this.config.luminSdkUrl, {
                            method: 'GET',
                            headers: { 'Accept': 'application/json' }
                        });
                        if (!res.ok) throw new Error('Lumin SDK fetch failed');
                        const data = await res.json();

                        // Normalize: Lumin may return { games: [...] } or an array
                        const games = Array.isArray(data) ? data : (data.games || []);

                        return games.slice(0, this.config.gamesPerProvider).map(g => ({
                            name: g.title || g.name || 'Unknown Game',
                            icon: g.thumbnail || g.icon || '',
                            htmlUrl: g.url || g.gameUrl || '#',
                            provider: 'LUMIN'
                        }));
                    } catch (err) {
                        console.warn('[Nexus] Lumin SDK unavailable:', err.message);
                        return [];
                    }
                },

                /**
                 * Fetch games from GameMonetize via their RSS/JSON feed.
                 * The feed URL is: https://gamemonetize.com/rssfeed.php
                 * You need a valid hash (GameID) from your control panel.
                 */
                async fetchGameMonetizeGames() {
                    const hash = this.config.gameMonetizeHash;
                    if (hash === 'YOUR_GAMEMONETIZE_HASH_HERE') {
                        console.warn('[Nexus] GameMonetize hash not configured. Skipping.');
                        return [];
                    }

                    try {
                        // GameMonetize provides a JSON feed
                        const url = `https://gamemonetize.com/rssfeed.php?format=json&num=${this.config.gamesPerProvider}&hash=${hash}`;
                        const res = await fetch(url);
                        if (!res.ok) throw new Error('GameMonetize fetch failed');
                        const data = await res.json();

                        // Normalize: typically returns { games: [...] }
                        const games = data.games || data || [];

                        return games.slice(0, this.config.gamesPerProvider).map(g => ({
                            name: g.title || g.name || 'Unknown Game',
                            icon: g.thumb || g.thumbnail || g.image || '',
                            htmlUrl: g.url || g.game_url || '#',
                            provider: 'MONETIZE'
                        }));
                    } catch (err) {
                        console.warn('[Nexus] GameMonetize unavailable:', err.message);
                        return [];
                    }
                },

                /**
                 * Fetch games from GamePix.
                 * GamePix provides a games API at: https://games.gamepix.com/games
                 * Requires a SID (publisher ID) from your developer dashboard.
                 */
                async fetchGamePixGames() {
                    const sid = this.config.gamePixSid;
                    if (sid === 'YOUR_GAMEPIX_SID_HERE') {
                        console.warn('[Nexus] GamePix SID not configured. Skipping.');
                        return [];
                    }

                    try {
                        const url = `https://games.gamepix.com/games?sid=${sid}&order=q&limit=${this.config.gamesPerProvider}`;
                        const res = await fetch(url);
                        if (!res.ok) throw new Error('GamePix fetch failed');
                        const data = await res.json();

                        // Normalize: GamePix returns { data: [...] }
                        const games = data.data || data.games || data || [];

                        return games.slice(0, this.config.gamesPerProvider).map(g => ({
                            name: g.title || g.name || 'Unknown Game',
                            icon: g.image || g.icon || g.thumb || '',
                            htmlUrl: g.url || g.gameUrl || g.link || '#',
                            provider: 'GAMEPIX'
                        }));
                    } catch (err) {
                        console.warn('[Nexus] GamePix unavailable:', err.message);
                        return [];
                    }
                },

                /**
                 * Fetch games from GNMath.
                 * GNMath hosts a zones.json file on jsDelivr CDN.
                 * Each zone contains a list of games with id, name, and assets.
                 */
                async fetchGnMathGames() {
                    try {
                        const res = await fetch(this.config.gnMathZonesUrl);
                        if (!res.ok) throw new Error('GNMath fetch failed');
                        const zones = await res.json();

                        // Flatten all zones into a single game list
                        const allGames = zones.flatMap(zone =>
                            (zone.games || []).map(g => ({
                                name: g.name || g.title || 'Unknown Game',
                                icon: g.icon || g.image || g.thumbnail || '',
                                htmlUrl: g.url || g.html || g.link || '#',
                                provider: 'GNMATH'
                            }))
                        );

                        return allGames.slice(0, this.config.gamesPerProvider);
                    } catch (err) {
                        console.warn('[Nexus] GNMath unavailable:', err.message);
                        return [];
                    }
                },

                // ---- AGGREGATOR ---------------------------------------
                /**
                 * Fetch games from ALL providers in parallel and return
                 * a combined, shuffled list.
                 */
                async fetchAllGames() {
                    const results = await Promise.allSettled([
                        this.fetchLuminGames(),
                        this.fetchGameMonetizeGames(),
                        this.fetchGamePixGames(),
                        this.fetchGnMathGames()
                    ]);

                    // Extract fulfilled results, ignore failures
                    const allGames = results
                        .filter(r => r.status === 'fulfilled')
                        .flatMap(r => r.value);

                    // Shuffle for variety (Fisher-Yates)
                    for (let i = allGames.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [allGames[i], allGames[j]] = [allGames[j], allGames[i]];
                    }

                    return allGames;
                }
            };

            /**
             * ============================================================
             *  UI RENDERER
             * ============================================================
             */
            const NexusUI = {
                container: null,
                loadingIndicator: null,

                init() {
                    this.container = document.getElementById('games-container');
                    this.loadingIndicator = document.getElementById('loading-indicator');
                },

                /**
                 * Render an array of normalized game objects as cards.
                 */
                renderGames(games) {
                    if (!this.container) return;

                    // Remove loading indicator
                    if (this.loadingIndicator) {
                        this.loadingIndicator.remove();
                        this.loadingIndicator = null;
                    }

                    if (games.length === 0) {
                        this.showEmptyState();
                        return;
                    }

                    // Clear existing cards (keep loading indicator removed)
                    const fragment = document.createDocumentFragment();

                    games.forEach(game => {
                        const card = this.createGameCard(game);
                        fragment.appendChild(card);
                    });

                    this.container.innerHTML = '';
                    this.container.appendChild(fragment);
                },

                /**
                 * Create a single game card DOM element.
                 */
                createGameCard(game) {
                    const card = document.createElement('a');
                    card.className = 'game-card';
                    card.href = game.htmlUrl;
                    card.target = '_blank';
                    card.rel = 'noopener noreferrer';
                    card.title = game.name;

                    // Icon image
                    if (game.icon) {
                        const img = document.createElement('img');
                        img.className = 'game-icon';
                        img.src = game.icon;
                        img.alt = game.name;
                        img.loading = 'lazy';
                        img.onerror = () => { img.style.display = 'none'; }; // hide broken images
                        card.appendChild(img);
                    }

                    // Provider badge
                    const badge = document.createElement('span');
                    badge.className = 'provider-badge';
                    badge.textContent = game.provider;
                    card.appendChild(badge);

                    // Game name
                    const nameSpan = document.createElement('span');
                    nameSpan.textContent = game.name;
                    card.appendChild(nameSpan);

                    return card;
                },

                showEmptyState() {
                    if (!this.container) return;
                    this.container.innerHTML = `
                        <div class="loading-state">
                            No games available. Check your API configuration.
                        </div>
                    `;
                }
            };

            /**
             * ============================================================
             *  BOOTSTRAP
             * ============================================================
             */
            async function boot() {
                NexusUI.init();

                // Attempt to fetch games from all providers
                const games = await GameProvider.fetchAllGames();

                // Render them
                NexusUI.renderGames(games);

                console.log(`[Nexus] Loaded ${games.length} games from ${[...new Set(games.map(g => g.provider))].join(', ')}`);

                // ---- BLOB EXECUTION ----
                // As requested, we take the entire HTML document, turn it
                // into a Blob, and generate a URL. This literally "runs"
                // the code from a Blob object.
                const fullHtmlCode = document.documentElement.outerHTML;
                const blob = new Blob([fullHtmlCode], { type: 'text/html' });
                const blobUrl = URL.createObjectURL(blob);

                console.log('[Nexus] Blob URL generated:', blobUrl);
                // Uncomment the line below to open the UI in a new tab via the Blob URL:
                // window.open(blobUrl, '_blank');
            }

            // Start the app when DOM is ready
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', boot);
            } else {
                boot();
            }

        })();
    </script>
</body>
</html>
