<!DOCTYPE html>
<!--
  NEXUS — school-style proxy browser (client)
  ▸ Deploy with Code.gs: create an HTML file named "index" in the same Apps Script
    project and paste this whole file into it.
  ▸ Also works standalone (open directly in a browser): falls back to the
    translate.goog mirror without the server bridge.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexus — private browser</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237c5cff'/%3E%3Cstop offset='1' stop-color='%2300e5a0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M7 26V6l18 20V6' fill='none' stroke='url(%23g)' stroke-width='4.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#050608;--sbar:#0a0c0f;--panel:#0d1014;--panel2:#11151b;--line:#1b2029;--txt:#e9ebf2;--dim:#8a93a6;--mut:#5b6373;--acc:#7c5cff;--ok:#00e5a0;--warn:#ffb454;--err:#ff5c74}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font:13px/1.45 system-ui,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;display:flex;overflow:hidden}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#232936;border-radius:8px}::-webkit-scrollbar-track{background:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
select,input{font:inherit;color:var(--txt)}
/* ── sidebar ── */
#side{width:230px;min-width:230px;background:var(--sbar);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:12px 10px;gap:2px}
.logo{display:flex;align-items:center;gap:9px;padding:6px 8px 14px}
.logo svg{width:26px;height:26px}
.logo b{font-size:15px;letter-spacing:2.5px;font-weight:700}
.logo b i{color:var(--acc);font-style:normal}
.ver{margin-left:auto;font-size:9px;color:var(--mut);border:1px solid var(--line);padding:1px 6px;border-radius:20px}
.sec{font-size:9.5px;letter-spacing:1.6px;color:var(--mut);text-transform:uppercase;padding:12px 8px 5px}
.nav{display:flex;align-items:center;gap:9px;width:100%;padding:7px 9px;border-radius:8px;color:var(--dim);text-align:left}
.nav:hover{background:var(--panel2);color:var(--txt)}
.nav svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pin{display:flex;align-items:center;gap:9px;width:100%;padding:6px 9px;border-radius:8px;color:var(--dim);text-align:left}
.pin:hover{background:var(--panel2);color:var(--txt)}
.fav{width:16px;height:16px;border-radius:4px;flex:none;object-fit:contain;background:#161a22}
.fav-letter{width:16px;height:16px;border-radius:4px;background:#1a1f29;color:var(--dim);font-size:9px;display:inline-flex;align-items:center;justify-content:center;flex:none;font-weight:700}
.spacer{flex:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;font-size:11.5px}
.card label{color:var(--mut);font-size:10px;letter-spacing:.4px}
.card select{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 7px;outline:none}
.badge{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:8px;background:var(--panel);border:1px solid var(--line);font-size:11px;color:var(--dim);margin-top:10px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--warn);box-shadow:0 0 6px currentColor;flex:none}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.err{background:var(--err)}
.foot{color:var(--mut);font-size:10px;padding:10px 8px 2px;text-align:center}
/* ── main ── */
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#tabstrip{display:flex;align-items:flex-end;background:var(--sbar);border-bottom:1px solid var(--line);padding:6px 8px 0;gap:4px;height:40px}
#tabs{display:flex;gap:4px;flex:1;overflow:hidden}
.tab{display:flex;align-items:center;gap:7px;max-width:190px;min-width:110px;flex:0 1 auto;padding:7px 9px;border-radius:9px 9px 0 0;background:transparent;color:var(--dim);border:1px solid transparent;border-bottom:0}
.tab.on{background:var(--panel);color:var(--txt);border-color:var(--line)}
.tab .tt{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.tab .x{width:16px;height:16px;border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--mut);flex:none}
.tab .x:hover{background:#232936;color:var(--txt)}
#newtab{width:28px;height:28px;border-radius:8px;color:var(--dim);display:flex;align-items:center;justify-content:center;margin-bottom:2px;flex:none}
#newtab:hover{background:var(--panel2);color:var(--txt)}
#toolbar{display:flex;align-items:center;gap:7px;padding:7px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
.tbtn{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--dim);flex:none}
.tbtn:hover{background:var(--panel2);color:var(--txt)}
.tbtn:disabled{opacity:.32;pointer-events:none}
.tbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#omni{flex:1;display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:0 14px;height:32px;min-width:0}
#omni:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px rgba(124,92,255,.15)}
#omni>svg{width:13px;height:13px;stroke:var(--mut);fill:none;stroke-width:2;flex:none}
#url{flex:1;background:none;border:0;outline:none;font-size:12.5px;min-width:0}
#modechip{font-size:10px;color:var(--mut);border:1px solid var(--line);border-radius:20px;padding:3px 9px;white-space:nowrap;flex:none}
#modechip b{color:var(--acc);font-weight:600}
#go{background:var(--acc);color:#fff;border-radius:20px;padding:0 15px;height:32px;font-weight:600;flex:none}
#go:hover{filter:brightness(1.12)}
#loadbar{height:2px;background:linear-gradient(90deg,var(--acc),var(--ok));width:0%;transition:width .25s;opacity:0}
#loadbar.on{opacity:1}
#content{flex:1;position:relative;background:#000;min-height:0}
.view{position:absolute;inset:0;display:none;background:#000}
.view.on{display:block}
.nx-frame{width:100%;height:100%;border:0;background:#000}
.embed-wrap{position:absolute;inset:0;display:flex;flex-direction:column}
.embed-top{display:flex;align-items:center;gap:9px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);font-size:12px;color:var(--dim)}
.embed-top .t{color:var(--txt);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.embed-top .u{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mut);font-size:11px}
.embed-top .nx{color:var(--acc);letter-spacing:2px;font-weight:700;font-size:11px}
.embed-wrap iframe{flex:1;border:0;background:#000;width:100%}
/* ── home ── */
.home{position:absolute;inset:0;overflow:auto;background:radial-gradient(1100px 480px at 50% -10%,rgba(124,92,255,.14),transparent 60%),#050608;display:flex;justify-content:center;padding:50px 20px}
.home-in{width:100%;max-width:780px;display:flex;flex-direction:column;align-items:center;gap:20px}
.biglogo svg{width:70px;height:70px}
.home h1{font-size:30px;letter-spacing:7px;font-weight:700}
.home h1 i{color:var(--acc);font-style:normal}
.tag{color:var(--dim);font-size:13px;margin-top:-14px}
.hsearch{display:flex;align-items:center;gap:10px;width:100%;max-width:560px;background:var(--panel);border:1px solid var(--line);border-radius:26px;padding:0 18px;height:46px}
.hsearch:focus-within{border-color:var(--acc);box-shadow:0 0 0 4px rgba(124,92,255,.14)}
.hsearch svg{width:16px;height:16px;stroke:var(--mut);fill:none;stroke-width:2;flex:none}
.hsearch input{flex:1;background:none;border:0;outline:none;font-size:14px;min-width:0}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%;max-width:660px}
.tile{display:flex;flex-direction:column;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 8px;color:var(--dim);text-align:center}
.tile:hover{border-color:var(--acc);color:var(--txt);transform:translateY(-1px)}
.tile b{color:var(--txt);font-size:12px;font-weight:600}
.tile span{font-size:10px;color:var(--mut)}
.tile .fav{width:22px;height:22px}
.tips{width:100%;max-width:660px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 16px;font-size:12px;color:var(--dim);line-height:1.7}
.tips b{color:var(--txt)}
.tips kbd{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:10.5px;color:var(--txt)}
.recents{width:100%;max-width:660px;display:flex;flex-direction:column;gap:4px}
.recent{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;color:var(--dim);font-size:12px;width:100%;text-align:left}
.recent:hover{background:var(--panel2);color:var(--txt)}
.recent span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ── toasts ── */
#toasts{position:fixed;right:14px;bottom:14px;display:flex;flex-direction:column;gap:8px;z-index:99}
.toast{background:#141821;border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:10px;padding:10px 14px;font-size:12px;max-width:360px;color:var(--txt);box-shadow:0 8px 30px rgba(0,0,0,.5)}
.toast.err{border-left-color:var(--err)}.toast.ok{border-left-color:var(--ok)}
@media(max-width:860px){#side{display:none}}
</style>
</head>
<body>

<aside id="side">
  <div class="logo">
    <svg viewBox="0 0 32 32"><defs><linearGradient id="nxg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#00e5a0"/></linearGradient></defs><path d="M7 26V6l18 20V6" fill="none" stroke="url(#nxg)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <b>NEX<i>US</i></b><span class="ver">v1.1</span>
  </div>
  <button class="nav" id="btn-home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a2 2 0 0 1-2 2h-4v-7h-6v7H5a2 2 0 0 1-2-2z"/></svg>Home</button>
  <button class="nav" id="btn-new"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New tab</button>
  <div class="sec">Quick launch</div>
  <div id="pins"></div>
  <div class="spacer"></div>
  <div class="card">
    <label>RELAY MODE</label>
    <select id="mode">
      <option value="auto">Auto (recommended)</option>
      <option value="fetch">Server fetch + rewrite</option>
      <option value="server">Server iFrame (js-heavy sites)</option>
    </select>
    <label>MIRROR LANGUAGE</label>
    <select id="lang">
      <option value="es">es</option><option value="pt">pt</option><option value="fr">fr</option>
      <option value="de">de</option><option value="zh-CN">zh-CN</option><option value="ja">ja</option>
    </select>
  </div>
  <div class="badge"><span class="dot" id="tdot"></span><span id="tstate">connecting…</span></div>
  <div class="foot">NEXUS · apps script relay</div>
</aside>

<div id="main">
  <div id="tabstrip">
    <div id="tabs"></div>
    <button id="newtab" title="New tab (Ctrl+T)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  </div>
  <div id="toolbar">
    <button class="tbtn" id="back" title="Back (Alt+←)"><svg viewBox="0 0 24 24"><path d="M19 12H5m7-7l-7 7 7 7"/></svg></button>
    <button class="tbtn" id="fwd" title="Forward (Alt+→)"><svg viewBox="0 0 24 24"><path d="M5 12h14m-7-7l7 7-7 7"/></svg></button>
    <button class="tbtn" id="reload" title="Reload"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg></button>
    <div id="omni">
      <svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
      <input id="url" placeholder="Search or type a URL   ·   try:  yt lofi   |   now.gg" spellcheck="false" autocomplete="off">
      <span id="modechip"><b>idle</b></span>
    </div>
    <button id="go">Go</button>
  </div>
  <div id="loadbar"></div>
  <div id="content"></div>
</div>

<div id="toasts"></div>

<script>
/* ══════════════ CORE ══════════════ */
'use strict';
const HAS_GAS = !!(window.google && google.script && google.script.run);
const STATE = { mode: 'auto', lang: 'es', proxy: '', tabs: [], active: null, seq: 0, recents: [] };
const YT_RE = /(?:youtube\.com\/(?:watch\?[^#]*?v=|shorts\/|live\/|embed\/)|youtu\.be\/)([A-Za-z0-9_-]{6,})/i;
const TT_RE = /tiktok\.com\/(?:[^\/?#]+\/)?video\/(\d+)/i;
const SKIP_RE = /^(javascript:|mailto:|tel:|data:|blob:|about:|#)/i;
const PINS = [
  ['YouTube', 'https://www.youtube.com/'],
  ['TikTok', 'https://www.tiktok.com/'],
  ['Duck.ai', 'https://duck.ai/'],
  ['now.gg', 'https://now.gg/'],
  ['Reddit', 'https://www.reddit.com/'],
  ['Wikipedia', 'https://en.wikipedia.org/'],
  ['Discord', 'https://discord.com/'],
  ['Spotify', 'https://open.spotify.com/']
];
const $ = (id) => document.getElementById(id);

function tgoog(u, lang) {
  try {
    const m = String(u).match(/^(https?:\/\/)([^\/?#]+)([^?#]*)(\?[^#]*)?(#.*)?$/);
    if (!m) return u;
    const host = m[2].toLowerCase().replace(/-/g, '--').replace(/\./g, '-');
    const q = m[4] || '';
    return m[1] + host + '.translate.goog' + (m[3] || '/') + q + (q ? '&' : '?') +
      '_x_tr_sl=auto&_x_tr_tl=' + encodeURIComponent(lang || STATE.lang) + '&_x_tr_hl=en' + (m[5] || '');
  } catch (e) { return u; }
}
function gasCall(fn) {
  const args = Array.prototype.slice.call(arguments, 1);
  return new Promise((res, rej) => {
    try {
      google.script.run.withSuccessHandler(res)
        .withFailureHandler((e) => rej(new Error((e && e.message) || 'GAS bridge error')))
        [fn].apply(null, args);
    } catch (e) { rej(e); }
  });
}
function resolveInput(raw) {
  raw = (raw || '').trim();
  if (!raw) return '';
  if (/^yt\s+/i.test(raw)) return 'https://www.youtube.com/results?search_query=' + encodeURIComponent(raw.replace(/^yt\s+/i, ''));
  if (/^https?:\/\//i.test(raw)) return raw;
  if (/^[\w-]+(\.[\w-]+)+(:\d+)?(\/.*)?$/.test(raw)) return 'https://' + raw;
  return 'https://html.duckduckgo.com/html/?q=' + encodeURIComponent(raw);
}
function hostOf(u) { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return ''; } }
function prettyUrl(u) {
  try { const x = new URL(u); return (x.hostname + x.pathname + x.search).replace(/\/$/, '').slice(0, 42); }
  catch (e) { return String(u || '').slice(0, 42); }
}
function favHtml(host) {
  const letter = (host || '?').charAt(0).toUpperCase();
  return '<img class="fav" alt="" src="https://icons.duckduckgo.com/ip3/' + encodeURIComponent(host) + '.ico" ' +
    'onerror="this.outerHTML=\'<span class=&quot;fav-letter&quot;>' + letter + '</span>\'">';
}
function toast(msg, kind) {
  const d = document.createElement('div');
  d.className = 'toast ' + (kind || '');
  d.textContent = msg;
  $('toasts').appendChild(d);
  setTimeout(() => { d.style.opacity = '0'; d.style.transition = 'opacity .4s'; setTimeout(() => d.remove(), 420); }, 4200);
}
function loadbar(pct) {
  const b = $('loadbar');
  if (pct == null) { b.classList.remove('on'); b.style.width = '0%'; return; }
  b.classList.add('on'); b.style.width = Math.max(4, pct) + '%';
}
function badge(text, cls) { $('tstate').textContent = text; $('tdot').className = 'dot ' + (cls || 'warn'); }

/* ══════════════ INJECTED CLIENT HOOK (runs inside proxied pages) ══════════════ */
function NX_HOOK() {
  const RP = window.parent;                       // real parent, captured before any site JS messes with it
  function abs(u) { try { return new URL(u, document.baseURI).href; } catch (e) { return u; } }
  function deT(u) {
    try {
      const m = String(u).match(/^https?:\/\/(.+?)\.translate\.goog(\/.*)?$/);
      if (!m) return u;
      const h = m[1].replace(/--/g, '\u0001').replace(/-/g, '.').replace(/\u0001/g, '-');
      const r = (m[2] || '/').replace(/([?&])_x_tr_[^&]*&?/g, '$1').replace(/[?&]+$/, '');
      return 'https://' + h + r;
    } catch (e) { return u; }
  }
  function emit(u, kind) { try { RP.postMessage({ __nx: 'nav', url: u, via: 'fetch', kind: kind || '' }, '*'); } catch (e) {} }
  document.addEventListener('click', function (e) {
    const a = e.target && e.target.closest ? e.target.closest('a,area') : null;
    if (!a) return;
    const h = a.getAttribute('href') || '';
    if (!h || /^(javascript:|#|mailto:|tel:|data:|blob:)/i.test(h)) { if (h === '#') e.preventDefault(); return; }
    e.preventDefault(); e.stopPropagation();
    emit(a.getAttribute('data-nx1') || deT(abs(h)), 'link');
  }, true);
  document.addEventListener('submit', function (e) {
    const f = e.target; if (!f) return;
    e.preventDefault(); e.stopPropagation();
    try {
      const method = (f.getAttribute('method') || 'get').toLowerCase();
      let u = abs(f.getAttribute('action') || document.baseURI);
      if (method === 'get') {
        u = u.split('#')[0];
        const q = new URLSearchParams(new FormData(f)).toString();
        if (q) u += (u.indexOf('?') > -1 ? '&' : '?') + q;
      }
      emit(u, 'form');
    } catch (err) {}
  }, true);
  window.open = function (u) { emit(abs(u || 'about:blank'), 'popup'); return null; };
  /* route site-internal fetch/XHR through the server bridge when available */
  let G = null;
  try { if (RP.google && RP.google.script && RP.google.script.run) G = RP.google.script.run; } catch (e) {}
  if (G) {
    const OF = window.fetch;
    window.fetch = function (input, init) {
      try {
        const u = (typeof input === 'string') ? input : (input && input.url) || '';
        if (!u) return OF ? OF(input, init) : Promise.reject(new Error('bad fetch'));
        const au = abs(u);
        const target = /^https?:\/\//i.test(au) ? au : deT(au);
        return new Promise((res, rej) => {
          G.withSuccessHandler((r) => {
            if (!r) return rej(new Error('empty'));
            r.ok = r.code >= 200 && r.code < 400; r.status = r.code;
            r.headers = { get: (h) => /content-type/i.test(h || '') ? (r.ct || '') : null };
            r.text = () => Promise.resolve(r.body || '');
            r.json = () => { try { return Promise.resolve(JSON.parse(r.body || '{}')); } catch (e) { return Promise.resolve({}); } };
            res(r);
          }).withFailureHandler(rej).api_fetch(target, { mode: 't' });
        });
      } catch (e) { return OF ? OF(input, init) : Promise.reject(e); }
    };
    const OO = XMLHttpRequest.prototype.open;
    XMLHttpRequest.prototype.open = function (m, u) { this.__nxu = u; return OO.apply(this, arguments); };
    const OS = XMLHttpRequest.prototype.send;
    XMLHttpRequest.prototype.send = function () {
      const self = this;
      try {
        if (this.__nxu && !/^(https?:)?\/\//i.test(String(this.__nxu).trim())) {
          const au = abs(this.__nxu);
          const target = /^https?:\/\//i.test(au) ? au : deT(au);
          G.withSuccessHandler((r) => {
            try {
              Object.defineProperty(self, 'status', { value: (r && r.code) || 0, configurable: true });
              Object.defineProperty(self, 'responseText', { value: (r && r.body) || '', configurable: true });
              Object.defineProperty(self, 'response', { value: (r && r.body) || '', configurable: true });
              Object.defineProperty(self, 'readyState', { value: 4, configurable: true });
            } catch (e) {}
            if (typeof self.onreadystatechange === 'function') self.onreadystatechange();
            try { self.dispatchEvent(new Event('load')); } catch (e) {}
          }).withFailureHandler(() => { try { self.dispatchEvent(new Event('error')); } catch (e) {} })
            .api_fetch(target, { mode: 't' });
          return;
        }
      } catch (e) {}
      return OS.apply(this, arguments);
    };
  }
  try { Object.defineProperty(window, 'top', { get: () => window }); } catch (e) {}
}
const HOOK_SRC = '(' + NX_HOOK.toString() + ')();';

/* ══════════════ HTML REWRITER (client-side, full DOM) ══════════════ */
function cssRewrite(css, baseUrl) {
  return String(css || '').replace(/url\(\s*(['"]?)([^'")]+)\1\s*\)/gi, (w, q, u) => {
    u = (u || '').trim();
    if (!u || /^(data:|blob:|about:|#)/i.test(u)) return w;
    return 'url("' + tgoog(absUrl(u, baseUrl)) + '")';
  });
}
function absUrl(u, base) {
  u = String(u || '').trim().replace(/^["']|["']$/g, '');
  if (!u || SKIP_RE.test(u)) return '';
  if (/^https?:\/\//i.test(u)) return u;
  const m = String(base).match(/^(https?:)\/\/([^\/?#]+)([^?#]*)/i);
  if (!m) return '';
  const sch = m[1], origin = sch + '//' + m[2], path = m[3] || '/';
  if (/^\/\//.test(u)) return sch + u;
  if (u.charAt(0) === '?') return origin + path + u;
  if (u.charAt(0) === '/') return origin + u;
  const dir = path.substring(0, path.lastIndexOf('/') + 1);
  const segs = dir.split('/').filter((s, i) => s !== '' || i === 0);
  u.split('/').forEach((s) => {
    if (!s || s === '.') return;
    if (s === '..') { if (segs.length > 1) segs.pop(); } else segs.push(s);
  });
  return origin + segs.join('/');
}
function rewriteHtml(html, baseUrl) {
  let doc;
  try { doc = new DOMParser().parseFromString(html, 'text/html'); } catch (e) { return html; }
  if (!doc || !doc.documentElement) return html;
  doc.querySelectorAll('meta[http-equiv]').forEach((m) => {
    if ((m.getAttribute('http-equiv') || '').toLowerCase() === 'content-security-policy') m.remove();
  });
  doc.querySelectorAll('base').forEach((b) => b.remove());
  doc.querySelectorAll('[integrity]').forEach((e) => e.removeAttribute('integrity'));
  doc.querySelectorAll('[crossorigin]').forEach((e) => e.removeAttribute('crossorigin'));
  doc.querySelectorAll('[target]').forEach((e) => e.removeAttribute('target'));
  doc.querySelectorAll('a[href], area[href]').forEach((a) => {
    const abs = absUrl(a.getAttribute('href'), baseUrl);
    if (abs) { a.setAttribute('href', abs); a.setAttribute('data-nx1', abs); }
  });
  doc.querySelectorAll('form').forEach((f) => {
    const abs = absUrl(f.getAttribute('action') || baseUrl, baseUrl);
    if (abs) f.setAttribute('action', abs);
  });
  doc.querySelectorAll('meta[http-equiv="refresh" i]').forEach((m) => {
    const c = m.getAttribute('content') || '';
    const mm = c.match(/url=(.+)$/i);
    if (mm) {
      const abs = absUrl(mm[1].trim().replace(/^['"]|['"]$/g, ''), baseUrl);
      if (abs) m.setAttribute('content', c.replace(/url=.+$/i, 'url=' + abs));
    }
  });
  const subs = 'img,source,video,audio,track,embed,script';
  doc.querySelectorAll(subs + '[src]').forEach((e) => {
    const abs = absUrl(e.getAttribute('src'), baseUrl);
    if (abs) e.setAttribute('src', tgoog(abs));
  });
  doc.querySelectorAll('[poster]').forEach((e) => {
    const abs = absUrl(e.getAttribute('poster'), baseUrl);
    if (abs) e.setAttribute('poster', tgoog(abs));
  });
  doc.querySelectorAll('[data-src]').forEach((e) => {
    const abs = absUrl(e.getAttribute('data-src'), baseUrl);
    if (abs) e.setAttribute('data-src', tgoog(abs));
  });
  doc.querySelectorAll('link[href]').forEach((l) => {
    const rel = (l.getAttribute('rel') || '').toLowerCase();
    if (/stylesheet|icon|shortcut|preload|prefetch|apple-touch|manifest/.test(rel)) {
      const abs = absUrl(l.getAttribute('href'), baseUrl);
      if (abs) l.setAttribute('href', tgoog(abs));
    }
  });
  doc.querySelectorAll('iframe[src]').forEach((f) => {
    const abs = absUrl(f.getAttribute('src'), baseUrl);
    if (!abs) return;
    if (/youtube(-nocookie)?\.com\/embed|tiktok\.com\/embed/i.test(abs)) { f.setAttribute('src', abs); return; }
    f.setAttribute('src', (HAS_GAS && STATE.proxy) ? STATE.proxy + '?nx=' + encodeURIComponent(abs) : tgoog(abs));
  });
  doc.querySelectorAll('[srcset]').forEach((e) => {
    const out = (e.getAttribute('srcset') || '').split(',').map((p) => {
      const bits = p.trim().split(/\s+/);
      if (bits[0] && !SKIP_RE.test(bits[0])) bits[0] = tgoog(absUrl(bits[0], baseUrl));
      return bits.join(' ');
    });
    e.setAttribute('srcset', out.join(', '));
  });
  doc.querySelectorAll('style').forEach((s) => { s.textContent = cssRewrite(s.textContent, baseUrl); });
  doc.querySelectorAll('[style]').forEach((e) => { e.setAttribute('style', cssRewrite(e.getAttribute('style'), baseUrl)); });
  const head = doc.head || doc.documentElement;
  const base = doc.createElement('base');
  base.setAttribute('href', tgoog(baseUrl));
  head.insertBefore(base, head.firstChild);
  const hk = doc.createElement('script');
  hk.textContent = HOOK_SRC;
  head.insertBefore(hk, base.nextSibling);
  return '<!DOCTYPE html>' + doc.documentElement.outerHTML;
}

/* ══════════════ TABS ══════════════ */
function activeTab() { return STATE.tabs.find((t) => t.id === STATE.active) || null; }
function newTab() {
  const id = ++STATE.seq;
  const view = document.createElement('div');
  view.className = 'view';
  $('content').appendChild(view);
  const tab = { id, view, url: '', title: 'New tab', transport: 'idle', hist: [], hi: -1, token: 0, mode: '' };
  STATE.tabs.push(tab);
  activateTab(id);
  renderHome(tab);
  renderTabs();
  return tab;
}
function closeTab(id) {
  const i = STATE.tabs.findIndex((t) => t.id === id);
  if (i < 0) return;
  STATE.tabs[i].view.remove();
  STATE.tabs.splice(i, 1);
  if (!STATE.tabs.length) { newTab(); return; }
  if (STATE.active === id) activateTab(STATE.tabs[Math.max(0, i - 1)].id);
  renderTabs();
}
function activateTab(id) {
  STATE.active = id;
  STATE.tabs.forEach((t) => t.view.classList.toggle('on', t.id === id));
  renderTabs();
  updateOmni();
}
function renderTabs() {
  const wrap = $('tabs');
  wrap.innerHTML = '';
  STATE.tabs.forEach((t) => {
    const b = document.createElement('button');
    b.className = 'tab' + (t.id === STATE.active ? ' on' : '');
    const host = hostOf(t.url);
    b.innerHTML = (host ? favHtml(host) : '') + '<span class="tt">' + escapeHtml(t.title || 'New tab') + '</span>' +
      '<span class="x" title="Close (Ctrl+W)"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></span>';
    b.querySelector('.x').addEventListener('click', (e) => { e.stopPropagation(); closeTab(t.id); });
    b.addEventListener('click', () => activateTab(t.id));
    wrap.appendChild(b);
  });
}
function updateOmni() {
  const t = activeTab();
  $('url').value = t ? (t.url || '') : '';
  $('modechip').innerHTML = '<b>' + (t ? t.transport : 'idle') + '</b>';
  $('back').disabled = !(t && t.hi > 0);
  $('fwd').disabled = !(t && t.hi < t.hist.length - 1);
}
function escapeHtml(s) {
  return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function setTabMeta(tab, url) {
  tab.url = url;
  const host = hostOf(url);
  tab.title = host || prettyUrl(url) || 'New tab';
  renderTabs(); updateOmni();
}

/* ══════════════ VIEWS ══════════════ */
function mkFrame(tab) {
  const f = document.createElement('iframe');
  f.className = 'nx-frame';
  return f;
}
function loadHome(tab) { tab.view.innerHTML = ''; renderHome(tab); updateOmni(); }
function loadPlayerView(tab, url, kind, id) {
  tab.view.innerHTML = '';
  tab.transport = kind === 'yt' ? 'player' : 'clip';
  const wrap = document.createElement('div');
  wrap.className = 'embed-wrap';
  wrap.innerHTML = '<div class="embed-top"><span class="dot ok"></span><span class="t">' +
    (kind === 'yt' ? 'YouTube player' : 'TikTok player') + '</span><span class="u">' + escapeHtml(url) +
    '</span><span class="nx">NEXUS</span></div>';
  const f = document.createElement('iframe');
  f.allow = 'autoplay; encrypted-media; fullscreen; picture-in-picture';
  f.setAttribute('allowfullscreen', '');
  f.src = kind === 'yt'
    ? 'https://www.youtube-nocookie.com/embed/' + id + '?autoplay=1&rel=0&modestbranding=1&playsinline=1'
    : 'https://www.tiktok.com/embed/v2/' + id;
  wrap.appendChild(f);
  tab.view.appendChild(wrap);
  tab.url = url;
  tab.title = kind === 'yt' ? 'YouTube video' : 'TikTok video';
  renderTabs(); updateOmni();
}
function loadServerView(tab, url, m) {
  tab.view.innerHTML = '';
  tab.transport = 'iframe';
  const f = mkFrame(tab);
  f.src = STATE.proxy + (STATE.proxy.indexOf('?') > -1 ? '&' : '?') + 'nx=' + encodeURIComponent(url) + '&m=' + (m || 't');
  tab.view.appendChild(f);
  setTabMeta(tab, url);
}
function loadMirrorView(tab, url) {
  /* last-resort standalone fallback: load the google mirror directly in the frame (tag loads need no CORS) */
  tab.view.innerHTML = '';
  tab.transport = 'mirror-frame';
  const f = mkFrame(tab);
  f.src = tgoog(url);
  tab.view.appendChild(f);
  setTabMeta(tab, url);
}
function loadViewer(tab, res, url) {
  tab.view.innerHTML = '';
  tab.transport = 'view';
  const wrap = document.createElement('div');
  wrap.className = 'embed-wrap';
  wrap.innerHTML = '<div class="embed-top"><span class="dot"></span><span class="t">' + escapeHtml((res.ct || 'file').split(';')[0]) +
    '</span><span class="u">' + escapeHtml(url) + '</span><span class="nx">NEXUS</span></div>';
  const pre = document.createElement('pre');
  pre.style.cssText = 'flex:1;overflow:auto;margin:0;padding:16px;color:#9aa3b5;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;background:#000';
  pre.textContent = String(res.body || '').slice(0, 200000);
  wrap.appendChild(pre);
  tab.view.appendChild(wrap);
}
async function loadFetchView(tab, url, step) {
  loadbar(12);
  let res;
  if (step.t === 'gas') {
    res = await gasCall('api_fetch', url, { mode: step.m });
    if (res.error) throw new Error(res.error);
  } else {
    const r = await fetch(tgoog(url), { redirect: 'follow' });
    res = { code: r.status, ct: r.headers.get('content-type') || '', body: await r.text(), url };
    if (!r.ok && !/<html/i.test(res.body)) throw new Error('HTTP ' + r.status);
  }
  loadbar(55);
  const ct = (res.ct || '').toLowerCase();
  const looksHtml = /html|xhtml|xml|plain|\bjson\b/.test(ct) || /<html|<!doctype/i.test(res.body || '');
  if (!looksHtml) { loadViewer(tab, res, url); loadbar(100); setTimeout(() => loadbar(null), 300); return; }
  if (res.code >= 400 && !/<html|<!doctype/i.test(res.body || '')) throw new Error('HTTP ' + res.code);
  const html = rewriteHtml(res.body, url);
  tab.view.innerHTML = '';
  tab.transport = step.m === 'd' ? 'fetch' : 'mirror';
  const f = mkFrame(tab);
  f.setAttribute('sandbox', 'allow-scripts allow-forms allow-same-origin allow-popups allow-modals');
  tab.view.appendChild(f);
  await new Promise((done) => {
    let ok = false;
    f.addEventListener('load', () => { if (!ok) { ok = true; done(); } });
    setTimeout(() => { if (!ok) { ok = true; done(); } }, 12000);
    f.srcdoc = html;
  });
  try { const t = f.contentDocument && f.contentDocument.title; if (t) tab.title = t.slice(0, 40); } catch (e) {}
  loadbar(100);
  setTimeout(() => loadbar(null), 350);
  setTabMeta(tab, url);
}

/* ══════════════ NAVIGATION ENGINE ══════════════ */
function pushHist(tab, url) {
  tab.hist = tab.hist.slice(0, tab.hi + 1);
  tab.hist.push(url);
  tab.hi = tab.hist.length - 1;
  updateOmni();
}
function addRecent(url) {
  try {
    STATE.recents = JSON.parse(localStorage.getItem('nx_recents') || '[]');
  } catch (e) { STATE.recents = []; }
  STATE.recents = STATE.recents.filter((r) => r.u !== url);
  STATE.recents.unshift({ u: url, t: Date.now() });
  STATE.recents = STATE.recents.slice(0, 8);
  try { localStorage.setItem('nx_recents', JSON.stringify(STATE.recents)); } catch (e) {}
}
async function navigate(tab, input, opts) {
  opts = opts || {};
  tab = tab || activeTab();
  if (!tab) return;
  const url = resolveInput(input);
  if (!url) return;
  const token = (STATE.ntok = (STATE.ntok || 0) + 1);
  tab.token = token;

  const yt = url.match(YT_RE), tt = url.match(TT_RE);
  if (yt) { loadPlayerView(tab, url, 'yt', yt[1]); if (opts.push !== false) pushHist(tab, url); addRecent(url); return; }
  if (tt) { loadPlayerView(tab, url, 'tt', tt[1]); if (opts.push !== false) pushHist(tab, url); addRecent(url); return; }

  const mode = opts.mode || STATE.mode;
  let chain = [];
  if (mode === 'server') {
    if (HAS_GAS && STATE.proxy) chain = [{ t: 'server', m: 't' }];
    else { toast('Server iFrame mode needs the Apps Script deployment', 'err'); return; }
  } else if (mode === 'fetch') {
    chain = HAS_GAS ? [{ t: 'gas', m: 'd' }, { t: 'gas', m: 't' }] : [{ t: 'cors', m: 't' }, { t: 'mirror', m: 't' }];
  } else { // auto
    chain = HAS_GAS
      ? [{ t: 'gas', m: 'd' }, { t: 'gas', m: 't' }].concat(STATE.proxy ? [{ t: 'server', m: 't' }] : [])
      : [{ t: 'cors', m: 't' }, { t: 'mirror', m: 't' }];
  }
  let lastErr = null;
  for (const step of chain) {
    if (tab.token !== token) return; // superseded
    try {
      if (step.t === 'server') {
        loadServerView(tab, url, step.m);
        loadbar(100); setTimeout(() => loadbar(null), 400);
      } else if (step.t === 'mirror') {
        loadMirrorView(tab, url);
        loadbar(100); setTimeout(() => loadbar(null), 400);
      } else {
        await loadFetchView(tab, url, step);
      }
      if (opts.push !== false) pushHist(tab, url);
      addRecent(url);
      return;
    } catch (e) { lastErr = e; }
  }
  loadbar(null);
  tab.transport = 'error';
  updateOmni();
  toast('Could not load ' + prettyUrl(url) + ' — ' + ((lastErr && lastErr.message) || 'all relays failed'), 'err');
}
function goBack() { const t = activeTab(); if (t && t.hi > 0) { t.hi--; navigate(t, t.hist[t.hi], { push: false }); } }
function goFwd() { const t = activeTab(); if (t && t.hi < t.hist.length - 1) { t.hi++; navigate(t, t.hist[t.hi], { push: false }); } }
function reloadTab() {
  const t = activeTab();
  if (t && t.url) navigate(t, t.url, { push: false });
  else if (t) renderHome(t);
}

/* ══════════════ HOME PAGE ══════════════ */
function renderHome(tab) {
  tab.transport = 'home';
  const tiles = [
    ['YouTube', 'https://www.youtube.com/', 'videos + built-in player'],
    ['TikTok', 'https://www.tiktok.com/', 'feed + video player'],
    ['Duck.ai', 'https://duck.ai/', 'AI chat'],
    ['now.gg', 'https://now.gg/', 'cloud games'],
    ['Reddit', 'https://www.reddit.com/', 'forums'],
    ['Wikipedia', 'https://en.wikipedia.org/', 'reference'],
    ['Discord', 'https://discord.com/', 'chat'],
    ['Spotify', 'https://open.spotify.com/', 'music']
  ];
  const rec = STATE.recents.map((r) =>
    '<button class="recent" data-u="' + escapeHtml(r.u) + '">' + favHtml(hostOf(r.u)) + '<span>' + escapeHtml(prettyUrl(r.u)) + '</span></button>').join('');
  tab.view.innerHTML =
    '<div class="home"><div class="home-in">' +
    '<div class="biglogo"><svg viewBox="0 0 32 32"><defs><linearGradient id="nxg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#00e5a0"/></linearGradient></defs><path d="M7 26V6l18 20V6" fill="none" stroke="url(#nxg2)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>' +
    '<h1>NEX<i>US</i></h1><div class="tag">own relay · fetch rewrite · player routes — nothing else needed</div>' +
    '<div class="hsearch"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>' +
    '<input id="hsearch" placeholder="Search the web or type a URL…  (  yt query  =  YouTube search )" spellcheck="false"></div>' +
    '<div class="tiles">' + tiles.map((tl) =>
      '<button class="tile" data-u="' + tl[1] + '"><b>' + tl[0] + '</b>' + favHtml(hostOf(tl[1])) + '<span>' + tl[2] + '</span></button>').join('') + '</div>' +
    '<div class="tips"><b>How it works</b> — pages are fetched <b>server-side</b> by the Apps Script relay (no CORS), rewritten so every link, form and asset stays inside the proxy, then streamed into this tab. Videos on ' +
    '<b>YouTube</b> and <b>TikTok</b> open in built-in player routes. Commands: <kbd>yt</kbd> search · <kbd>!server url</kbd> force iFrame mode · <kbd>!fetch url</kbd> force rewrite mode. Shortcuts: <kbd>Ctrl</kbd>+<kbd>L</kbd> <kbd>T</kbd> <kbd>W</kbd> · <kbd>Alt</kbd>+<kbd>←→</kbd></div>' +
    (rec ? '<div class="recents">' + rec + '</div>' : '') +
    '</div></div>';
  const inp = tab.view.querySelector('#hsearch');
  inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') omniGo(inp.value); });
  tab.view.querySelectorAll('.tile').forEach((b) => b.addEventListener('click', () => navigate(tab, b.dataset.u)));
  tab.view.querySelectorAll('.recent').forEach((b) => b.addEventListener('click', () => navigate(tab, b.dataset.u)));
  updateOmni();
}

/* ══════════════ EVENTS ══════════════ */
window.addEventListener('message', (ev) => {
  const d = ev.data;
  if (!d || d.__nx !== 'nav' || !d.url) return;
  let tab = null;
  for (const t of STATE.tabs) {
    const f = t.view && t.view.querySelector('iframe');
    if (f && f.contentWindow === ev.source) { tab = t; break; }
  }
  if (!tab) tab = activeTab();
  if (tab) navigate(tab, d.url, { mode: d.via === 'server' ? 'server' : undefined });
});
 $('go').addEventListener('click', () => omniGo($('url').value));
 $('url').addEventListener('keydown', (e) => { if (e.key === 'Enter') omniGo(e.target.value); });
 $('back').addEventListener('click', goBack);
 $('fwd').addEventListener('click', goFwd);
 $('reload').addEventListener('click', reloadTab);
 $('newtab').addEventListener('click', () => newTab());
 $('btn-home').addEventListener('click', () => { const t = activeTab(); if (t) loadHome(t); });
 $('btn-new').addEventListener('click', () => newTab());
 $('mode').addEventListener('change', (e) => { STATE.mode = e.target.value; try { localStorage.setItem('nx_mode', STATE.mode); } catch (er) {} });
 $('lang').addEventListener('change', (e) => { STATE.lang = e.target.value; try { localStorage.setItem('nx_lang', STATE.lang); } catch (er) {} });
document.addEventListener('keydown', (e) => {
  if (e.ctrlKey && e.key.toLowerCase() === 'l') { e.preventDefault(); $('url').focus(); $('url').select(); }
  else if (e.ctrlKey && e.key.toLowerCase() === 't') { e.preventDefault(); newTab(); }
  else if (e.ctrlKey && e.key.toLowerCase() === 'w') { e.preventDefault(); if (STATE.active) closeTab(STATE.active); }
  else if (e.altKey && e.key === 'ArrowLeft') { e.preventDefault(); goBack(); }
  else if (e.altKey && e.key === 'ArrowRight') { e.preventDefault(); goFwd(); }
});
/* force-mode commands:  !server <url>  ·  !fetch <url>  ·  yt <query> */
function omniGo(raw) {
  raw = (raw || '').trim();
  if (!raw) return;
  let m;
  if ((m = raw.match(/^!server\s+(\S+)/i))) return navigate(activeTab(), m[1], { mode: 'server' });
  if ((m = raw.match(/^!fetch\s+(\S+)/i))) return navigate(activeTab(), m[1], { mode: 'fetch' });
  return navigate(activeTab(), raw);
}

/* ══════════════ BOOT ══════════════ */
(async function boot() {
  try { STATE.mode = localStorage.getItem('nx_mode') || 'auto'; } catch (e) {}
  try { STATE.lang = localStorage.getItem('nx_lang') || 'es'; } catch (e) {}
  $('mode').value = STATE.mode; $('lang').value = STATE.lang;
  $('pins').innerHTML = PINS.map((p) =>
    '<button class="pin" data-u="' + p[1] + '">' + favHtml(hostOf(p[1])) + '<span>' + p[0] + '</span></button>').join('');
  document.querySelectorAll('#pins .pin').forEach((b) => b.addEventListener('click', () => navigate(activeTab(), b.dataset.u)));
  if (HAS_GAS) {
    try {
      const cfg = await gasCall('api_config');
      STATE.proxy = (cfg && cfg.proxy) || '';
      badge(STATE.proxy ? 'GAS proxy online' : 'GAS bridge ok (no url)', 'ok');
    } catch (e) { badge('GAS bridge error', 'err'); }
  } else {
    badge('standalone · mirror relay', 'warn');
  }
  newTab();
})();
</script>
