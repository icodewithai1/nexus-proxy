<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>libcurl.js Proxy</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f0f0f; color: #e8eaed; overflow: hidden; }
  body { display: flex; flex-direction: column; }
  .toolbar { display: flex; align-items: center; gap: 6px;
    padding: 8px 10px; background: #202124;
    border-bottom: 1px solid #35363a; flex-shrink: 0; }
  .toolbar button { background: #35363a; color: #e8eaed;
    border: 1px solid #484b4f; border-radius: 6px;
    padding: 7px 12px; font-size: 14px; cursor: pointer;
    font-weight: 500; flex-shrink: 0; }
  .toolbar button:hover:not(:disabled) { background: #484b4f; }
  .toolbar button:disabled { opacity: 0.4; cursor: not-allowed; }
  .toolbar button.go { background: #8ab4f8; color: #202124;
    border-color: #8ab4f8; font-weight: 600; }
  .toolbar button.go:hover:not(:disabled) { background: #aecbfa; }
  .toolbar input { flex: 1; min-width: 0; background: #2d2e31;
    border: 1px solid #3c4043; border-radius: 20px;
    padding: 8px 16px; color: #e8eaed; font-size: 14px; outline: none; }
  .toolbar input:focus { border-color: #8ab4f8; background: #303134; }
  #statusBar { padding: 5px 14px; font-size: 12px;
    background: #202124; color: #9aa0a6;
    border-bottom: 1px solid #35363a; flex-shrink: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    font-family: ui-monospace, Menlo, monospace; }
  #statusBar.ok { color: #81c995; } #statusBar.err { color: #f28b82; }
  #statusBar.warn { color: #fdd663; } #statusBar.info { color: #8ab4f8; }
  #pageFrame { flex: 1; border: 0; width: 100%; background: #fff; display: block; }
  #overlay { position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(32,33,36,0.94); color: #e8eaed;
    padding: 18px 28px; border-radius: 12px; font-size: 14px;
    pointer-events: none; opacity: 0; transition: opacity 0.2s;
    border: 1px solid #3c4043; z-index: 9999; }
  #overlay.visible { opacity: 1; }

</head>
<body>

  <div class="toolbar">
    <button id="backBtn" title="Back" disabled>←</button>
    <button id="reloadBtn" title="Reload" disabled>⟳</button>
    <input id="urlInput" type="text" placeholder="Enter URL" autocomplete="off" spellcheck="false" value="https://www.youtube.com/shorts">
    <button id="goBtn" class="go" disabled>Go</button>
  </div>

  <div id="statusBar" class="info">Initializing libcurl.js…</div>

  <iframe
    id="pageFrame"
    sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-modals allow-downloads allow-pointer-lock allow-presentation allow-orientation-lock allow-top-navigation-by-user-activation"
    referrerpolicy="unsafe-url"
    allow="autoplay; encrypted-media; fullscreen; picture-in-picture; clipboard-read; clipboard-write"
  ></iframe>

  <div id="overlay">Loading…</div>

  <script src="https://cdn.jsdelivr.net/npm/libcurl.js@latest/libcurl_full.js"></script>

  <script>
  /* ============================================================================
   *  PARENT — proxy shell
   * ==========================================================================*/
  const WISP_SERVER = 'wss://wisp.mercurywork.shop/';
  const UA = navigator.userAgent;

  const urlInput  = document.getElementById('urlInput');
  const goBtn     = document.getElementById('goBtn');
  const backBtn   = document.getElementById('backBtn');
  const reloadBtn = document.getElementById('reloadBtn');
  const statusBar = document.getElementById('statusBar');
  const pageFrame = document.getElementById('pageFrame');
  const overlay   = document.getElementById('overlay');

  let currentUrl   = '';
  let currentOpts  = null;
  const history    = [];
  let historyIdx   = -1;

    if (!setCookie) return;

      const parts = sc.split(';');
      const eq = parts[0].indexOf('=');

      const value = parts[0].slice(eq + 1);

        const kv = p.trim();

  const DROP_REQ_HEADERS = ['origin','host','connection','content-length','referer','accept-encoding','transfer-encoding','upgrade','via','te','trailer','expect'];

    m = String(m == null ? '' : m).toUpperCase().trim();

  }

    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

  /* ---------- libcurl bootstrap ---------- */
  function waitForLibcurl() {
    return new Promise((resolve, reject) => {
      if (typeof libcurl !== 'undefined') return resolve();

    libcurl.set_websocket(WISP_SERVER);
    libcurlReady = true;

    setStatus('Ready — enter a URL.', 'ok');

  /* ==========================================================================
   *  __proxyFetch — parent side of the bridge
   *  KEY CHANGES FOR MEDIA:

    if (cookies && !hasHeader(headers, 'cookie')) headers['Cookie'] = cookies;

    const method  = sanitizeMethod(opts.method, hasBody);

      const res = await libcurl.fetch(url, init);

      let sc = null;
      if (res.headers) {
        if (typeof res.headers.get === 'function') sc = res.headers.get('set-cookie');
        if (!sc && typeof res.headers.forEach === 'function') {
          const list = [];
          res.headers.forEach((v, k) => { if (k.toLowerCase() === 'set-cookie') list.push(v); });

      if (res.headers && typeof res.headers.forEach === 'function') {
        res.headers.forEach((v, k) => {

        statusText: 'Proxy error',

    document.addEventListener('click', function (e) {
      if (e.defaultPrevented || e.button !== 0) return;
      if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      var el = e.target;
      while (el && el !== document && (el.tagName || '').toUpperCase() !== 'A') el = el.parentNode;
      if (!el || el === document) return;
      var href = el.getAttribute('href');
      if (!href) return;
      if (/^(javascript:|mailto:|tel:|data:|blob:|#)/i.test(href)) return;
      if (el.target && el.target !== '_self' && el.target !== '') return;
      e.preventDefault();
      if (window.parent && window.parent.__proxyNavigate) window.parent.__proxyNavigate(abs(href));
    }, true);

    /* ---------------- Form submit interception ---------------- */
    function handleFormSubmit(form) {
      try {
        var method = String(form.getAttribute('method') || 'GET').toUpperCase() === 'POST' ? 'POST' : 'GET';
        var action;
        try { action = new URL(form.getAttribute('action') || document.baseURI, document.baseURI).href; }
        catch (e) { action = document.baseURI; }
        var fd = new FormData(form);
        if (method === 'GET') {
          var u = new URL(action);
          fd.forEach((v, k) => u.searchParams.append(k, v));
          if (window.parent && window.parent.__proxyNavigate) window.parent.__proxyNavigate(u.href);
        } else {
          if (window.parent && window.parent.__proxyNavigate) window.parent.__proxyNavigate(action, { method: 'POST', body: fd });
        }
      } catch (e) { console.warn('[form]', e); }
    }
    document.addEventListener('submit', function (e) {
      var form = e.target;
      if (!form || (form.tagName || '').toUpperCase() !== 'FORM') return;
      e.preventDefault(); e.stopPropagation();
      handleFormSubmit(form);
    }, true);
    try {
      var fp = HTMLFormElement.prototype;
      fp.submit = function () { handleFormSubmit(this); };
      if (fp.requestSubmit) {
        fp.requestSubmit = function () {
          try {
            var evt = new Event('submit', { bubbles: true, cancelable: true });
            this.dispatchEvent(evt);
            if (!evt.defaultPrevented) handleFormSubmit(this);
          } catch (e) { handleFormSubmit(this); }
        };
      }
    } catch (e) {}

    /* ---------------- Location + history ---------------- */
    try {
      var lp = Location.prototype, oA = lp.assign, oR = lp.replace;
      lp.assign = function (u) {
        if (window.parent && window.parent.__proxyNavigate) window.parent.__proxyNavigate(abs(u));
        else oA.call(location, u);
      };
      lp.replace = function (u) {
        if (window.parent && window.parent.__proxyNavigate) window.parent.__proxyNavigate(abs(u));
        else oR.call(location, u);
      };
    } catch (e) {}
    try {
      history.pushState = function (s, t, u) {
        if (u && window.parent && window.parent.__proxyUrlChanged)
          try { window.parent.__proxyUrlChanged(abs(u)); } catch (e) {}
      };
      history.replaceState = function (s, t, u) {
        if (u && window.parent && window.parent.__proxyUrlChanged)
          try { window.parent.__proxyUrlChanged(abs(u)); } catch (e) {}
      };
    } catch (e) {}

    /* ---------------- sendBeacon ---------------- */
    try {
      if (navigator.sendBeacon) {
        navigator.sendBeacon = function (url, data) {
          try { window.fetch(abs(url), { method: 'POST', body: data, keepalive: true }).catch(() => {}); return true; }
          catch (e) { return false; }
        };
      }
    } catch (e) {}

    /* ---------------- Swallow network-related rejections ---------------- */
    window.addEventListener('unhandledrejection', function (ev) {
      var m = ev && ev.reason && (ev.reason.message || String(ev.reason));
      if (m && /fetch|xhr|network|proxy|serviceworker|worker/i.test(m)) ev.preventDefault();
    });

    console.log('[proxy-runtime] installed');
  }

  /* ==========================================================================
   *  patchHTML
   * ========================================================================*/
  function patchHTML(html, pageUrl) {
    const doc = new DOMParser().parseFromString(html, 'text/html');

    doc.querySelectorAll('meta[http-equiv]').forEach(m => {
      const eq = (m.getAttribute('http-equiv') || '').toLowerCase();
      if (eq === 'content-security-policy' || eq === 'content-security-policy-report-only' ||
          eq === 'x-frame-options' || eq === 'refresh') m.remove();
    });

    doc.querySelectorAll('[integrity]').forEach(el => el.removeAttribute('integrity'));
    doc.querySelectorAll('[crossorigin]').forEach(el => el.removeAttribute('crossorigin'));
    doc.querySelectorAll('script[referrerpolicy]').forEach(el => el.removeAttribute('referrerpolicy'));
    doc.querySelectorAll('link[referrerpolicy]').forEach(el => el.removeAttribute('referrerpolicy'));
    doc.querySelectorAll('iframe[referrerpolicy]').forEach(el => el.removeAttribute('referrerpolicy'));

    if (doc.head) {
      let rm = doc.head.querySelector('meta[name="referrer"]');
      if (!rm) { rm = doc.createElement('meta'); doc.head.insertBefore(rm, doc.head.firstChild); }
      rm.setAttribute('name', 'referrer');
      rm.setAttribute('content', 'unsafe-url');
    }
    if (doc.head && !doc.querySelector('meta[charset]')) {
      const m = doc.createElement('meta'); m.setAttribute('charset', 'utf-8');
      doc.head.insertBefore(m, doc.head.firstChild);
    }

    const head = doc.head || doc.documentElement;

    let base = doc.querySelector('base');
    if (base) {
      base.setAttribute('href', pageUrl);
      base.setAttribute('target', '_self');
    } else {
      base = doc.createElement('base');
      base.setAttribute('href', pageUrl);
      base.setAttribute('target', '_self');
      head.insertBefore(base, head.firstChild);
    }

    const rt = doc.createElement('script');
    rt.textContent = '(' + pageRuntime.toString() + ')();';
    head.insertBefore(rt, head.firstChild);

    return '<!DOCTYPE html>\n' + doc.documentElement.outerHTML;
  }

  /* ==========================================================================
   *  renderInIframe
   * ========================================================================*/
  let renderSeq = 0;
  function renderInIframe(patchedHtml, onDone) {
    const seq = ++renderSeq;
    pageFrame.srcdoc = '<!DOCTYPE html><html><head><meta charset="utf-8"></head><body></body></html>';
    requestAnimationFrame(() => {
      if (seq !== renderSeq) return;
      let doc;
      try { doc = pageFrame.contentDocument; } catch (e) { doc = null; }
      if (!doc) { pageFrame.srcdoc = patchedHtml; if (onDone) onDone(); return; }
      try {
        doc.open();
        doc.write(patchedHtml);
        doc.close();
      } catch (e) {
        console.warn('[render] falling back to srcdoc', e);
        pageFrame.srcdoc = patchedHtml;
      }
      if (onDone) {
        const w = pageFrame.contentWindow;
        if (w) {
          try {
            w.addEventListener('load', function once() {
              w.removeEventListener('load', once);
              onDone();
            });
            setTimeout(onDone, 5000);
          } catch (e) { setTimeout(onDone, 500); }
        } else setTimeout(onDone, 500);
      }
    });
  }

  /* ==========================================================================
   *  loadUrl
   * ========================================================================*/
  async function loadUrl(rawUrl, options) {
    options = options || {};
    if (!libcurlReady) { setStatus('libcurl.js not ready.', 'warn'); return; }

    let url = (rawUrl || '').trim();
    if (!url) return;
    if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
    try { new URL(url); } catch (e) { setStatus('Invalid URL: ' + rawUrl, 'err'); return; }

    goBtn.disabled = true; reloadBtn.disabled = true;
    showOverlay('Loading ' + url + '…');
    setStatus('Fetching ' + url + ' …', 'info');
    urlInput.value = url;

    try {
      let body = options.body;
      const hasBody = body != null;
      const method = sanitizeMethod(options.method, hasBody);

      const init = {
        method,
        headers: {
          'User-Agent': UA,
          'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
          'Accept-Language': 'en-US,en;q=0.9'
        }
      };
      const cookies = getCookiesFor(url);
      if (cookies) init.headers['Cookie'] = cookies;
      if (hasBody && method !== 'GET' && method !== 'HEAD') {
        if (typeof FormData !== 'undefined' && body instanceof FormData) {
          const p = new URLSearchParams();
          body.forEach((v, k) => p.append(k, v));
          init.body = p.toString();
          init.headers['Content-Type'] = 'application/x-www-form-urlencoded';
        } else init.body = body;
      }

      const res = await libcurl.fetch(url, init);
      let sc = null;
      if (res.headers) {
        if (typeof res.headers.get === 'function') sc = res.headers.get('set-cookie');
        if (sc) storeCookies(url, sc);
      }

      const ct = (res.headers.get('content-type') || '').toLowerCase();
      if (ct && !ct.includes('text/html') && !ct.includes('application/xhtml')) {
        const text = await res.text();
        pageFrame.srcdoc =
          '<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{font-family:monospace;padding:16px;white-space:pre-wrap;word-break:break-all;background:#fff;color:#111;}</style></head><body>' +
          escapeHtml(text) + '</body></html>';
        setStatus('Loaded non-HTML (' + ct + ') — ' + res.status, 'warn');
        hideOverlay(); goBtn.disabled = false; reloadBtn.disabled = false;
        return;
      }

      const charsetM = (res.headers.get('content-type') || '').match(/charset=([^;]+)/i);
      const charset = charsetM ? charsetM[1].trim().toLowerCase() : 'utf-8';
      const buf = await res.arrayBuffer();
      let html;
      try { html = new TextDecoder(charset).decode(buf); }
      catch { html = new TextDecoder('utf-8').decode(buf); }

      const patched = patchHTML(html, url);

      currentUrl = url; currentOpts = options;
      if (options.pushHistory) {
        history.splice(historyIdx + 1);
        history.push({ url, opts: { method: options.method, body: options.body } });
        historyIdx = history.length - 1;
      }

      setStatus('✓ ' + res.status + '  ' + url + '  — rendering…', 'ok');
      renderInIframe(patched, () => {
        setStatus('✓ ' + res.status + '  ' + url, 'ok');
        hideOverlay(); goBtn.disabled = false; reloadBtn.disabled = false;
        backBtn.disabled = historyIdx <= 0;
      });
    } catch (err) {
      console.error('[loadUrl]', err);
      setStatus('❌ ' + (err && err.message || err), 'err');
      hideOverlay(); goBtn.disabled = false; reloadBtn.disabled = false;
    }
  }

  goBtn.addEventListener('click', () => loadUrl(urlInput.value, { pushHistory: true }));
  urlInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); loadUrl(urlInput.value, { pushHistory: true }); }
  });
  backBtn.addEventListener('click', () => {
    if (historyIdx <= 0) return;
    historyIdx--;
    const e = history[historyIdx];
    loadUrl(e.url, Object.assign({}, e.opts, { pushHistory: false }));
    backBtn.disabled = historyIdx <= 0;
  });
  reloadBtn.addEventListener('click', () => {
    if (!currentUrl) return;
    loadUrl(currentUrl, Object.assign({}, currentOpts || {}, { pushHistory: false }));
  });

  window.addEventListener('beforeunload', () => { pageFrame.srcdoc = ''; });
  </script>
</body>
</html>
