<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus</title>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- libcurl.js -->
  <script src="https://cdn.jsdelivr.net/npm/libcurl.js@latest/libcurl_full.js" defer></script>
  <!-- LuminSDK (games) -->
  <script src="https://cdn.jsdelivr.net/gh/luminsdk/script@latest/lumin.min.js" defer></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #0a0a0a;
      color: #e0e0e0;
      min-height: 100vh;
      overflow: hidden;
    }

    /* ---------- CLOAK / ERROR PAGE ---------- */
    #cloak {
      position: fixed;
      inset: 0;
      background: #fff;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Roboto, sans-serif;
      color: #333;
      text-align: center;
      padding: 20px;
    }
    #cloak h1 { font-size: 72px; font-weight: 300; margin-bottom: 16px; }
    #cloak p { font-size: 18px; color: #555; max-width: 500px; }
    #cloak .hint {
      position: fixed;
      bottom: 20px;
      right: 20px;
      font-size: 12px;
      color: #aaa;
      opacity: 0.3;
    }

    /* ---------- MAIN APP ---------- */
    #app {
      display: none;
      flex-direction: column;
      height: 100vh;
      position: relative;
    }
    #app.active { display: flex; }

    /* Top Bar */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px 24px;
      gap: 24px;
      background: #0a0a0a;
      border-bottom: 1px solid #1a1a1a;
    }
    .topbar .nav-icons {
      display: flex;
      gap: 16px;
      align-items: center;
    }
    .topbar .nav-icons button {
      background: none;
      border: none;
      color: #aaa;
      cursor: pointer;
      padding: 8px;
      border-radius: 8px;
      transition: 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .topbar .nav-icons button:hover { background: #1a1a1a; color: #fff; }
    .topbar .nav-icons button.active { color: #fff; background: #1a1a1a; }
    .topbar .logo {
      position: absolute;
      left: 24px;
      font-weight: 700;
      font-size: 18px;
      color: #7c3aed;
      letter-spacing: -0.5px;
    }

    /* Main content */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      gap: 32px;
      overflow-y: auto;
    }

    /* App Grid */
    .app-grid {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .app-icon {
      width: 72px;
      height: 72px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      position: relative;
      overflow: hidden;
    }
    .app-icon:hover { transform: scale(1.08); box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
    .app-icon img, .app-icon svg { width: 40px; height: 40px; }
    .app-icon .label {
      position: absolute;
      bottom: 4px;
      font-size: 8px;
      color: rgba(255,255,255,0.7);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Search */
    .search-box {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #141414;
      border: 1px solid #262626;
      border-radius: 12px;
      padding: 14px 20px;
      width: 100%;
      max-width: 560px;
    }
    .search-box input {
      background: none;
      border: none;
      outline: none;
      color: #e0e0e0;
      font-size: 16px;
      flex: 1;
    }
    .search-box input::placeholder { color: #555; }
    .search-box i, .search-box svg { color: #555; flex-shrink: 0; }

    /* Proxy view */
    #proxy-view {
      flex: 1;
      display: none;
      flex-direction: column;
    }
    #proxy-view.active { display: flex; }
    #proxy-frame {
      flex: 1;
      border: none;
      width: 100%;
      background: #fff;
    }
    .proxy-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: #141414;
      border-bottom: 1px solid #262626;
    }
    .proxy-bar button {
      background: none;
      border: none;
      color: #aaa;
      cursor: pointer;
      padding: 6px;
      border-radius: 6px;
    }
    .proxy-bar button:hover { background: #262626; color: #fff; }
    .proxy-bar .url-display {
      flex: 1;
      font-size: 13px;
      color: #888;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Games tab */
    #games-view {
      flex: 1;
      display: none;
      flex-direction: column;
      padding: 24px;
      gap: 16px;
      overflow-y: auto;
    }
    #games-view.active { display: flex; }
    #games-container { width: 100%; }
    .games-search {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #141414;
      border: 1px solid #262626;
      border-radius: 10px;
      padding: 12px 16px;
      max-width: 480px;
    }
    .games-search input {
      background: none; border: none; outline: none;
      color: #e0e0e0; font-size: 14px; flex: 1;
    }

    /* Loading */
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid #262626;
      border-top-color: #7c3aed;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-overlay {
      position: absolute; inset: 0;
      background: rgba(10,10,10,0.9);
      display: flex; align-items: center; justify-content: center;
      z-index: 100; flex-direction: column; gap: 12px;
    }
    .loading-overlay.hidden { display: none; }
  </style>
</head>
<body>

<!-- ============ CLOAKED ERROR PAGE ============ -->
<div id="cloak">
  <h1>This site can’t be reached</h1>
  <p>The connection was reset. Please check your internet connection and try again.</p>
  <div class="hint">~</div>
</div>

<!-- ============ MAIN APP ============ -->
<div id="app">
  <!-- Top Bar -->
  <div class="topbar">
    <div class="logo">NEXUS</div>
    <div class="nav-icons">
      <button id="nav-home" class="active" data-tab="home">
        <i data-lucide="home" width="20" height="20"></i>
      </button>
      <button id="nav-games" data-tab="games">
        <i data-lucide="gamepad-2" width="20" height="20"></i>
      </button>
      <button id="nav-proxy" data-tab="proxy">
        <i data-lucide="globe" width="20" height="20"></i>
      </button>
      <button id="nav-settings">
        <i data-lucide="settings" width="20" height="20"></i>
      </button>
    </div>
  </div>

  <!-- Home View -->
  <div id="home-view" class="main-content active">
    <div class="app-grid">
      <div class="app-icon" style="background:linear-gradient(135deg,#833ab4,#fd1d1d,#fcb045);" data-url="https://instagram.com">
        <img src="https://cdn.jsdelivr.net/npm/simple-icons@v9/icons/instagram.svg" alt="Instagram" style="filter:brightness(0) invert(1);width:36px;">
      </div>
      <div class="app-icon" style="background:#1a1a2e;" data-url="https://youtube.com">
        <img src="https://cdn.jsdelivr.net/npm/simple-icons@v9/icons/youtube.svg" alt="YouTube" style="filter:brightness(0) invert(1);width:36px;">
      </div>
      <div class="app-icon" style="background:#000;" data-url="https://tiktok.com">
        <img src="https://cdn.jsdelivr.net/npm/simple-icons@v9/icons/tiktok.svg" alt="TikTok" style="filter:brightness(0) invert(1);width:36px;">
      </div>
      <div class="app-icon" style="background:#5865F2;" data-url="https://discord.com">
        <img src="https://cdn.jsdelivr.net/npm/simple-icons@v9/icons/discord.svg" alt="Discord" style="filter:brightness(0) invert(1);width:36px;">
      </div>
      <div class="app-icon" style="background:#7c3aed;" data-url="https://now.gg">
        <img src="https://cdn.jsdelivr.net/npm/simple-icons@v9/icons/nowdotgg.svg" alt="now.gg" style="filter:brightness(0) invert(1);width:36px;">
      </div>
      <div class="app-icon" style="background:#1a1a2e;" data-url="https://duck.ai">
        <img src="https://cdn.jsdelivr.net/npm/simple-icons@v9/icons/duckduckgo.svg" alt="Duck.ai" style="filter:brightness(0) invert(1);width:36px;">
      </div>
    </div>

    <div class="search-box">
      <i data-lucide="search" width="20" height="20"></i>
      <input type="text" id="search-input" placeholder="Search the web or enter URL...">
    </div>
  </div>

  <!-- Games View -->
  <div id="games-view">
    <div class="games-search">
      <i data-lucide="search" width="18" height="18"></i>
      <input type="text" id="games-search-input" placeholder="Search games...">
    </div>
    <div id="games-container"></div>
  </div>

  <!-- Proxy View -->
  <div id="proxy-view">
    <div class="proxy-bar">
      <button id="proxy-back"><i data-lucide="arrow-left" width="18" height="18"></i></button>
      <button id="proxy-reload"><i data-lucide="refresh-cw" width="18" height="18"></i></button>
      <span class="url-display" id="proxy-url">about:blank</span>
      <button id="proxy-close"><i data-lucide="x" width="18" height="18"></i></button>
    </div>
    <iframe id="proxy-frame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals"></iframe>
  </div>

  <!-- Loading overlay -->
  <div id="loading-overlay" class="loading-overlay hidden">
    <div class="spinner"></div>
    <span style="font-size:13px;color:#888;">Loading via Nexus proxy...</span>
  </div>
</div>

<script>
/* ============================================================
   NEXUS PROXY ENGINE
   Uses libcurl.js + WISP relays to fetch and patch pages.
   ============================================================ */

const RELAYS = [
  'wss://wisp.mercurywork.shop/',
  'wss://nebulaproxy.io/wisp/',
  'wss://relay.wisp.talk/',
  'wss://relay.damus.io/',
  'wss://nos.lol/'
];

let currentRelayIndex = 0;

/* ---------- CLOAK LOGIC ---------- */
const cloak = document.getElementById('cloak');
const app = document.getElementById('app');

function showCloak() {
  cloak.style.display = 'flex';
  app.classList.remove('active');
}
function hideCloak() {
  cloak.style.display = 'none';
  app.classList.add('active');
}

// Press ~ to bypass
document.addEventListener('keydown', (e) => {
  if (e.key === '~' || e.key === '`') {
    hideCloak();
  }
});

// Show cloak on load
showCloak();

// Re-show cloak when tab visibility changes (basic "switch tab" cloak)
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    // Optionally show cloak when user switches away
    // showCloak();
  }
});

/* ---------- NAVIGATION ---------- */
const navHome = document.getElementById('nav-home');
const navGames = document.getElementById('nav-games');
const navProxy = document.getElementById('nav-proxy');
const homeView = document.getElementById('home-view');
const gamesView = document.getElementById('games-view');
const proxyView = document.getElementById('proxy-view');

function switchTab(tab) {
  [navHome, navGames, navProxy].forEach(b => b.classList.remove('active'));
  [homeView, gamesView, proxyView].forEach(v => v.classList.remove('active'));
  if (tab === 'home') { navHome.classList.add('active'); homeView.classList.add('active'); }
  if (tab === 'games') { navGames.classList.add('active'); gamesView.classList.add('active'); }
  if (tab === 'proxy') { navProxy.classList.add('active'); proxyView.classList.add('active'); }
}

navHome.addEventListener('click', () => switchTab('home'));
navGames.addEventListener('click', () => switchTab('games'));
navProxy.addEventListener('click', () => switchTab('proxy'));

/* ---------- PROXY CORE ---------- */
const proxyFrame = document.getElementById('proxy-frame');
const proxyUrl = document.getElementById('proxy-url');
const loadingOverlay = document.getElementById('loading-overlay');

async function initLibcurl() {
  if (typeof libcurl === 'undefined') {
    console.warn('libcurl.js not loaded yet');
    return false;
  }
  // Set WebSocket relay
  libcurl.set_websocket(RELAYS[currentRelayIndex]);
  return true;
}

async function proxyFetch(url) {
  // Try each relay until one works
  for (let i = 0; i < RELAYS.length; i++) {
    const relay = RELAYS[(currentRelayIndex + i) % RELAYS.length];
    try {
      libcurl.set_websocket(relay);
      const response = await libcurl.fetch(url, {
        headers: {
          'User-Agent': navigator.userAgent,
          'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8'
        }
      });
      if (response.ok) {
        currentRelayIndex = (currentRelayIndex + i) % RELAYS.length;
        return response;
      }
    } catch (e) {
      console.warn('Relay failed:', relay, e.message);
    }
  }
  throw new Error('All relays failed');
}

function patchHTML(html, baseUrl) {
  const urlObj = new URL(baseUrl);
  const origin = urlObj.origin;

  // 1. Inject <base> so relative URLs resolve correctly
  if (!html.includes('<base')) {
    html = html.replace(/<head([^>]*)>/i, `<head$1><base href="${baseUrl}">`);
  }

  // 2. Rewrite absolute URLs that point to the same origin to go through proxy
  //    (Simplified — for a real proxy you'd need a dedicated proxy path)
  //    We use a blob/data approach for simplicity: rewrite src/href to absolute URLs
  html = html.replace(/(src|href)=["'](?!https?:\/\/|data:|blob:|#|\/\/)([^"']+)["']/gi,
    (match, attr, path) => {
      try {
        const abs = new URL(path, baseUrl).href;
        return `${attr}="${abs}"`;
      } catch { return match; }
    });

  // 3. Inject runtime patch script inside the iframe
  const patchScript = `
    <script>
    (function() {
      // Intercept fetch
      const origFetch = window.fetch;
      window.fetch = function(input, init) {
        if (typeof input === 'string' && input.startsWith('/')) {
          input = '${origin}' + input;
        }
        return origFetch.call(this, input, init);
      };
      // Intercept XHR
      const origOpen = XMLHttpRequest.prototype.open;
      XMLHttpRequest.prototype.open = function(method, url, ...rest) {
        if (url.startsWith('/')) url = '${origin}' + url;
        return origOpen.call(this, method, url, ...rest);
      };
      // Notify parent of navigation
      document.addEventListener('click', (e) => {
        const a = e.target.closest('a');
        if (a && a.href && a.target !== '_blank') {
          e.preventDefault();
          window.parent.postMessage({ type: 'navigate', url: a.href }, '*');
        }
      });
    })();
    <\/script>`;
  html = html.replace('</body>', patchScript + '</body>');

  return html;
}

async function navigateTo(url) {
  try {
    switchTab('proxy');
    proxyUrl.textContent = url;
    loadingOverlay.classList.remove('hidden');

    // Ensure libcurl is ready
    const ready = await initLibcurl();
    if (!ready) throw new Error('libcurl not available');

    const response = await proxyFetch(url);
    let html = await response.text();

    // Patch the HTML
    html = patchHTML(html, url);

    // Write to iframe via srcdoc
    proxyFrame.srcdoc = html;

    loadingOverlay.classList.add('hidden');
  } catch (err) {
    console.error('Proxy error:', err);
    proxyUrl.textContent = 'Error: ' + err.message;
    loadingOverlay.classList.add('hidden');
  }
}

/* ---------- APP ICON CLICKS ---------- */
document.querySelectorAll('.app-icon').forEach(icon => {
  icon.addEventListener('click', () => {
    const url = icon.dataset.url;
    if (url) navigateTo(url);
  });
});

/* ---------- SEARCH ---------- */
document.getElementById('search-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    let val = e.target.value.trim();
    if (!val) return;
    if (!val.startsWith('http://') && !val.startsWith('https://')) {
      // Treat as search query
      val = 'https://duckduckgo.com/?q=' + encodeURIComponent(val);
    }
    navigateTo(val);
  }
});

/* ---------- PROXY BAR ---------- */
document.getElementById('proxy-back').addEventListener('click', () => {
  // Simple back: go home
  switchTab('home');
});
document.getElementById('proxy-reload').addEventListener('click', () => {
  const url = proxyUrl.textContent;
  if (url && url !== 'about:blank' && !url.startsWith('Error')) {
    navigateTo(url);
  }
});
document.getElementById('proxy-close').addEventListener('click', () => {
  switchTab('home');
});

/* ---------- MESSAGE FROM IFRAME (navigation) ---------- */
window.addEventListener('message', (e) => {
  if (e.data && e.data.type === 'navigate') {
    navigateTo(e.data.url);
  }
});

/* ============================================================
   GAMES TAB — LuminSDK + IndexedDB
   ============================================================ */
const gamesContainer = document.getElementById('games-container');
const gamesSearchInput = document.getElementById('games-search-input');

let luminReady = false;

function initLumin() {
  if (typeof Lumin === 'undefined') {
    console.warn('LuminSDK not loaded');
    return;
  }
  Lumin.init({
    container: '#games-container',
    theme: 'dark',
    onReady: () => {
      luminReady = true;
      console.log('LuminSDK ready');
    },
    onError: (err) => {
      console.error('LuminSDK error:', err);
    }
  });
}

// Search games via Lumin SDK (if it exposes a search method)
gamesSearchInput.addEventListener('input', (e) => {
  const query = e.target.value.trim();
  if (typeof Lumin !== 'undefined' && Lumin.search) {
    Lumin.search(query);
  }
});

/* ---------- INDEXEDDB STORAGE ---------- */
const DB_NAME = 'nexus-games';
const DB_VERSION = 1;
const STORE_NAME = 'gameData';

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        db.createObjectStore(STORE_NAME, { keyPath: 'id' });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function storeGameData(games) {
  const db = await openDB();
  const tx = db.transaction(STORE_NAME, 'readwrite');
  const store = tx.objectStore(STORE_NAME);
  games.forEach(g => store.put(g));
  return new Promise((resolve, reject) => {
    tx.oncomplete = resolve;
    tx.onerror = reject;
  });
}

async function getGameData() {
  const db = await openDB();
  const tx = db.transaction(STORE_NAME, 'readonly');
  const store = tx.objectStore(STORE_NAME);
  return new Promise((resolve, reject) => {
    const req = store.getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = reject;
  });
}

// Verify game data is stored
async function verifyGameStorage() {
  const data = await getGameData();
  console.log('[Nexus] Game data records in IndexedDB:', data.length);
  return data.length > 0;
}

/* ---------- INIT ---------- */
window.addEventListener('load', async () => {
  // Wait a tick for defer scripts
  setTimeout(async () => {
    initLumin();
    // Pre-load game data if Lumin exposes it
    // await verifyGameStorage();
  }, 1500);

  // Init libcurl
  await initLibcurl();
});
</script>
</body>
</html>
