<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus - Browser in a Browser</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #121212;
            --bg-secondary: #1e1e1e;
            --bg-tertiary: #252525;
            --bg-input: #1a1a1a;
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0a0;
            --border-color: #3d3d3d;
            --accent-purple: #9b30ff;
            --accent-black: #000000;
            --hover-bg: #2a2a2a;
            --sidebar-width: 60px;
            --topbar-height: 44px;
            --tabbar-height: 40px;
        }

        @property --angle {
            syntax: "<angle>";
            initial-value: 0deg;
            inherits: false;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path d="M2 2L2 16L6 12L9 19L12 18L9 11L14 11L2 2Z" fill="white" stroke="black" stroke-width="1.5"/></svg>') 2 2, auto;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            overflow: hidden;
            height: 100vh;
            transition: background-image 0.3s ease;
        }

        .app-container {
            display: flex;
            height: 100vh;
            position: relative;
        }

        /* --- Coursing Gradient Border Utility --- */
        .coursing-border-hover {
            border: 1px solid transparent;
            background-clip: padding-box, border-box;
            background-image: linear-gradient(var(--bg-secondary), var(--bg-secondary)), conic-gradient(from var(--angle), transparent 0%, var(--accent-purple) 10%, transparent 20%);
            transition: --angle 0s;
        }

        .coursing-border-hover:hover {
            animation: rotate-angle 2s linear infinite;
            background-image: linear-gradient(var(--bg-secondary), var(--bg-secondary)), conic-gradient(from var(--angle), transparent 0%, var(--accent-purple) 10%, transparent 20%);
        }

        .coursing-border-always {
            position: relative;
            border: 2px solid transparent;
            background-clip: padding-box, border-box;
            background-image: linear-gradient(var(--bg-primary), var(--bg-primary)), conic-gradient(from var(--angle), transparent 0%, var(--accent-purple) 10%, transparent 20%);
            animation: rotate-angle 2s linear infinite;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes rotate-angle {
            to { --angle: 360deg; }
        }

        /* --- Left Sidebar --- */
        .sidebar {
            width: var(--sidebar-width);
            background-color: rgba(18, 18, 18, 0.9);
            backdrop-filter: blur(10px);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 0;
            gap: 8px;
            flex-shrink: 0;
            z-index: 10;
        }

        .sidebar-icon {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            border-radius: 8px;
        }

        .sidebar-icon svg {
            width: 20px;
            height: 20px;
            stroke: var(--text-secondary);
            fill: none;
            stroke-width: 2;
            transition: stroke 0.2s;
        }

        .sidebar-icon.active svg {
            stroke: var(--accent-purple);
        }

        .sidebar-tooltip {
            position: absolute;
            left: 50px;
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            z-index: 100;
            border: 1px solid var(--border-color);
        }

        .sidebar-icon:hover .sidebar-tooltip {
            opacity: 1;
        }

        /* --- Main Section --- */
        .main-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-color: rgba(18, 18, 18, 0.8);
            backdrop-filter: blur(15px);
            position: relative;
        }

        /* --- Top Bar (Tabs + Address) --- */
        .top-bar {
            background-color: rgba(30, 30, 30, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            z-index: 5;
        }

        /* Tabs Row */
        .tabs-container {
            height: var(--tabbar-height);
            display: flex;
            align-items: center;
            padding: 0 10px;
            gap: 6px;
        }

        .tab {
            display: flex;
            align-items: center;
            padding: 8px 14px;
            cursor: pointer;
            font-size: 13px;
            color: var(--text-secondary);
            transition: all 0.2s;
            height: 32px;
            border-radius: 8px;
        }

        .tab.active {
            color: var(--text-primary);
        }

        .tab-close {
            margin-left: 10px;
            width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            opacity: 0.7;
            transition: opacity 0.2s, background 0.2s;
        }

        .tab-close:hover {
            opacity: 1;
            background: var(--hover-bg);
        }

        .new-tab-btn {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all 0.2s;
        }

        .new-tab-btn:hover {
            background: var(--hover-bg);
            color: var(--text-primary);
        }

        /* Address Bar Row */
        .address-bar-container {
            height: var(--topbar-height);
            display: flex;
            align-items: center;
            padding: 0 12px;
            gap: 10px;
        }

        .nav-btn {
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all 0.2s;
        }

        .nav-btn:hover {
            background: var(--hover-bg);
            color: var(--text-primary);
        }

        .nav-btn svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
        }

        .address-bar {
            flex: 1;
            height: 36px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            color: var(--text-primary);
            font-size: 14px;
        }

        .address-bar input {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 14px;
        }

        .address-icon {
            margin-right: 10px;
            color: var(--text-secondary);
        }

        /* --- Content Views --- */
        .content-area {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .view {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            background-color: transparent;
        }

        .view.active {
            display: flex;
        }

        /* New Tab View */
        .new-tab-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            z-index: 2;
            width: 100%;
            max-width: 600px;
            margin-top: 50px;
        }

        .n-logo-container {
            width: 120px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
        }

        .logo-text {
            font-size: 100px;
            font-weight: 800;
            color: #ffffff;
            line-height: 1;
            letter-spacing: -5px;
            text-shadow: none; /* Removed glow */
        }

        .central-search-container {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .central-search {
            width: 100%;
            height: 50px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            background: var(--bg-input);
        }

        .central-search input {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 16px;
            height: 100%;
        }

        .central-search-icon {
            margin-right: 12px;
            color: var(--text-secondary);
        }

        /* Bookmarks */
        .new-tab-shortcuts {
            display: flex;
            gap: 25px;
            justify-content: center;
            align-items: center;
            margin-top: 10px;
        }

        .shortcut-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .shortcut-item:hover {
            transform: translateY(-3px);
        }

        .shortcut-circle {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--bg-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
            overflow: hidden;
        }

        .shortcut-circle svg, .shortcut-circle img {
            width: 24px;
            height: 24px;
            object-fit: contain;
        }

        .shortcut-label {
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* Chrome Error View */
        .chrome-error-view {
            background-color: #202124;
            color: #bdc1c6;
            font-family: 'Inter', 'Roboto', sans-serif;
            align-items: flex-start;
            padding: 60px;
        }

        .error-content {
            max-width: 600px;
        }

        .error-icon {
            width: 72px;
            height: 72px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .error-title {
            font-size: 24px;
            font-weight: 400;
            margin-bottom: 10px;
            color: #e8eaed;
        }

        .error-subtitle {
            font-size: 14px;
            margin-bottom: 20px;
            color: #9aa0a6;
        }

        .error-code {
            font-size: 13px;
            color: #9aa0a6;
            border-top: 1px solid #5f6368;
            padding-top: 15px;
        }

        /* Games View */
        .games-view {
            padding: 40px;
            align-items: center;
            overflow-y: auto;
        }

        .games-header {
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 30px;
            color: var(--text-primary);
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 800px;
        }

        .game-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .game-item:hover {
            transform: scale(1.05);
        }

        .game-icon-square {
            width: 100px;
            height: 100px;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-secondary);
        }

        .game-icon-square img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .game-name {
            font-size: 13px;
            color: var(--text-secondary);
            text-align: center;
        }

        /* Game Player View */
        .game-player-view {
            background: #000;
        }

        .game-player-toolbar {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            gap: 10px;
            z-index: 10;
        }

        .player-btn {
            padding: 8px 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        #game-frame {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Settings View */
        .settings-view {
            padding: 40px;
            align-items: flex-start;
            overflow-y: auto;
        }

        .settings-header {
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--text-primary);
        }

        .settings-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
        }

        .settings-tab-btn {
            padding: 10px 20px;
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            border-bottom: 2px solid transparent;
            transition: color 0.2s, border-color 0.2s;
        }

        .settings-tab-btn.active {
            color: var(--accent-purple);
            border-bottom-color: var(--accent-purple);
        }

        .settings-content {
            width: 100%;
            max-width: 600px;
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 25px;
        }

        .settings-group {
            margin-bottom: 20px;
        }

        .settings-label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-primary);
            font-weight: 500;
        }

        .settings-input {
            width: 100%;
            padding: 10px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            outline: none;
        }

        .settings-btn {
            padding: 10px 16px;
            background: var(--accent-purple);
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .settings-btn:hover {
            background: #7a1acb;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Left Sidebar -->
        <div class="sidebar">
            <div class="sidebar-icon active" data-view="newtab-view">
                <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                <div class="sidebar-tooltip">Home</div>
            </div>
            <div class="sidebar-icon" data-view="games-view">

                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                <div class="sidebar-tooltip">Settings</div>
            </div>
            <div style="flex: 1;"></div>
            <div class="sidebar-icon">
                <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                <div class="sidebar-tooltip">Downloads</div>
            </div>
        </div>

        <!-- Main Section -->
        <div class="main-section">
            <!-- Top Bar -->
            <div class="top-bar">
                <!-- Tabs Row -->
                <div class="tabs-container">
                    <div class="tab coursing-border-hover active" data-view="newtab-view">New Tab
                        <div class="tab-close">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                        </div>
                    </div>
                    <div class="new-tab-btn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    </div>
                </div>

                <!-- Address Bar Row -->
                <div class="address-bar-container">
                    <div class="nav-btn" title="Back"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg></div>

                    <div class="address-bar coursing-border-hover">
                        <div class="address-icon">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>

            <!-- Content Area -->
            <div class="content-area">
                <!-- New Tab View -->

                    <div class="new-tab-content">

                        <div class="central-search-container">
                            <div class="central-search coursing-border-hover">
                                <div class="central-search-icon">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                                </div>
                                <input type="text" id="central-search-input" placeholder="Search the web or enter a URL">
                            </div>
                        </div>
                        <div class="new-tab-shortcuts">
                            <!-- YouTube -->
                            <div class="shortcut-item" data-url="https://youtube.com">
                                <div class="shortcut-circle"><svg viewBox="0 0 24 24" fill="currentColor" style="color: #FF0000;"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg></div>
                                <div class="shortcut-label">YouTube</div>
                            </div>

    <script>
        // View Switching Logic
        const views = document.querySelectorAll('.view');
        const sidebarIcons = document.querySelectorAll('.sidebar-icon[data-view]');
        const topTabs = document.querySelectorAll('.tab[data-view]');
        const navHomeBtn = document.querySelector('.nav-btn[data-view]');

        function switchView(viewId) {
            views.forEach(v => v.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');

            // Update address bar
            document.getElementById('address-input').value = `nexus://${viewId.replace('-view', '')}`;
        }

        sidebarIcons.forEach(icon => {
            icon.addEventListener('click', () => {
                sidebarIcons.forEach(i => i.classList.remove('active'));
                icon.classList.add('active');
                switchView(icon.dataset.view);
            });
        });

        topTabs.forEach(tab => {
            tab.addEventListener('click', (e) => {
                if (e.target.closest('.tab-close')) return;
                topTabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                switchView(tab.dataset.view);
            });
        });

        if (navHomeBtn) {
            navHomeBtn.addEventListener('click', () => {
                switchView('newtab-view');
                document.getElementById('address-input').value = 'nexus://newtab';
            });
        }
