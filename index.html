<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Nexus</title>
<style>
  :root {
    --bg: #0b0e14;
    --panel: #141922;
    --panel2: #1b2230;
    --line: #262f40;
    --txt: #e6ebf4;
    --dim: #8b94a7;
    --acc: #818cf8;
    --acc-soft: rgba(129, 140, 248, .14);
    --green: #4ade80;
    --red: #f87171;
    --amber: #fbbf24;
    --radius: 12px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden;
    background: var(--bg); color: var(--txt);
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  button { font-family: inherit; }

  /* ---- tab strip ---- */
  #tabstrip {
    display: flex; align-items: flex-end; gap: 4px; flex-shrink: 0;
    padding: 8px 10px 0 calc(10px + env(safe-area-inset-left));
    padding-right: calc(10px + env(safe-area-inset-right));
    padding-top: calc(8px + env(safe-area-inset-top));
    background: var(--bg); user-select: none;
  }
  #tabs { display: flex; gap: 4px; overflow-x: auto; flex: 1; scrollbar-width: none; padding-bottom: 0; }
  #tabs::-webkit-scrollbar { display: none; }
  .tab {
    display: flex; align-items: center; gap: 8px; flex-shrink: 0;
    max-width: 200px; min-width: 120px; padding: 8px 8px 8px 12px;
    background: transparent; color: var(--dim); border: 1px solid transparent;
    border-bottom: 0; border-radius: 10px 10px 0 0; font-size: 13px; cursor: pointer;
    white-space: nowrap;
  }
  .tab:hover { background: var(--panel); color: var(--txt); }
  .tab.active { background: var(--panel); color: var(--txt); border-color: var(--line); }
  .tab .fav {
    width: 18px; height: 18px; border-radius: 5px; flex-shrink: 0;
    background: var(--panel2); color: var(--dim);
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; overflow: hidden;
  }
  .tab .fav img { width: 100%; height: 100%; object-fit: contain; }
  .tab .ttl { overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .tab .x {
    border: 0; background: transparent; color: inherit; opacity: .55;
    width: 22px; height: 22px; border-radius: 6px; cursor: pointer; font-size: 13px; line-height: 1;
    flex-shrink: 0;
  }
  .tab .x:hover { opacity: 1; background: rgba(255,255,255,.1); }
  #newTabBtn {
    flex-shrink: 0; width: 32px; height: 32px; margin-bottom: 4px;
    border: 1px solid transparent; background: transparent; color: var(--dim);
    border-radius: 8px; font-size: 18px; cursor: pointer; line-height: 1;
  }
  #newTabBtn:hover { background: var(--panel); color: var(--txt); }

  /* ---- toolbar ---- */
  #toolbar {
    display: flex; align-items: center; gap: 6px; flex-shrink: 0;
    padding: 8px 10px; background: var(--panel);
    border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
    padding-left: calc(10px + env(safe-area-inset-left));
    padding-right: calc(10px + env(safe-area-inset-right));
  }
  .tbtn {
    background: transparent; color: var(--dim); border: 0; border-radius: 8px;
    width: 36px; height: 36px; font-size: 16px; cursor: pointer; flex-shrink: 0;
  }
  .tbtn:hover:not(:disabled) { background: var(--panel2); color: var(--txt); }
  .tbtn:disabled { opacity: .3; cursor: default; }
  #omni {
    flex: 1; display: flex; align-items: center; gap: 8px; min-width: 0;
    background: var(--bg); border: 1px solid var(--line); border-radius: 999px;
    padding: 0 8px 0 14px; height: 38px;
  }
  #omni:focus-within { border-color: var(--acc); }
  #omniIcon { color: var(--dim); font-size: 13px; flex-shrink: 0; }
  #urlInput {
    flex: 1; min-width: 0; background: transparent; border: 0; outline: 0;
    color: var(--txt); font-size: 14px; height: 100%;
  }
  #urlInput::selection { background: var(--acc-soft); }
  #goBtn {
    background: var(--acc-soft); color: var(--acc); border: 0; border-radius: 999px;
    height: 28px; padding: 0 14px; font-size: 13px; font-weight: 600; cursor: pointer; flex-shrink: 0;
  }
  #goBtn:hover:not(:disabled) { background: var(--acc); color: #0b0e14; }
  #goBtn:disabled { opacity: .4; cursor: default; }
  #serverPill {
    display: flex; align-items: center; gap: 7px; flex-shrink: 0;
    background: var(--bg); border: 1px solid var(--line); border-radius: 999px;
    color: var(--dim); font-size: 12px; font-family: ui-monospace, Menlo, monospace;
    height: 36px; padding: 0 12px; cursor: pointer; max-width: 190px;
  }
  #serverPill:hover { border-color: var(--acc); color: var(--txt); }
  #serverPill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); flex-shrink: 0; }
  #serverPill.on .dot { background: var(--green); box-shadow: 0 0 6px var(--green); }
  #serverPill.bad .dot { background: var(--red); box-shadow: 0 0 6px var(--red); }
  #serverPill span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ---- progress ---- */
  #progress { height: 2px; background: transparent; flex-shrink: 0; overflow: hidden; }
  #progressBar { height: 100%; width: 30%; background: var(--acc); border-radius: 2px;
    transform: translateX(-100%); opacity: 0; }
  #progress.run #progressBar { opacity: 1; animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide {
    0% { transform: translateX(-100%); } 100% { transform: translateX(340%); }
  }

  /* ---- frames ---- */
  #frames { flex: 1; position: relative; min-height: 0; background: #fff; }
  #frames iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: none; background: #fff; }
  #frames iframe.show { display: block; }

  /* ---- side panel ---- */
  #scrim { position: fixed; inset: 0; background: rgba(0,0,0,.45); opacity: 0; pointer-events: none;
    transition: opacity .2s; z-index: 40; }
  #scrim.show { opacity: 1; pointer-events: auto; }
  #panel {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(330px, 92vw); z-index: 41;
    background: var(--panel); border-left: 1px solid var(--line);
    transform: translateX(105%); transition: transform .22s ease;
    display: flex; flex-direction: column; padding: 18px;
  }
  #panel.show { transform: none; }
  #panel h2 { margin: 0 0 4px; font-size: 17px; }
  #panel .sub { color: var(--dim); font-size: 12px; margin: 0 0 14px; }
  .fld { margin: 10px 0; }
  .fld label { display: block; font-size: 12px; color: var(--dim); margin-bottom: 5px; }
  .fld select, .fld input {
    width: 100%; background: var(--bg); color: var(--txt);
    border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; font-size: 13px; outline: none;
  }
  .fld select:focus, .fld input:focus { border-color: var(--acc); }
  .row2 { display: flex; gap: 8px; }
  .row2 button, .btn {
    flex: 1; background: var(--panel2); color: var(--txt); border: 1px solid var(--line);
    border-radius: 8px; padding: 9px 10px; font-size: 13px; cursor: pointer;
  }
  .row2 button:hover, .btn:hover { border-color: var(--acc); }
  .btn.primary { background: var(--acc); border-color: var(--acc); color: #0b0e14; font-weight: 700; }
  #setNote { font-size: 11px; color: var(--dim); font-family: ui-monospace, Menlo, monospace;
    word-break: break-all; margin-top: 10px; }
  .keys { margin-top: auto; font-size: 11.5px; color: var(--dim); line-height: 1.9; }
  .keys kbd { background: var(--bg); border: 1px solid var(--line); border-radius: 5px;
    padding: 1px 6px; font-family: ui-monospace, Menlo, monospace; font-size: 11px; }

  /* ---- toast ---- */
  #toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(20px);
    background: var(--panel2); color: var(--txt); border: 1px solid var(--line);
    padding: 10px 18px; border-radius: 999px; font-size: 13px; z-index: 50;
    opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
    max-width: 88vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-family: ui-monospace, Menlo, monospace;
  }
  #toast.show { opacity: 1; transform: translateX(-50%); }
  #toast.ok { border-color: var(--green); } #toast.err { border-color: var(--red); }
  #toast.warn { border-color: var(--amber); }

  @media (max-width: 640px) {
    .tab { min-width: 40px; max-width: 140px; }
    .tab .ttl { display: none; }
    .tab.active .ttl { display: block; }
    #serverPill span { display: none; }
    #serverPill { padding: 0 10px; }
    .tbtn { width: 32px; height: 32px; }
    #homeBtn { display: none; }
  }
</style>
</head>
<body>

  <div id="tabstrip">
    <div id="tabs"></div>
    <button id="newTabBtn" type="button" title="New tab (Alt+T)">+</button>
  </div>

  <div id="toolbar">
    <button class="tbtn" id="backBtn" title="Back (Alt+Left)">←</button>
    <button class="tbtn" id="fwdBtn" title="Forward (Alt+Right)">→</button>
    <button class="tbtn" id="reloadBtn" title="Reload (Ctrl+R)">⟳</button>
    <button class="tbtn" id="homeBtn" title="Home">⌂</button>
    <div id="omni">
      <span id="omniIcon">🌐</span>
      <input id="urlInput" type="text" placeholder="Search or enter URL" autocomplete="off"
             autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="url">
      <button id="goBtn" type="button">Go</button>
    </div>
    <button id="serverPill" class="bad" title="Wisp server — click for settings"><span class="dot"></span><span id="serverHost">…</span></button>
    <button class="tbtn" id="settingsBtn" title="Settings">⚙</button>
  </div>
  <div id="progress"><div id="progressBar"></div></div>

  <div id="frames"></div>

  <div id="scrim"></div>
  <div id="panel">
    <h2>Settings</h2>
    <p class="sub">Connection &amp; behavior</p>
    <div class="fld"><label>Wisp server</label><select id="wispSelect"></select></div>
    <div class="fld"><label>Custom Wisp (wss://host/path/)</label>
      <div class="row2"><input id="wispCustom" placeholder="wss://…" autocomplete="off" spellcheck="false" style="flex:2"><button id="wispSave">Use</button></div>
    </div>
    <div class="fld"><label>WebSocket mode</label>
      <select id="wsMode">
        <option value="auto">Auto (direct → proxied fallback)</option>
        <option value="proxy">Always proxied (unblocks more)</option>
        <option value="direct">Always direct (lowest latency)</option>
      </select>
    </div>
    <div class="fld"><label>Nexus background</label><select id="homeBgSel"><option value="stars">Starfield</option><option value="matrix">Slow matrix</option></select></div>
    <div class="fld"><label>Search engine</label>
      <select id="engineSel">
        <option value="google">Google</option>
        <option value="duckduckgo">DuckDuckGo</option>
        <option value="bing">Bing</option>
      </select>
    </div>
    <div class="fld row2">
      <button id="reconnectBtn">Reconnect</button>
      <button id="clearCookies">Clear cookies</button>
    </div>
    <div id="setNote"></div>
    <div class="keys">
      <kbd>Alt+T</kbd> new tab &nbsp; <kbd>Alt+W</kbd> close tab &nbsp; <kbd>Alt+1–8</kbd> switch<br>
      <kbd>Ctrl+L</kbd> address bar &nbsp; <kbd>Ctrl+R</kbd> reload &nbsp; <kbd>Esc</kbd> close panel
    </div>
  </div>

  <div id="toast"></div>

<script>
'use strict';
/* ============================================================================
 *  Nexus — Epoxy-first; libcurl.js fallback; Chrome/WebKit fixes
 *  Engine: proven v2 core (bridge, cookies, runtime). Shell: rewritten.
 * ==========================================================================*/

// ---------------- Config ----------------
const EPOXY_VERSION = '2.1.19-1';
const EPOXY_CDNS = [
  'https://cdn.jsdelivr.net/npm/@mercuryworkshop/epoxy-tls@' + EPOXY_VERSION + '/full/epoxy-bundled.js',
  'https://unpkg.com/@mercuryworkshop/epoxy-tls@' + EPOXY_VERSION + '/full/epoxy-bundled.js'
];
const LIBCURL_CDNS = [
  'https://cdn.jsdelivr.net/npm/libcurl.js@latest/libcurl_full.js',
  'https://unpkg.com/libcurl.js@latest/libcurl_full.js'
];
const DEFAULT_WISP = [
  'wss://wisp.mercurywork.shop/',
  'wss://anura.pro/',
  'wss://wisp.webmc.fun/',
  'wss://wisp.rhw.one/wisp/'
];
const ENGINES = {
  google: 'https://www.google.com/search?q=%s',
  duckduckgo: 'https://duckduckgo.com/?q=%s',
  bing: 'https://www.bing.com/search?q=%s'
};
const PROXY_VERSION = '3.6.1';
const REQ_TIMEOUT_MS = 45000;
const MAX_TABS_RESTORE = 8;

const store = {
  get(k, d) { try { const v = localStorage.getItem('px_' + k); return v == null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('px_' + k, v); } catch (e) {} },
  getJSON(k, d) { try { const v = localStorage.getItem('px_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  setJSON(k, v) { try { localStorage.setItem('px_' + k, JSON.stringify(v)); } catch (e) {} }
};

const $ = id => document.getElementById(id);
const tabsEl = $('tabs'), framesEl = $('frames'), urlInput = $('urlInput'), goBtn = $('goBtn'),
      backBtn = $('backBtn'), fwdBtn = $('fwdBtn'), reloadBtn = $('reloadBtn'), homeBtn = $('homeBtn'),
      newTabBtn = $('newTabBtn'), serverPill = $('serverPill'), serverHost = $('serverHost'),
      settingsBtn = $('settingsBtn'), panel = $('panel'), scrim = $('scrim'),
      wispSelect = $('wispSelect'), wispCustom = $('wispCustom'), wispSave = $('wispSave'),
      wsModeSel = $('wsMode'), engineSel = $('engineSel'), homeBgSel = $('homeBgSel'),
      reconnectBtn = $('reconnectBtn'), clearCookiesBtn = $('clearCookies'),
      setNote = $('setNote'), toastEl = $('toast'), progressEl = $('progress'),
      omniIcon = $('omniIcon');
const UA = navigator.userAgent;

let libcurlReady = false, wispOK = false;
let epoxyModule = null, epoxyClient = null, epoxyReady = false, epoxyLoadPromise = null;
let activeTransport = 'none';
let WISP_URL = store.get('wisp', DEFAULT_WISP[0]);
let WS_MODE = store.get('wsmode', 'auto');
let ENGINE = store.get('engine', 'google');
window.__pxWSMode = WS_MODE;
let consecFails = 0, failingOver = false;
let lastBlobUrls = [];
let progressCount = 0;

// ---------------- Utils ----------------
const SAFE_METHODS = ['GET', 'POST', 'PUT', 'PATCH', 'DELETE', 'HEAD', 'OPTIONS'];
const DROP_REQ_HEADERS = new Set([
  'host', 'connection', 'content-length', 'accept-encoding',
  'transfer-encoding', 'upgrade', 'via', 'te', 'trailer', 'expect', 'keep-alive',
  'proxy-authorization', 'proxy-authenticate', 'http2-settings',
  'sec-fetch-site', 'sec-fetch-mode', 'sec-fetch-user', 'sec-fetch-dest'
]);
const DROP_RESP_HEADERS = new Set([
  'set-cookie', 'content-encoding', 'transfer-encoding', 'connection',
  'keep-alive', 'proxy-authenticate', 'proxy-authorization', 'upgrade', 'trailer', 'te'
]);
function sanitizeMethod(m, hasBody) {
  m = String(m == null ? '' : m).toUpperCase().trim();
  if (!m) return hasBody ? 'POST' : 'GET';
  return SAFE_METHODS.indexOf(m) !== -1 ? m : (hasBody ? 'POST' : 'GET');
}
function headersToObj(h) {
  const o = {};
  if (!h) return o;
  if (typeof Headers !== 'undefined' && h instanceof Headers) h.forEach((v, k) => { o[k] = v; });
  else if (Array.isArray(h)) h.forEach(p => { if (p && p.length >= 2) o[p[0]] = p[1]; });
  else if (typeof h === 'object') for (const k in h) if (Object.prototype.hasOwnProperty.call(h, k)) o[k] = h[k];
  return o;
}
function hasHeader(obj, name) {
  const n = name.toLowerCase();
  for (const k in obj) if (k.toLowerCase() === n) return true;
  return false;
}
function stripHeader(obj, name) {
  const n = name.toLowerCase();
  for (const k of Object.keys(obj)) if (k.toLowerCase() === n) delete obj[k];
}
function getHeaderCI(obj, name) {
  const n = name.toLowerCase();
  for (const k in obj) if (k.toLowerCase() === n) return obj[k];
  return null;
}
function addClientHints(headers) {
  if (!/Chrom(e|ium)\//.test(UA)) return;
  const m = UA.match(/Chrom(?:e|ium)\/(\d+)/);
  const major = m ? m[1] : '120';
  if (!hasHeader(headers, 'sec-ch-ua'))
    headers['Sec-CH-UA'] = '"Chromium";v="' + major + '", "Not(A:Brand";v="24", "Google Chrome";v="' + major + '"';
  if (!hasHeader(headers, 'sec-ch-ua-mobile'))
    headers['Sec-CH-UA-Mobile'] = /Mobile|Android/.test(UA) ? '?1' : '?0';
  if (!hasHeader(headers, 'sec-ch-ua-platform')) {
    let p = '"Windows"';
    if (/Android/.test(UA)) p = '"Android"';
    else if (/iPhone|iPad|iPod/.test(UA)) p = '"iOS"';
    else if (/Mac/.test(UA)) p = '"macOS"';
    else if (/Linux/.test(UA)) p = '"Linux"';
    headers['Sec-CH-UA-Platform'] = p;
  }
}
function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function hostOf(u) { try { return new URL(u).host; } catch (e) { return u; } }
function withTimeout(promise, ms, what) {
  let t = null;
  const to = new Promise((_, rej) => { t = setTimeout(() => rej(new Error((what || 'Request') + ' timed out')), ms); });
  return Promise.race([promise, to]).then(v => { clearTimeout(t); return v; }, e => { clearTimeout(t); throw e; });
}

// ---------------- Toast + progress + pill ----------------
let toastTimer = null;
function toast(msg, kind, ms) {
  toastEl.textContent = msg;
  toastEl.className = 'show ' + (kind || '');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toastEl.className = ''; }, ms || 3500);
}
function progress(on) {
  progressCount = Math.max(0, progressCount + (on ? 1 : -1));
  progressEl.className = progressCount > 0 ? 'run' : '';
}
function pill() {
  serverHost.textContent = wispOK ? hostOf(WISP_URL) : 'offline';
  serverPill.className = wispOK ? 'on' : 'bad';
  serverPill.id = 'serverPill';
  setNote.textContent = 'Active: ' + WISP_URL + (wispOK ? ' · ' + activeTransport : ' (unreachable)');
}

// ---------------- Cookie jar ----------------
const cookieJar = new Map();
const SESSION_ONLY = 0;
function sweepCookies() {
  const now = Date.now();
  for (const [, jar] of cookieJar)
    for (const [name, c] of jar)
      if (c.expires && c.expires !== SESSION_ONLY && c.expires < now) jar.delete(name);
}
setInterval(sweepCookies, 60000);
function cookieScopeMatch(key, host) {
  if (key.charAt(0) === 'h') return host === key.slice(2);
  const d = key.slice(2);
  return host === d || host.endsWith('.' + d);
}
function getCookiesFor(url) {
  try {
    const u = new URL(url);
    const host = u.hostname.toLowerCase();
    const path = u.pathname || '/';
    const secure = u.protocol === 'https:';
    const now = Date.now();
    const out = [];
    for (const [key, jar] of cookieJar) {
      if (!cookieScopeMatch(key, host)) continue;
      for (const [name, c] of jar) {
        if (c.secure && !secure) continue;
        if (c.path && path.indexOf(c.path) !== 0) continue;
        if (c.expires && c.expires !== SESSION_ONLY && c.expires < now) { jar.delete(name); continue; }
        out.push(name + '=' + c.value);
      }
    }
    return out.join('; ');
  } catch (e) { return ''; }
}
function parseSetCookie(sc, defaultHost, defaultPath) {
  const parts = String(sc).split(';');
  const eq = parts[0].indexOf('=');
  if (eq < 0) return null;
  const name = parts[0].slice(0, eq).trim();
  const value = parts[0].slice(eq + 1).trim();
  if (!name) return null;
  let domain = null, hostOnly = true;
  let path = null, secure = false, expires = SESSION_ONLY;
  for (const p of parts.slice(1)) {
    const kv = p.trim();
    const lk = kv.toLowerCase();
    if (lk.indexOf('domain=') === 0) {
      let d = kv.slice(7).trim().toLowerCase();
      if (d.charAt(0) === '.') d = d.slice(1);
      if (d && (defaultHost === d || defaultHost.endsWith('.' + d))) { domain = d; hostOnly = false; }
    }
    else if (lk.indexOf('path=') === 0) path = kv.slice(5).trim() || '/';
    else if (lk === 'secure') secure = true;
    else if (lk.indexOf('max-age=') === 0) {
      const s = parseInt(kv.slice(8), 10);
      if (!isNaN(s)) expires = s <= 0 ? -1 : Date.now() + s * 1000;
    } else if (lk.indexOf('expires=') === 0) {
      const d = Date.parse(kv.slice(8));
      if (!isNaN(d)) expires = d;
    }
  }
  if (name.indexOf('__Secure-') === 0 && !secure) return null;
  if (name.indexOf('__Host-') === 0) {
    if (!secure || hostOnly === false) return null;
    path = '/';
  }
  if (!path) path = defaultPath || '/';
  const key = hostOnly ? 'h:' + defaultHost : 'd:' + (domain || defaultHost);
  return { name, value, key, path, secure, expires };
}
function defaultDirPath(url) {
  try {
    const p = new URL(url).pathname || '/';
    const i = p.lastIndexOf('/');
    return i <= 0 ? '/' : p.slice(0, i + 1);
  } catch (e) { return '/'; }
}
function storeOneCookie(url, sc) {
  let host;
  try { host = new URL(url).hostname.toLowerCase(); } catch (e) { return; }
  const c = parseSetCookie(sc, host, defaultDirPath(url));
  if (!c) return;
  if (!cookieJar.has(c.key)) cookieJar.set(c.key, new Map());
  const jar = cookieJar.get(c.key);
  if (c.expires === -1) jar.delete(c.name);
  else jar.set(c.name, c);
}
function splitSetCookie(s) {
  const parts = String(s).split(',');
  const out = [];
  let acc = parts[0] || '';
  for (let j = 1; j < parts.length; j++) {
    const seg = parts[j];
    const semi = seg.indexOf(';');
    const head = semi === -1 ? seg : seg.slice(0, semi);
    if (head.indexOf('=') !== -1) { out.push(acc); acc = seg; }

function loadScript(src) {

function noteFetch(ok) {

async function backgroundFailover() {

      await healthCheck(url, 7000);

// ---------------- Bridge: proxied fetch ----------------
// Cap parallel proxied requests: heavy pages (YouTube) fire dozens at once
// and a single congested Wisp socket collapses into timeouts ("breaks

}
function pxReleaseFetch() {

}

// ---------------- HTML patching ----------------
function decodeBody(buf, contentType) {
  let charset = 'utf-8';
  const m = /charset=([^;]+)/i.exec(contentType || '');
  if (m) charset = m[1].trim().replace(/^"|"$/g, '').toLowerCase();
  else {
    try {
      const head = new TextDecoder('windows-1252').decode(new Uint8Array(buf).slice(0, 8192));
      const mm = /<meta[^>]+charset\s*=\s*["']?([^"'\s/>]+)/i.exec(head)
        || /<meta[^>]+content\s*=\s*["'][^"']*charset=([^"';\s]+)/i.exec(head);
      if (mm) charset = mm[1].trim().toLowerCase();
    } catch (e) {}
  }
  try { return new TextDecoder(charset).decode(buf); }
  catch (e) { return new TextDecoder('utf-8').decode(buf); }
}

function patchHTML(html, pageUrl, tabId) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  doc.querySelectorAll('meta[http-equiv]').forEach(m => {
    const eq = (m.getAttribute('http-equiv') || '').toLowerCase();
    if (eq === 'content-security-policy' || eq === 'content-security-policy-report-only' ||
        eq === 'x-frame-options' || eq === 'refresh' || eq === 'content-type') m.remove();
  });
  doc.querySelectorAll('meta[name]').forEach(m => {
    if ((m.getAttribute('name') || '').toLowerCase() === 'referrer') m.remove();
  });
  const charsetMeta = doc.createElement('meta');
  charsetMeta.setAttribute('charset', 'utf-8');
  doc.querySelectorAll('[integrity]').forEach(el => el.removeAttribute('integrity'));
  doc.querySelectorAll('[crossorigin]').forEach(el => el.removeAttribute('crossorigin'));
  doc.querySelectorAll('[referrerpolicy]').forEach(el => el.removeAttribute('referrerpolicy'));
  doc.querySelectorAll('base').forEach(b => b.remove());

  const head = doc.head || doc.documentElement;
  const rm = doc.createElement('meta');
  rm.setAttribute('name', 'referrer');
  rm.setAttribute('content', 'no-referrer');
  const base = doc.createElement('base');
  base.setAttribute('href', pageUrl);
  base.setAttribute('target', '_self');
  head.insertBefore(charsetMeta, head.firstChild);
  head.insertBefore(rm, charsetMeta.nextSibling);
  head.insertBefore(base, rm.nextSibling);

  const rt = doc.createElement('script');
  rt.textContent = 'window.__pxInitURL=' + JSON.stringify(pageUrl).replace(/</g, '\\u003c') +
    ';window.__pxTabId=' + JSON.stringify(tabId || '').replace(/</g, '\\u003c') +
    ';(' + pageRuntime.toString() + ')();';
  head.insertBefore(rt, head.firstChild);
  return '<!DOCTYPE html>\n' + doc.documentElement.outerHTML;
}

    ttl.className = 'ttl';
    ttl.textContent = t.title || 'New Tab';
    const x = document.createElement('button');
    x.className = 'x';
    x.textContent = '×';
    x.title = 'Close tab';
