<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Nexus</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; }
  body {
    background:#0a0a0f;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:#fff;
    display:flex; align-items:center; justify-content:center;
    position:relative;
  }
  .starfield { position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
  .star {
    position:absolute; border-radius:50%; background:#fff;
    animation:twinkle var(--dur) ease-in-out infinite;
  }
  @keyframes twinkle {
    0%,100% { opacity:0; transform:scale(.7); }
    50% { opacity:var(--max); transform:scale(1); }
  }

  /* Top nav */
  .top-nav {
    position:fixed; top:16px; left:50%; transform:translateX(-50%);
    z-index:100;
    background:rgba(30,30,38,.85);
    backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
    border-radius:16px; padding:8px 16px;
    display:flex; align-items:center; gap:12px;
    border:1px solid rgba(255,255,255,.06);
    box-shadow:0 4px 24px rgba(0,0,0,.4);
    max-width:90vw;
  }
  .nav-left, .nav-right { display:flex; align-items:center; gap:4px; }
  .nav-left { margin-right:auto; gap:8px; }
  .nav-icon {
    width:36px; height:36px; border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    background:transparent; border:none; cursor:pointer; color:#e0e0e0;
    transition:background .15s; flex-shrink:0;
  }
  .nav-icon:hover { background:rgba(255,255,255,.1); }
  .nav-icon svg { width:20px; height:20px; fill:currentColor; }
  .frog-icon { color:#7dd3fc; }

  /* Main */
  .main {
    position:relative; z-index:10;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:40px; width:100%; max-width:640px; padding:24px;
    animation:fadeIn .6s ease-out;
  }
  @keyframes fadeIn { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }
  .title {
    font-size:clamp(26px,6vw,40px); font-weight:700; letter-spacing:-.02em;
    text-align:center; user-select:none; line-height:1.15;
    text-shadow:0 2px 20px rgba(167,139,250,.3);
  }
  .title span {
    background:linear-gradient(135deg,#a78bfa,#7dd3fc);
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent; color:transparent;
  }

  /* Apps */
  .apps {
    display:flex; align-items:center; justify-content:center;
    gap:14px; flex-wrap:wrap;
  }
  .app {
    width:52px; height:52px; border-radius:14px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; border:none; outline:none; padding:0;
    transition:transform .18s, box-shadow .18s;
    box-shadow:0 4px 14px rgba(0,0,0,.35);
    flex-shrink:0;
  }
  .app:hover { transform:translateY(-3px) scale(1.05); }
  .app:active { transform:translateY(0) scale(.97); }
  .app svg { width:26px; height:26px; fill:#fff; }
  .a-ig { background:linear-gradient(135deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888); }
  .a-mv { background:linear-gradient(135deg,#4a1d8e,#2d0a5e); }
  .a-tt { background:#000; border:1px solid #333; }
  .a-tw { background:#9146ff; }
  .a-yt { background:#ff0000; }
  .a-dc { background:#5865f2; }

  /* Search */
  .search-wrap { width:100%; max-width:520px; }
  .search {
    width:100%;
    background:rgba(30,30,38,.85);
    backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.08);
    border-radius:28px; padding:16px 24px;
    color:#fff; font-size:16px; outline:none;
    transition:border-color .25s, box-shadow .25s;
    box-shadow:0 4px 24px rgba(0,0,0,.3);
    font-family:inherit;
  }
  .search::placeholder { color:#888; }
  .search:focus {
    border-color:#a78bfa;
    box-shadow:0 0 0 3px rgba(167,139,250,.15), 0 4px 24px rgba(0,0,0,.3);
  }

  /* Status */
  .status {
    position:fixed; bottom:16px; left:50%; transform:translateX(-50%);
    z-index:100;
    display:flex; align-items:center; gap:8px;
    padding:8px 18px;
    background:rgba(30,30,38,.85);
    backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
    border-radius:20px; border:1px solid rgba(255,255,255,.06);
    font-size:12px; color:#aaa;
    box-shadow:0 4px 24px rgba(0,0,0,.3);
    max-width:90vw; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; background:#666; }
  .dot.ready { background:#4ade80; box-shadow:0 0 8px rgba(74,222,128,.5); }
  .dot.loading { background:#facc15; animation:pulse 1s ease-in-out infinite; }
  .dot.error { background:#f87171; box-shadow:0 0 8px rgba(248,113,113,.5); }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.35; } }

  /* Browser view */
  .browser { position:fixed; inset:0; z-index:200; background:#0a0a0f; display:none; flex-direction:column; }
  .browser.on { display:flex; }
  .bbar {
    display:flex; align-items:center; gap:8px;
    padding:10px 14px;
    background:#1a1a24; border-bottom:1px solid rgba(255,255,255,.06);
    flex-shrink:0;
  }
  .bbar input {
    flex:1; min-width:0;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.08);
    border-radius:20px; padding:10px 16px;
    color:#fff; font-size:14px; outline:none; font-family:inherit;
  }
  .bbar input:focus { border-color:#a78bfa; }
  .bbtn {
    width:36px; height:36px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:transparent; border:none; color:#ccc; cursor:pointer;
    transition:background .15s; flex-shrink:0;
  }
  .bbtn:hover { background:rgba(255,255,255,.1); }
  .bbtn svg { width:18px; height:18px; fill:currentColor; }
  .bframe { flex:1; width:100%; border:none; background:#fff; }

  /* Loading overlay */
  .overlay {
    position:fixed; inset:0; z-index:300;
    background:rgba(10,10,15,.92);
    display:none; flex-direction:column; align-items:center; justify-content:center;
    gap:20px;
  }
  .overlay.on { display:flex; }
  .spinner {
    width:44px; height:44px;
    border:3px solid rgba(167,139,250,.15);
    border-top-color:#a78bfa; border-radius:50%;
    animation:spin .8s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
  .overlay p { color:#aaa; font-size:14px; max-width:80vw; text-align:center; word-break:break-word; }

  .hidden { display:none !important; }

  @media (max-width:480px) {
    .top-nav { top:10px; padding:6px 10px; gap:6px; }
    .nav-icon { width:32px; height:32px; }
    .nav-icon svg { width:18px; height:18px; }
    .app { width:46px; height:46px; border-radius:12px; }
    .app svg { width:22px; height:22px; }
    .main { gap:30px; padding:16px; }
  }
</style>
</head>

<!-- Import map: tells the browser where to find the ESM modules -->
<script type="importmap">
{
  "imports": {
    "@mercuryworkshop/epoxy-transport": "https://unpkg.com/@mercuryworkshop/epoxy-transport@3.0.5/dist/index.mjs",
    "@mercuryworkshop/libcurl-transport": "https://unpkg.com/@mercuryworkshop/libcurl-transport@2.0.1/dist/index.mjs"
  }
}
</script>

<script type="module">
// ============================================================
//  Nexus — Wisp proxy frontend
//  Transport: Epoxy (primary) -> libcurl.js (fallback)
// ============================================================

const CONFIG = {
  fallbackRelays: [
    "wss://wisp.mercurywork.shop/",
    "wss://glseries.net/wisp/",
    "wss://nebulaservices.org/wisp/",
    "wss://nebulaproxy.io/wisp/"
  ],
  relaySources: [
    "https://raw.githubusercontent.com/MercuryWorkshop/wisp-protocol/main/servers.json"
  ],
  timeout: 8000
};

const state = {
  epoxy: null,
  libcurl: null,
  relay: null,
  transport: null,   // "epoxy" | "libcurl"
  ready: false,
  history: [],
  hIndex: -1
};

const $ = (id) => document.getElementById(id);
const dom = {
  starfield: $("starfield"),
  main: $("main"),
  apps: $("apps"),
  search: $("search"),
  status: $("status"),
  dot: $("dot"),
  statusText: $("statusText"),
  browser: $("browser"),
  bFrame: $("bFrame"),
  bUrl: $("bUrl"),
  bBack: $("bBack"),
  bRefresh: $("bRefresh"),
  bGo: $("bGo"),
  overlay: $("overlay"),
  overlayText: $("overlayText"),
  navHome: $("navHome"),
  navDiscord: $("navDiscord")
};

// ---------- Stars ----------
(function stars() {
  const frag = document.createDocumentFragment();
  for (let i = 0; i < 120; i++) {
    const s = document.createElement("div");
    s.className = "star";
    const sz = Math.random() * 2.4 + 0.4;
    s.style.width = sz + "px";
    s.style.height = sz + "px";
    s.style.left = Math.random() * 100 + "%";
    s.style.top = Math.random() * 100 + "%";
    s.style.setProperty("--dur", (2 + Math.random() * 4) + "s");
    s.style.setProperty("--max", (0.3 + Math.random() * 0.7).toString());
    s.style.animationDelay = (Math.random() * 5) + "s";
    frag.appendChild(s);
  }
  dom.starfield.appendChild(frag);
})();

// ---------- Status helpers ----------
function setStatus(kind, text) {
  dom.dot.className = "dot " + kind;
  dom.statusText.textContent = text;
}
function showOverlay(text) {
  dom.overlayText.textContent = text;
  dom.overlay.classList.add("on");
}
function hideOverlay() { dom.overlay.classList.remove("on"); }

// ---------- Import libraries (with dynamic fallback) ----------
async function loadEpoxy() {
  try {
    const mod = await import("@mercuryworkshop/epoxy-transport");
    return mod.EpoxyClient || mod.default;
  } catch (e) {
    console.warn("[Nexus] epoxy import failed:", e);
    return null;
  }
}
async function loadLibcurl() {
  try {
    const mod = await import("@mercuryworkshop/libcurl-transport");
    return mod.LibcurlClient || mod.default;
  } catch (e) {
    console.warn("[Nexus] libcurl import failed:", e);
    return null;
  }
}

// ---------- Relay discovery ----------
async function discoverRelays() {
  for (const src of CONFIG.relaySources) {
    try {
      const r = await fetch(src, { signal: AbortSignal.timeout(5000) });
      if (!r.ok) continue;
      const data = await r.json();
      let list = [];
      if (Array.isArray(data)) list = data;
      else if (data && typeof data === "object") {
        list = data.servers || data.relays || data.wisp || [];
      }
      const urls = list
        .map(x => typeof x === "string" ? x : (x && (x.url || x.wisp)))
        .filter(u => typeof u === "string" && (u.startsWith("wss://") || u.startsWith("ws://")));
      if (urls.length) return urls;
    } catch (e) {
      console.warn("[Nexus] relay source failed:", src, e.message);
    }
  }
  return CONFIG.fallbackRelays;
}

// ---------- Transport bootstrap ----------
async function testClient(client) {
  if (!client || typeof client.fetch !== "function") return false;
  try {
    const res = await Promise.race([
      client.fetch("https://www.google.com/generate_204", { method: "GET" }),
      new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), CONFIG.timeout))
    ]);
    return !!(res && (res.ok || res.status === 204 || res.status === 200 || res.status === 302));
  } catch (e) {
    console.warn("[Nexus] test failed:", e.message);
    return false;
  }
}

async function tryRelay(url, EpoxyClient, LibcurlClient) {
  // 1) try Epoxy
  if (EpoxyClient) {
    try {
      setStatus("loading", "epoxy: " + shortWisp(url));
      const client = new EpoxyClient({ wisp: url });
      if (await testClient(client)) {
        return { client, transport: "epoxy" };
      }
    } catch (e) {
      console.warn("[Nexus] epoxy connect failed for", url, e.message);
    }
  }
  // 2) fallback to libcurl
  if (LibcurlClient) {
    try {
      setStatus("loading", "libcurl: " + shortWisp(url));
      const client = new LibcurlClient({ websocket: url });
      if (await testClient(client)) {
        return { client, transport: "libcurl" };
      }
    } catch (e) {
      console.warn("[Nexus] libcurl connect failed for", url, e.message);
    }
  }
  return null;
}

function shortWisp(u) {
  try { return new URL(u).host; } catch { return u; }
}

async function boot() {
  showOverlay("Loading transport libraries...");

  const [EpoxyClient, LibcurlClient] = await Promise.all([loadEpoxy(), loadLibcurl()]);

  if (!EpoxyClient && !LibcurlClient) {
    setStatus("error", "no transport libraries loaded");
    hideOverlay();
    return;
  }

  showOverlay("Discovering relays...");
  setStatus("loading", "discovering relays...");
  const relays = await discoverRelays();

  for (let i = 0; i < relays.length; i++) {
    const r = relays[i];
    showOverlay(`Trying relay ${i + 1}/${relays.length}\n${shortWisp(r)}`);
    const result = await tryRelay(r, EpoxyClient, LibcurlClient);
    if (result) {
      state.relay = r;
      state.transport = result.transport;
      if (result.transport === "epoxy") state.epoxy = result.client;
      else state.libcurl = result.client;
      state.ready = true;

      setStatus("ready", `connected via ${result.transport} • ${shortWisp(r)}`);
      hideOverlay();
      dom.search.focus();
      console.log("[Nexus] ready", { relay: r, transport: result.transport });
      return;
    }
  }

  setStatus("error", "all relays failed — check console");
  hideOverlay();
}

// ---------- Proxy fetch ----------
async function pfetch(url) {
  const client = state.epoxy || state.libcurl;
  if (!client) throw new Error("no transport ready");
  return client.fetch(url);
}
window.__nexusFetch = pfetch;

// ---------- HTML rewriting ----------
function rewriteHtml(html, baseUrl) {
  const inject = `
<script>
(function(){
  var BASE = ${JSON.stringify(baseUrl)};
  var abs = function(u){ try { return new URL(u, BASE).href; } catch(e){ return u; } };

  // fetch
  var of = window.fetch;
  window.fetch = function(input, init){
    var url = typeof input === "string" ? input : (input && input.url);
    url = abs(url);
    if (window.parent && window.parent.__nexusFetch) return window.parent.__nexusFetch(url);
    return of.call(this, url, init);
  };

  // XHR
  var OX = window.XMLHttpRequest;
  window.XMLHttpRequest = function(){
    var x = new OX();
    var oo = x.open;
    x.open = function(m, u){ return oo.call(this, m, abs(u), arguments[2], arguments[3], arguments[4]); };
    return x;
  };
})();
<\/script>`;
  if (/<head[^>]*>/i.test(html)) return html.replace(/<head[^>]*>/i, m => m + inject);
  if (/<html[^>]*>/i.test(html)) return html.replace(/<html[^>]*>/i, m => m + "<head>" + inject + "</head>");
  return inject + html;
}

// ---------- Navigation ----------
function normalizeUrl(input) {
  input = input.trim();
  if (!input) return null;
  if (/^https?:\/\//i.test(input)) return input;
  // looks like a domain?
  if (/^[^\s]+\.[^\s]{2,}/.test(input) && !input.includes(" ")) return "https://" + input;
  return "https://duckduckgo.com/?q=" + encodeURIComponent(input);
}

async function navigate(rawUrl) {
  if (!state.ready) { setStatus("error", "not connected"); return; }
  const url = normalizeUrl(rawUrl);
  if (!url) return;

  showOverlay("Loading " + url);
  setStatus("loading", "fetching " + shortWisp(url));

  try {
    const res = await pfetch(url);
    const text = await res.text();
    const rewritten = rewriteHtml(text, url);
    const blob = new Blob([rewritten], { type: "text/html" });
    const blobUrl = URL.createObjectURL(blob);

    dom.bFrame.src = blobUrl;
    dom.bUrl.value = url;

    state.history = state.history.slice(0, state.hIndex + 1);
    state.history.push(url);
    state.hIndex = state.history.length - 1;

    dom.main.classList.add("hidden");
    dom.browser.classList.add("on");

    setStatus("ready", `connected via ${state.transport} • ${shortWisp(state.relay)}`);
    hideOverlay();
  } catch (e) {
    console.error("[Nexus] nav error:", e);
    setStatus("error", "fetch failed: " + e.message);
    hideOverlay();
    const err = `<!doctype html><html><body style="background:#0a0a0f;color:#f87171;font-family:system-ui;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;text-align:center;padding:20px"><div><h2 style="font-weight:400">Failed to load</h2><p style="color:#888;font-size:14px;margin-top:8px">${(e.message||"").replace(/</g,"&lt;")}</p></div></body></html>`;
    dom.bFrame.src = "data:text/html;charset=utf-8," + encodeURIComponent(err);
    dom.main.classList.add("hidden");
    dom.browser.classList.add("on");
  }
}

// ---------- UI events ----------
dom.search.addEventListener("keydown", e => {
  if (e.key === "Enter") {
    const v = dom.search.value.trim();
    if (v) navigate(v);
  }
});

dom.apps.addEventListener("click", e => {
  const btn = e.target.closest(".app");
  if (btn && btn.dataset.url) navigate(btn.dataset.url);
});

dom.bBack.addEventListener("click", () => {
  if (state.hIndex > 0) {
    state.hIndex--;
    navigate(state.history[state.hIndex]);
  }
});
dom.bRefresh.addEventListener("click", () => {
  if (state.hIndex >= 0) navigate(state.history[state.hIndex]);
});
dom.bGo.addEventListener("click", () => {
  const v = dom.bUrl.value.trim();
  if (v) navigate(v);
});
dom.bUrl.addEventListener("keydown", e => {
  if (e.key === "Enter") { const v = dom.bUrl.value.trim(); if (v) navigate(v); }
});

function goHome() {
  dom.main.classList.remove("hidden");
  dom.browser.classList.remove("on");
  dom.bFrame.src = "about:blank";
  dom.bUrl.value = "";
  dom.search.value = "";
  state.history = [];
  state.hIndex = -1;
  dom.search.focus();
}
dom.navHome.addEventListener("click", goHome);
dom.navDiscord.addEventListener("click", () => navigate("https://discord.com"));

document.addEventListener("keydown", e => {
  if (e.key === "Escape") goHome();
});

// ---------- Go ----------
boot().catch(e => {
  console.error("[Nexus] boot failure:", e);
  setStatus("error", "boot failed: " + e.message);
  hideOverlay();
});
</script>
</body>
</html>
