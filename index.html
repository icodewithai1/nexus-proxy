<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nexus — libcurl.js Browser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:wght@300;400;500;600;700&display=swap">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%2322d3ee'/><stop offset='1' stop-color='%236366f1'/></linearGradient></defs><path d='M16 2l12 7v14l-12 7L4 23V9z' fill='url(%23g)'/><path d='M11 21.5V10.5l10 11V10.5' stroke='white' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<style>
/* ══════════════════════════════════════════════════════════════
   Hyperion — PS5-inspired UI
   deep space blue · frosted glass · rounded tiles · white focus
   ══════════════════════════════════════════════════════════════ */
:root {
  --font: "Saira", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: ui-monospace, "Cascadia Code", Menlo, Consolas, monospace;
  --bg0: #04060f;
  --bg1: #0a0e1d;
  --glass: rgba(255, 255, 255, 0.055);
  --glass2: rgba(255, 255, 255, 0.09);
  --line: rgba(255, 255, 255, 0.10);
  --line2: rgba(255, 255, 255, 0.18);
  --txt: #eef2ff;
  --dim: #97a1c0;
  --dim2: #5d6688;
  --acc: #2f7dff;
  --acc2: #6aa4ff;
  --ok: #3ddc84;
  --warn: #ffb02e;
  --err: #ff5d6c;
  --r: 12px;
  --sidebar-w: 236px;
  --tab-h: 46px;
  --bar-h: 54px;
  --bm-h: 42px;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--font);
  font-weight: 400;
  color: var(--txt);
  background: var(--bg0);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* aurora backdrop — PS5 home wash */
body::before, body::after {
  content: "";
  position: fixed;
  inset: -30%;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(38% 42% at 18% 22%, rgba(47, 125, 255, 0.20), transparent 70%),
    radial-gradient(30% 36% at 82% 14%, rgba(122, 92, 255, 0.16), transparent 70%),
    radial-gradient(42% 40% at 68% 86%, rgba(0, 168, 255, 0.10), transparent 70%);
  filter: blur(10px);
  animation: aurora 26s ease-in-out infinite alternate;
}
body::after {
  background:
    radial-gradient(26% 30% at 60% 30%, rgba(0, 196, 255, 0.10), transparent 70%),
    radial-gradient(34% 34% at 24% 78%, rgba(88, 76, 255, 0.14), transparent 70%);
  animation-duration: 34s;
  animation-direction: alternate-reverse;
}
@keyframes aurora {
  from { transform: translate3d(-3%, -2%, 0) scale(1); }
  to   { transform: translate3d(3%, 2%, 0) scale(1.08); }
}

.ico { width: 18px; height: 18px; flex: none; }
.ico.sm { width: 14px; height: 14px; }
.ico.lg { width: 44px; height: 44px; stroke-width: 1.4; }

#app {
  position: relative;
  z-index: 1;
  display: flex;
  height: 100vh;
}

/* ─────────────────────────── sidebar ─────────────────────────── */
#sidebar {
  width: var(--sidebar-w);
  flex: none;
  display: flex;
  flex-direction: column;
  padding: 18px 14px 14px;
  background: linear-gradient(180deg, rgba(10, 14, 29, 0.88), rgba(6, 8, 18, 0.92));
  border-right: 1px solid var(--line);
  backdrop-filter: blur(22px);
  gap: 18px;
}

#brand { display: flex; align-items: center; gap: 11px; padding: 4px 8px 0; }
.brand-mark { width: 34px; height: 34px; filter: drop-shadow(0 4px 14px rgba(47, 125, 255, 0.45)); }
.brand-name {
  font-weight: 700;
  font-size: 17px;
  letter-spacing: 0.18em;
  background: linear-gradient(90deg, #fff, #9cc2ff);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

#side-nav { display: flex; flex-direction: column; gap: 4px; }
.nav-item {
  display: flex; align-items: center; gap: 12px;
  padding: 11px 12px;
  border: 1px solid transparent;
  border-radius: 10px;
  background: transparent;
  color: var(--dim);
  font: 500 14.5px var(--font);
  letter-spacing: 0.02em;
  cursor: pointer;
  transition: background 0.15s, color 0.15s, border-color 0.15s, transform 0.15s;
}
.nav-item:hover { background: var(--glass); color: var(--txt); }
.nav-item:active { transform: scale(0.975); }
.nav-item.active, .nav-item:focus-visible {
  background: linear-gradient(90deg, rgba(47, 125, 255, 0.22), rgba(47, 125, 255, 0.06));
  border-color: rgba(106, 164, 255, 0.45);
  color: #fff;
  outline: none;
  box-shadow: 0 0 0 1px rgba(47, 125, 255, 0.25), 0 6px 18px -8px rgba(47, 125, 255, 0.5);
}

#side-status {
  margin-top: auto;
  display: flex;
  flex-direction: column;
  gap: 7px;
  padding-top: 12px;
  border-top: 1px solid var(--line);
}
.status-chip {
  display: flex; align-items: center; gap: 8px;
  font-size: 12px;
  font-weight: 500;
  color: var(--dim);
  padding: 5px 9px;
  border-radius: 8px;
  background: var(--glass);
  border: 1px solid var(--line);
  white-space: normal;
  overflow: visible;
  line-height: 1.35;
}
.status-chip.dim { background: transparent; border-color: transparent; padding-left: 2px; }
.dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--dim2, #5d6688);
  flex: none;
  box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.06);
}
.dot.ok { background: var(--ok); box-shadow: 0 0 8px rgba(61, 220, 132, 0.7); }
.dot.bad { background: var(--err); box-shadow: 0 0 8px rgba(255, 93, 108, 0.6); }
.dot.wait { background: var(--warn); animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.35; } }

#engine-select-wrap {
  position: relative;
  display: flex; align-items: center; gap: 7px;
  padding: 7px 9px;
  border-radius: 8px;
  background: var(--glass);
  border: 1px solid var(--line);
  color: var(--dim);
}
#engine-select-wrap .ico { width: 14px; height: 14px; color: var(--acc2); }
#engine-select-wrap .ico:last-child { position: absolute; right: 8px; pointer-events: none; width: 13px; }
#engine-select {
  appearance: none;
  background: transparent;
  border: 0;
  color: var(--txt);
  font: 500 12.5px var(--font);
  width: 100%;
  cursor: pointer;
  outline: none;
  padding-right: 14px;
}
#engine-select option { background: var(--bg1); color: var(--txt); }
#st-url {
  font-size: 11px;
  color: var(--dim);
  opacity: 0.75;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  padding: 0 2px;
}

/* ─────────────────────────── main ────────────────────────────── */
#main { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }

/* tabs (PS5 top row) */
#tabstrip {
  height: var(--tab-h);
  display: flex; align-items: center; gap: 8px;
  padding: 0 12px;
  border-bottom: 1px solid var(--line);
  background: rgba(6, 8, 18, 0.5);
  backdrop-filter: blur(14px);
}
#tabs { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; flex: 1; align-items: center; height: 100%; }
#tabs::-webkit-scrollbar { display: none; }
.tab {
  display: flex; align-items: center; gap: 8px;
  height: 32px;
  max-width: 220px;
  padding: 0 10px 0 12px;
  border-radius: 16px;
  border: 1.5px solid transparent;
  background: var(--glass);
  color: var(--dim);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  flex: none;
  transition: background 0.15s, color 0.15s, border-color 0.15s, transform 0.12s;
}
.tab:hover { background: var(--glass2); color: var(--txt); }
.tab.active {
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0.07));
  border-color: rgba(255, 255, 255, 0.85);
  color: #fff;
  box-shadow: 0 0 14px -4px rgba(255, 255, 255, 0.45);
}
.tab.loading .favicon { animation: pulse 0.9s ease-in-out infinite; }
.tab .favicon { width: 16px; height: 16px; border-radius: 4px; object-fit: contain; display: flex; color: var(--dim2, #667); }
.tab .favicon svg { width: 16px; height: 16px; }
.tab-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tab-close {
  display: flex; align-items: center; justify-content: center;
  width: 18px; height: 18px; border-radius: 50%;
  opacity: 0;
  transition: opacity 0.12s, background 0.12s;
}
.tab:hover .tab-close, .tab.active .tab-close { opacity: 0.7; }
.tab-close:hover { background: rgba(255, 255, 255, 0.18); opacity: 1; }
.tab-close svg { width: 12px; height: 12px; }

/* toolbar */
#toolbar {
  height: var(--bar-h);
  display: flex; align-items: center; gap: 8px;
  padding: 0 14px;
  border-bottom: 1px solid var(--line);
  background: rgba(6, 8, 18, 0.35);
}
.iconbtn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 36px; height: 36px;
  border-radius: 10px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--dim);
  cursor: pointer;
  transition: background 0.14s, color 0.14s, transform 0.1s, border-color 0.14s;
}
.iconbtn:hover { background: var(--glass2); color: var(--txt); border-color: var(--line); }
.iconbtn:active { transform: scale(0.93); }
.iconbtn:disabled { opacity: 0.32; pointer-events: none; }
.iconbtn.on { color: #ffd75e; }
.iconbtn.on svg { fill: currentColor; }

#omni-wrap {
  flex: 1;
  display: flex; align-items: center; gap: 10px;
  height: 40px;
  margin: 0 6px;
  padding: 0 6px 0 14px;
  border-radius: 20px;
  background: rgba(255, 255, 255, 0.07);
  border: 1.5px solid var(--line);
  transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
  max-width: 860px;
}
#omni-wrap:focus-within {
  border-color: rgba(255, 255, 255, 0.85);
  background: rgba(255, 255, 255, 0.10);
  box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.12), 0 8px 24px -12px rgba(47, 125, 255, 0.6);
}
#engine-badge {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 11px; font-weight: 600;
  letter-spacing: 0.04em;
  color: var(--acc2);
  background: rgba(47, 125, 255, 0.16);
  border: 1px solid rgba(106, 164, 255, 0.35);
  padding: 3px 9px;
  border-radius: 12px;
  white-space: nowrap;
  flex: none;
}
#engine-badge.relay { color: #9ef0c0; background: rgba(61, 220, 132, 0.12); border-color: rgba(61, 220, 132, 0.35); }
#engine-badge.dim { color: var(--dim); background: transparent; border-color: var(--line); }
#engine-badge.err { color: var(--err); background: rgba(255, 93, 108, 0.12); border-color: rgba(255, 93, 108, 0.4); }
#omni {
  flex: 1; min-width: 0;
  background: transparent; border: 0; outline: none;
  color: var(--txt);
  font: 400 14.5px var(--font);
  letter-spacing: 0.01em;
}
#omni::placeholder { color: var(--dim); opacity: 0.75; }
#btn-go.go { border-radius: 50%; width: 32px; height: 32px; background: rgba(255, 255, 255, 0.10); }

/* pinned sites */
#bookmarkbar {
  height: var(--bm-h);
  display: flex; align-items: center; gap: 8px;
  padding: 0 14px;
  overflow-x: auto;
  scrollbar-width: none;
  border-bottom: 1px solid var(--line);
  background: rgba(6, 8, 18, 0.25);
}
#bookmarkbar::-webkit-scrollbar { display: none; }
.bm-chip {
  display: flex; align-items: center; gap: 8px;
  height: 28px;
  padding: 0 11px 0 7px;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: var(--glass);
  color: var(--dim);
  font: 500 12.5px var(--font);
  cursor: pointer;
  flex: none;
  max-width: 200px;
  transition: background 0.14s, color 0.14s, border-color 0.14s, transform 0.12s;
}
.bm-chip:hover { background: var(--glass2); color: var(--txt); border-color: var(--line2); transform: translateY(-1px); }
.bm-fav {
  position: relative;
  width: 17px; height: 17px; border-radius: 4px;
  background: rgba(255, 255, 255, 0.10);
  display: flex; align-items: center; justify-content: center;
  overflow: hidden; flex: none;
}
.bm-fav img { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 13px; height: 13px; object-fit: contain; }
.bm-fav svg { width: 12px; height: 12px; color: var(--dim); }
.bm-chip > span:nth-child(2) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bm-chip .x {
  display: flex; align-items: center; justify-content: center;
  width: 16px; height: 16px; border-radius: 50%;
  opacity: 0; flex: none;
}
.bm-chip:hover .x { opacity: 0.7; }
.bm-chip .x:hover { background: rgba(255, 93, 108, 0.35); opacity: 1; }
.bm-chip .x svg { width: 11px; height: 11px; }

/* viewport + overlays */
#viewport { flex: 1; position: relative; min-height: 0; padding: 12px; }
#viewport iframe {
  width: 100%; height: 100%;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: #0b0e18;
  box-shadow: 0 18px 50px -22px rgba(0, 0, 0, 0.9);
}
.overlay {
  position: absolute; inset: 12px;
  z-index: 5;
  border-radius: 14px;
  overflow: auto;
  background:
    linear-gradient(180deg, rgba(7, 10, 22, 0.92), rgba(4, 6, 15, 0.96));
  display: none;
}
.overlay.show { display: block; }

/* start page — PS5 dashboard */
.start { padding: 46px 52px 40px; min-height: 100%; }
.start-hero { margin-bottom: 34px; }
.start h1 {
  margin: 0;
  font-size: 44px;
  font-weight: 700;
  letter-spacing: 0.14em;
  background: linear-gradient(90deg, #ffffff 20%, #7fb0ff 90%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.start .hero-sub {
  display: block;
  margin-top: 6px;
  color: var(--acc2);
  font-size: 13.5px;
  font-weight: 600;
  letter-spacing: 0.22em;
  text-transform: uppercase;
}
.start .sub {
  margin-top: 14px;
  max-width: 560px;
  color: var(--dim);
  font-size: 15px;
  line-height: 1.55;
}
.start .sub b { color: var(--txt); font-weight: 600; }

.tiles {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(138px, 1fr));
  gap: 18px;
  max-width: 980px;
}
.tile {
  position: relative;
  aspect-ratio: 1 / 1;
  border-radius: 16px;
  border: 2px solid transparent;
  background:
    radial-gradient(120% 100% at 20% 0%, rgba(47, 125, 255, 0.28), transparent 60%),
    linear-gradient(160deg, #131a30, #0b0f1f 70%);
  color: var(--txt);
  cursor: pointer;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 12px;
  padding: 14px;
  transition: transform 0.16s ease, border-color 0.16s, box-shadow 0.16s;
  overflow: hidden;
}
.tile:hover, .tile:focus-visible {
  transform: translateY(-5px) scale(1.03);
  border-color: #fff;
  outline: none;
  box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.18), 0 16px 34px -14px rgba(47, 125, 255, 0.65);
}
.t-art {
  width: 62px; height: 62px;
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.92);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 8px 22px -8px rgba(0, 0, 0, 0.8);
}
.t-art { position: relative; }
.t-art img { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 40px; height: 40px; object-fit: contain; }
.t-art svg { width: 34px; height: 34px; color: #45507a; }
.t-name { font-size: 13.5px; font-weight: 600; letter-spacing: 0.03em; }
.t-url { display: none; }

.start .cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 16px;
  max-width: 980px;
  margin-top: 34px;
}
.card {
  background: rgba(255, 255, 255, 0.055);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 16px 18px;
  backdrop-filter: blur(16px);
}
.card h3 {
  margin: 0 0 10px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--acc2);
}
.card p { margin: 5px 0; font-size: 13px; color: var(--dim); line-height: 1.5; }
.card kbd {
  display: inline-block;
  font: 600 11px var(--font);
  color: var(--txt);
  background: rgba(255, 255, 255, 0.10);
  border: 1px solid var(--line2);
  border-bottom-width: 2px;
  border-radius: 6px;
  padding: 1px 7px;
  margin: 0 2px;
}

/* error page */
.errpage {
  min-height: 100%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center;
  padding: 40px;
  gap: 4px;
}
.errpage .big { color: var(--acc2); margin-bottom: 10px; }
.errpage h2 { margin: 0; font-size: 24px; font-weight: 600; letter-spacing: 0.04em; }
.errpage p { margin: 6px 0; color: var(--dim); font-size: 13.5px; max-width: 560px; word-break: break-all; }
.errpage .row { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; justify-content: center; }
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  font: 600 13.5px var(--font);
  letter-spacing: 0.03em;
  color: var(--txt);
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid var(--line2);
  border-radius: 22px;
  padding: 9px 20px;
  cursor: pointer;
  transition: transform 0.12s, background 0.14s, box-shadow 0.14s;
}
.btn:hover { background: rgba(255, 255, 255, 0.14); transform: translateY(-1px); }
.btn.primary {
  background: linear-gradient(180deg, #ffffff, #e8efff);
  color: #0a3ea8;
  border-color: transparent;
  box-shadow: 0 10px 26px -12px rgba(120, 170, 255, 0.8);
}
.btn.primary:hover { box-shadow: 0 14px 30px -12px rgba(120, 170, 255, 0.95); }
.btn .ico { width: 15px; height: 15px; }

/* ─────────────────────────── devtools ────────────────────────── */
#devtools {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: min(44vh, 360px);
  z-index: 30;
  display: flex; flex-direction: column;
  background: rgba(7, 9, 20, 0.97);
  border-top: 1px solid var(--line2);
  backdrop-filter: blur(20px);
  box-shadow: 0 -18px 44px -20px rgba(0, 0, 0, 0.9);
  border-radius: 14px 14px 0 0;
}
#devtools.hidden { display: none; }
#dev-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 12px;
  border-bottom: 1px solid var(--line);
  flex: none;
}
#dev-tabs { display: flex; gap: 6px; }
.dev-tab {
  font: 600 12.5px var(--font);
  letter-spacing: 0.06em;
  color: var(--dim);
  background: transparent;
  border: 1px solid transparent;
  border-radius: 8px;
  padding: 6px 14px;
  cursor: pointer;
  transition: color 0.14s, background 0.14s, border-color 0.14s;
}
.dev-tab:hover { color: var(--txt); background: var(--glass); }
.dev-tab.active {
  color: #fff;
  background: rgba(47, 125, 255, 0.20);
  border-color: rgba(106, 164, 255, 0.5);
}
.dev-head-actions { display: flex; gap: 6px; align-items: center; }
.mini {
  font: 600 11.5px var(--font);
  color: var(--dim);
  background: var(--glass);
  border: 1px solid var(--line);
  border-radius: 7px;
  padding: 5px 11px;
  cursor: pointer;
  transition: color 0.14s, background 0.14s;
}
.mini:hover { color: var(--txt); background: var(--glass2); }
.mini.icon { display: inline-flex; align-items: center; justify-content: center; padding: 5px 7px; }
.mini.icon svg { width: 13px; height: 13px; }
#dev-body { flex: 1; min-height: 0; position: relative; }
.dev-pane { position: absolute; inset: 0; display: none; overflow: auto; }
.dev-pane.active { display: block; }

#console-lines { padding: 10px 14px; font: 12.5px/1.6 var(--mono); }
.cline { display: flex; gap: 10px; padding: 2px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.04); }
.cline .csrc { color: var(--dim2, #5d6688); margin-left: auto; font-size: 11px; flex: none; }
.cline.log { color: #cfe0ff; }
.cline.debug { color: var(--dim); }
.cline.warn { color: var(--warn); }
.cline.error { color: var(--err); }
.cline.input { color: var(--acc2); }
#console-input-row {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px;
  border-top: 1px solid var(--line);
  position: sticky; bottom: 0;
  background: rgba(7, 9, 20, 0.98);
}
#console-input-row .prompt { color: var(--acc2); font: 600 15px var(--mono); }
#console-input {
  flex: 1;
  background: transparent; border: 0; outline: none;
  color: var(--txt);
  font: 12.5px var(--mono);
}

#net-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
#net-table th {
  text-align: left;
  position: sticky; top: 0;
  background: #0a0d1c;
  color: var(--dim);
  font-weight: 600;
  letter-spacing: 0.08em;
  font-size: 11px;
  text-transform: uppercase;
  padding: 8px 12px;
  border-bottom: 1px solid var(--line);
  z-index: 1;
}
#net-table td { padding: 6px 12px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); color: #c9d4f2; }
#net-table tr:hover td { background: rgba(255, 255, 255, 0.04); }
#net-table .rtype {
  font: 700 9.5px var(--font);
  letter-spacing: 0.1em;
  color: var(--acc2);
  background: rgba(47, 125, 255, 0.14);
  border: 1px solid rgba(106, 164, 255, 0.3);
  padding: 2px 6px;
  border-radius: 5px;
}
.st-2 { color: var(--ok); }
.st-3 { color: var(--acc2); }
.st-4 { color: var(--warn); }
.st-5, .st-0 { color: var(--err); }
.eng-libcurl { color: #8fd0ff; }
.eng-relay { color: #9ef0c0; }
.eng-public { color: #ffd75e; }

#dev-source, #source-view { margin: 0; padding: 14px 16px; font: 12px/1.6 var(--mono); color: #cfe0ff; }

/* ─────────────────────────── library ─────────────────────────── */
#library {
  position: absolute;
  top: calc(var(--tab-h) + var(--bar-h) + var(--bm-h));
  right: 0; bottom: 0;
  width: 340px;
  z-index: 25;
  background: rgba(8, 10, 22, 0.97);
  border-left: 1px solid var(--line2);
  backdrop-filter: blur(20px);
  display: flex; flex-direction: column;
  box-shadow: -20px 0 44px -24px rgba(0, 0, 0, 0.9);
}
#library.hidden { display: none; }
#library-head {
  display: flex; align-items: center; gap: 8px;
  padding: 12px 14px;
  border-bottom: 1px solid var(--line);
}
.lib-tab {
  font: 600 13px var(--font);
  color: var(--dim);
  background: transparent;
  border: 1px solid transparent;
  border-radius: 8px;
  padding: 7px 14px;
  cursor: pointer;
}
.lib-tab.active {
  color: #fff;
  background: rgba(47, 125, 255, 0.20);
  border-color: rgba(106, 164, 255, 0.5);
}
#library-head .mini { margin-left: auto; }
#library-body { flex: 1; overflow: auto; padding: 8px; }
.lib-empty { color: var(--dim); font-size: 13px; padding: 20px 14px; }
.lib-item {
  padding: 10px 12px;
  border-radius: 10px;
  cursor: pointer;
  border: 1px solid transparent;
  transition: background 0.13s, border-color 0.13s;
}
.lib-item:hover { background: var(--glass); border-color: var(--line); }
.li-title { display: flex; align-items: center; gap: 9px; font-size: 13.5px; font-weight: 500; color: var(--txt); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li-url { font-size: 11.5px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
.li-date { font-size: 10.5px; color: var(--dim2, #5d6688); margin-top: 3px; opacity: 0.8; }

/* ─────────────────────────── toasts ──────────────────────────── */
#toasts {
  position: absolute;
  right: 16px; bottom: 16px;
  z-index: 60;
  display: flex; flex-direction: column; gap: 8px;
  pointer-events: none;
}
.toast {
  background: rgba(14, 18, 36, 0.96);
  border: 1px solid var(--line2);
  border-left: 3px solid var(--acc);
  color: var(--txt);
  font-size: 13px;
  padding: 10px 16px;
  border-radius: 10px;
  max-width: 380px;
  box-shadow: 0 16px 40px -16px rgba(0, 0, 0, 0.9);
  animation: toast-in 0.22s ease;
}
.toast.err { border-left-color: var(--err); }
@keyframes toast-in { from { transform: translateX(24px); opacity: 0; } }

/* scrollbars */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.14); border-radius: 6px; border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.26); background-clip: padding-box; }
::-webkit-scrollbar-track { background: transparent; }

::selection { background: rgba(47, 125, 255, 0.45); }


/* settings modal */
#settings {
  position: absolute; inset: 0; z-index: 70;
  background: rgba(2, 4, 10, 0.72);
  backdrop-filter: blur(8px);
  display: flex; align-items: center; justify-content: center;
}
#settings.hidden { display: none; }
.settings-card {
  width: min(460px, calc(100% - 48px));
  background: rgba(12, 16, 32, 0.98);
  border: 1px solid var(--line2);
  border-radius: 16px;
  padding: 18px 20px 20px;
  box-shadow: 0 30px 80px -30px rgba(0, 0, 0, 0.95);
}
#settings-head {
  display: flex; align-items: center; justify-content: space-between;
  font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
  font-size: 13px; color: var(--acc2);
  margin-bottom: 14px;
}
.set-row { display: flex; flex-direction: column; gap: 7px; padding: 11px 0; border-top: 1px solid var(--line); }
.set-row label { font-size: 12.5px; font-weight: 600; color: var(--dim); letter-spacing: 0.05em; }
.set-row small { font-size: 11px; color: #5d6688; }
.set-line { display: flex; gap: 8px; }
.set-line input {
  flex: 1; min-width: 0;
  background: rgba(255,255,255,0.07);
  border: 1px solid var(--line);
  border-radius: 8px;
  color: var(--txt);
  font: 13px var(--mono);
  padding: 8px 11px;
  outline: none;
}
.set-line input:focus { border-color: rgba(255,255,255,0.6); }
#set-ua {
  appearance: none;
  background: rgba(255,255,255,0.07);
  border: 1px solid var(--line);
  border-radius: 8px;
  color: var(--txt);
  font: 13px var(--font);
  padding: 8px 11px;
  outline: none;
}
#set-ua option { background: #0a0e1d; }
.iconbtn.side { width: 30px; height: 30px; margin-left: auto; }

html, body { width:100%; height:100%; }
body { background:#202227; font-family:var(--font); color:var(--txt); }
body::before, body::after { display:none; }
#app { display:flex; height:100vh; width:100vw; background:#202227; }
#sidebar { display:none !important; }
#main {
  position:relative; isolation:isolate; flex:1; min-width:0; height:100vh;
  display:flex; flex-direction:column; overflow:hidden;
  background-color:#707176;
  background-image:
    linear-gradient(90deg,rgba(21,23,27,.42) 0%,rgba(25,27,31,.20) 38%,rgba(255,255,255,.04) 100%),
    linear-gradient(0deg,rgba(18,20,24,.46) 0%,rgba(18,20,24,.06) 42%,rgba(18,20,24,.12) 100%),
    var(--hero-image);
  background-size:cover;
  background-position:center center;
}
#main::before { content:none; }

/* Quiet console-style top navigation */
#ps-header {
  height:9vh; min-height:58px; flex:none; z-index:12; position:relative;
  display:flex; align-items:center; justify-content:space-between;
  padding:0 4.6vw 0 4.8vw;
  color:#f4f5f7;
}
.ps-sections { display:flex; align-items:center; gap:4.2vw; height:100%; }
.ps-section {
  border:0; background:none; padding:8px 0; color:rgba(245,247,250,.60);
  font:300 clamp(20px,1.78vw,32px)/1 var(--font); letter-spacing:-.035em;
  cursor:pointer; transition:color .18s, opacity .18s;
}
.ps-section:hover { color:#fff; }
.ps-section.active { color:#fff; font-weight:600; }
.ps-actions { display:flex; align-items:center; gap:2.65vw; height:100%; }
.ps-action, .ps-profile {
  position:relative; flex:none; display:inline-flex; align-items:center; justify-content:center;
  width:2.55vw; height:2.55vw; min-width:30px; min-height:30px; max-width:46px; max-height:46px;
  padding:0; border:0; background:transparent; color:rgba(255,255,255,.90); cursor:pointer;
}
.ps-action svg { width:72%; height:72%; }
.ps-action:hover { color:#fff; transform:scale(1.06); }
.ps-profile { width:2.9vw; height:2.9vw; min-width:34px; min-height:34px; margin-left:.1vw; }
.ps-avatar {
  width:76%; height:76%; border-radius:50%; display:grid; place-items:center; overflow:hidden;
  color:#f6f7f8; background:radial-gradient(circle at 32% 24%,#a5a7aa 0,#55575b 22%,#141518 63%,#08090b 100%);
  border:2px solid rgba(255,255,255,.72); box-shadow:0 1px 5px rgba(0,0,0,.65);
}
.ps-avatar svg { width:78%; height:78%; }
.ps-online { position:absolute; width:10px; height:10px; right:0; bottom:1px; border-radius:50%; background:#3cdb88; border:1.5px solid #242629; box-shadow:0 0 7px rgba(60,219,136,.45); }
#ps-clock { margin-left:.1vw; min-width:6.8vw; color:rgba(245,247,250,.86); font-size:clamp(18px,1.78vw,32px); font-weight:300; letter-spacing:.005em; white-space:nowrap; }

/* Horizontal app rail; selected Nexus tile carries the custom hex-N mark. */
#ps-tiles {
  height:19.5vh; min-height:130px; flex:none; position:relative; z-index:11;
  display:flex; align-items:flex-start; gap:.58vw;
  padding:2vh 2.6vw 0; overflow-x:auto; overflow-y:visible; scrollbar-width:none;
}
#ps-tiles::-webkit-scrollbar { display:none; }
.ps-app {
  position:relative; flex:none; display:grid; place-items:center;
  width:10vh; height:10vh; min-width:70px; min-height:70px; max-width:108px; max-height:108px;
  margin-top:.12vh; padding:0; overflow:hidden; border:1px solid rgba(255,255,255,.08);
  border-radius:15px; color:#f6f8fb; background:#111216;
  box-shadow:0 7px 17px rgba(0,0,0,.24); cursor:pointer;
  transition:transform .18s ease, border-color .18s, box-shadow .18s;
}
.ps-app:hover { transform:translateY(-3px) scale(1.025); border-color:rgba(255,255,255,.58); box-shadow:0 10px 26px rgba(0,0,0,.35); }
.ps-app-icon { width:58%; height:58%; display:grid; place-items:center; position:relative; z-index:1; }
.ps-app-icon svg { width:100%; height:100%; fill:none; stroke:currentColor; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }
.ps-app-icon .solid { fill:currentColor; stroke:none; }
.art-plus { background:linear-gradient(145deg,#080b10,#171b22); }
.art-plus .ps-app-icon { color:#19bde8; }
.art-plusgold { background:linear-gradient(145deg,#090b11,#202126); }
.art-plusgold .ps-app-icon { color:#ffcf34; }
.art-plusgold .ps-app-icon svg { stroke-width:5; }
.art-discover { background:radial-gradient(ellipse at 25% 20%,#ffb4bd,transparent 45%),linear-gradient(140deg,#2d8de1,#6848cb 52%,#e74780); }
.art-discover .ps-app-icon { color:#fff; filter:drop-shadow(0 2px 4px rgba(0,0,0,.3)); }
.art-stories { background:radial-gradient(circle at 80% 15%,#e1b546,transparent 35%),linear-gradient(135deg,#327d67,#b97c36 50%,#6b4a2d); }
.art-stories .ps-app-icon { color:rgba(255,255,255,.9); }
.art-youtube { background:linear-gradient(145deg,#05b8ea,#0a67bd); }
.art-youtube .ps-app-icon { color:#fff; }
.art-tiktok { background:linear-gradient(135deg,#111318,#06070a); }
.art-tiktok .ps-app-icon { color:#f4f4f6; }
.art-community { background:linear-gradient(140deg,#d9534f,#93253d 58%,#27202b); }
.art-community .ps-app-icon { color:#fff; }
.art-code { background:linear-gradient(145deg,#1a1b1f,#07080b); }
.art-code .ps-app-icon { color:#f5f5f5; }
.art-video { background:linear-gradient(135deg,#1f2739,#11151d 70%); }
.art-video .ps-app-icon { color:#f2f3f5; }
.art-library { background:linear-gradient(135deg,#171920,#08090d); }
.art-library .ps-app-icon { color:#f5f6f8; }
.ps-selected-entry { position:relative; z-index:2; flex:none; width:17vh; height:17vh; min-width:120px; min-height:120px; max-width:180px; max-height:180px; margin-top:-.12vh; }
.ps-app.ps-selected {
  width:100%; height:100%; min-width:0; min-height:0; max-width:none; max-height:none; margin:0;
  border:2px solid rgba(255,255,255,.88); border-radius:19px;
  background:linear-gradient(145deg,rgba(25,27,32,.98),rgba(9,10,13,.98));
  box-shadow:0 0 0 2px rgba(255,255,255,.16),0 9px 28px rgba(0,0,0,.48),inset 0 1px 0 rgba(255,255,255,.22);
}
.ps-app.ps-selected:hover { transform:scale(1.035); }
.nexus-large-mark { width:52%; height:52%; fill:none; stroke:#fff; stroke-width:5; stroke-linecap:round; stroke-linejoin:round; filter:drop-shadow(0 2px 7px rgba(0,0,0,.55)); }
.nexus-large-mark path:first-child { stroke:rgba(255,255,255,.88); stroke-width:2.5; }
.ps-app-label { position:absolute; top:calc(100% + 7px); left:0; color:rgba(255,255,255,.93); font-size:clamp(16px,1.48vw,27px); font-weight:300; letter-spacing:-.025em; white-space:nowrap; text-shadow:0 1px 3px rgba(0,0,0,.55); }

/* The browser's actual address controls open from the search glyph or Ctrl+L. */
#tabstrip, #bookmarkbar { display:none !important; }
#toolbar {
  display:none !important; position:absolute; z-index:35; top:9.5vh; right:7vw;
  width:min(850px,86vw); height:58px; flex:none; gap:7px; padding:0 10px;
  border:1px solid rgba(255,255,255,.32); border-radius:15px;
  background:rgba(28,30,34,.96); box-shadow:0 18px 54px rgba(0,0,0,.36); backdrop-filter:blur(16px);
}
body.search-open #toolbar { display:flex !important; }
#toolbar .iconbtn { color:rgba(255,255,255,.8); border-radius:9px; }
#toolbar .iconbtn:hover { background:rgba(255,255,255,.1); color:#fff; }
#omni-wrap { flex:1; width:auto; max-width:none; height:42px; margin:0 3px; border-radius:10px; background:rgba(255,255,255,.09); border-color:rgba(255,255,255,.16); }
#omni-wrap:focus-within { border-color:rgba(255,255,255,.65); box-shadow:0 0 0 2px rgba(255,255,255,.10); }
#engine-badge { color:#fff; border-color:rgba(255,255,255,.20); background:rgba(255,255,255,.10); }
#omni { color:#fff; }
#omni::placeholder { color:rgba(255,255,255,.64); }
#ps-search { transition:color .16s, transform .16s; }
body.search-open #ps-search { color:#fff; filter:drop-shadow(0 0 8px rgba(255,255,255,.55)); }

/* Home feature composition and lower row of media cards. */
#viewport { flex:1; position:relative; min-height:0; padding:0; overflow:hidden; z-index:1; }
.tabview { position:absolute; inset:0; display:none; }
.tabview.active { display:block; }
#viewport iframe { position:absolute; inset:0; display:block; width:100%; height:100%; border:0; border-radius:0; background:#fff; box-shadow:none; }
.overlay { position:absolute; inset:0; z-index:5; display:none; overflow:hidden; border-radius:0; background:transparent; }
.overlay.show { display:block; }
.start { position:absolute; inset:0; min-height:100%; padding:0; overflow:hidden; color:#f7f8fa; background:transparent; }
.start-hero { max-width:710px; margin:20.6vh 0 0 9vw; }
.start .hero-sub { display:block; margin:0; color:rgba(249,250,252,.88); font-size:clamp(14px,1.12vw,21px); font-weight:300; line-height:1.35; letter-spacing:.005em; text-transform:none; text-shadow:0 1px 3px rgba(0,0,0,.35); }
.start h1 { margin:29px 0 0; color:#f7f8fa; background:none; -webkit-text-fill-color:currentColor; font-size:clamp(36px,2.85vw,52px); font-weight:300; line-height:1.12; letter-spacing:-.04em; text-shadow:0 1px 4px rgba(0,0,0,.35); }
.start .sub { max-width:690px; margin-top:19px; color:rgba(244,246,249,.76); font-size:clamp(15px,1.38vw,25px); font-weight:300; line-height:1.38; text-shadow:0 1px 4px rgba(0,0,0,.4); }
.start .sub b { color:#fff; font-weight:500; }
.start .cards { position:absolute; left:9vw; right:0; bottom:3.05vh; display:flex; grid-template-columns:none; gap:1.48vw; width:auto; max-width:none; height:19.6vh; margin:0; padding:0 1.6vw 0 0; overflow-x:auto; overflow-y:hidden; scrollbar-width:none; }
.start .cards::-webkit-scrollbar { display:none; }
.ps-story-card { position:relative; flex:0 0 19.45vw; width:19.45vw; height:100%; min-width:230px; padding:0; overflow:hidden; border:0; border-radius:1px; color:#f8f9fa; text-align:left; background:#16181c; cursor:pointer; box-shadow:0 2px 9px rgba(0,0,0,.25); }
.ps-story-card:hover .ps-story-art { transform:scale(1.045); }
.ps-story-art { position:absolute; inset:0; background-size:cover; background-position:center; transition:transform .35s ease; }
.ps-story-art::after { content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(4,5,7,.04) 25%,rgba(4,5,7,.18) 52%,rgba(4,5,7,.78) 100%); }
.ps-art-hardware { background-image:var(--hero-image); background-size:250% auto; background-position:27% 78%; filter:saturate(.55); }
.ps-art-city { background-image:radial-gradient(ellipse at 48% 45%,rgba(121,99,255,.75),transparent 23%),linear-gradient(142deg,#3e6c9f 0%,#7b3178 36%,#dc7648 63%,#111b2c 100%); }
.ps-art-city::before { content:""; position:absolute; inset:20% 4% 18%; background:repeating-linear-gradient(110deg,transparent 0 25px,rgba(255,255,255,.11) 26px 28px,transparent 29px 48px); transform:skewY(-7deg); }
.ps-art-console { background-image:var(--hero-image); background-size:220% auto; background-position:46% 75%; filter:saturate(.48) contrast(1.02); }
.ps-art-racing { background-image:radial-gradient(ellipse at 68% 60%,rgba(255,150,45,.92),transparent 18%),radial-gradient(ellipse at 37% 30%,rgba(31,171,226,.75),transparent 28%),linear-gradient(125deg,#123e59 0%,#781d58 42%,#d65736 70%,#141822 100%); }
.ps-art-racing::before { content:""; position:absolute; inset:10% -10%; background:repeating-linear-gradient(165deg,transparent 0 24px,rgba(255,255,255,.14) 25px 28px,transparent 29px 52px); transform:translateY(8px); }
.ps-art-world { background-image:radial-gradient(circle at 50% 48%,#1e568b 0 19%,transparent 20%),linear-gradient(145deg,#17233c,#29829b 48%,#10151f); }
.ps-art-code { background-image:radial-gradient(ellipse at 28% 30%,rgba(106,171,255,.76),transparent 28%),linear-gradient(135deg,#182842,#354d67 46%,#141822); }
.ps-story-title { position:absolute; z-index:2; left:14px; right:8px; bottom:11px; color:rgba(255,255,255,.91); font-size:clamp(13px,1.08vw,20px); font-weight:300; letter-spacing:-.02em; text-shadow:0 1px 4px rgba(0,0,0,.8); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ps-play { position:absolute; z-index:2; left:14px; bottom:48px; width:34px; height:34px; display:grid; place-items:center; border-radius:50%; color:#6c7075; background:rgba(245,247,250,.82); box-shadow:0 1px 5px rgba(0,0,0,.22); }
.ps-play svg { width:17px; height:17px; fill:currentColor; stroke:none; margin-left:2px; }
.ps-footer { position:absolute; left:1.4vw; bottom:.72vh; color:rgba(255,255,255,.56); font-size:clamp(10px,.78vw,15px); font-weight:300; text-shadow:0 1px 3px rgba(0,0,0,.5); }

/* Modals and utility panels stay functional, but match the monochrome shell. */
#library { top:28.5vh; right:20px; bottom:20px; background:rgba(32,34,38,.97); border-color:rgba(255,255,255,.22); }
#settings { background:rgba(13,14,16,.66); backdrop-filter:blur(9px); }
.settings-card { background:rgba(38,40,44,.98); border-color:rgba(255,255,255,.25); }
#settings-head { color:#f3f4f6; }
.set-row label, .set-row small { color:rgba(255,255,255,.68); }
.set-line input, #set-ua { background:rgba(255,255,255,.09); border-color:rgba(255,255,255,.2); color:#fff; }
#set-ua option { background:#292b30; }
#devtools { background:rgba(25,27,31,.98); border-color:rgba(255,255,255,.22); }
.dev-tab.active { background:rgba(255,255,255,.12); border-color:rgba(255,255,255,.3); }
#net-table th { background:#25272b; }
#toasts { z-index:80; }

@media (max-width:900px) {
  #ps-header { padding-left:24px; padding-right:24px; }
  .ps-sections { gap:28px; }
  .ps-actions { gap:20px; }
  #ps-clock { min-width:auto; }
  #ps-tiles { padding-left:22px; padding-right:22px; gap:8px; }
  .ps-app { width:9.6vh; height:9.6vh; }
  .ps-selected-entry { width:16vh; height:16vh; }
  .start-hero { margin-left:7vw; }
  .start .cards { left:7vw; gap:12px; }
  .ps-story-card { flex-basis:30vw; width:30vw; }
}
@media (max-width:620px) {
  #ps-header { height:70px; padding:0 18px; }
  .ps-sections { gap:22px; }
  .ps-section { font-size:20px; }
  .ps-actions { gap:12px; }
  .ps-action { width:30px; height:30px; }
  .ps-profile { width:34px; height:34px; }
  #ps-clock { display:none; }
  #ps-tiles { height:145px; min-height:145px; padding:15px 18px 0; gap:8px; }
  .ps-app { width:68px; height:68px; min-width:68px; min-height:68px; border-radius:12px; }
  .ps-selected-entry { width:116px; height:116px; min-width:116px; min-height:116px; }
  .ps-app.ps-selected { border-radius:16px; }
  .ps-app-label { font-size:16px; }
  .start-hero { margin:15vh 0 0 7vw; max-width:84vw; }
  .start h1 { margin-top:18px; font-size:36px; }
  .start .sub { margin-top:12px; font-size:15px; }
  .start .cards { left:7vw; right:0; bottom:4vh; height:17vh; gap:10px; }
  .ps-story-card { flex-basis:70vw; width:70vw; min-width:220px; }
  .ps-footer { left:18px; bottom:1vh; }
}
@media (max-height:680px) and (min-width:621px) {
  .start-hero { margin-top:15vh; }
  .start h1 { margin-top:16px; }
  .start .sub { margin-top:12px; }
  .start .cards { height:19vh; bottom:2vh; }
}

</style>
</head>
<body>

<div id="app">

  <!-- ── sidebar ─────────────────────────────────────────────── -->
  <aside id="sidebar">
    <div id="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <defs><linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#6366f1"/>
        </linearGradient></defs>
        <path d="M16 2l12 7v14l-12 7L4 23V9z" fill="url(#bg1)"/>
        <path d="M11 21.5V10.5l10 11V10.5" stroke="#fff" stroke-width="2.6" fill="none"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="brand-name">NEXUS</span>
      <button class="iconbtn side" id="btn-settings" title="Settings"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915" />
  <circle cx="12" cy="12" r="3" /></svg></button>
    </div>

    <nav id="side-nav">
      <button class="nav-item active" id="nav-home" title="Start page">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8" />
  <path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /></svg><span>Home</span>
      </button>
      <button class="nav-item" id="nav-history" title="History">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
  <path d="M3 3v5h5" />
  <path d="M12 7v5l4 2" /></svg><span>History</span>
      </button>
      <button class="nav-item" id="nav-bookmarks" title="Bookmarks">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z" /></svg><span>Bookmarks</span>
      </button>
      <button class="nav-item" id="btn-dev" title="Developer tools (F12)">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19h8" />
  <path d="m4 17 6-6-6-6" /></svg><span>Devtools</span>
      </button>
      <button class="nav-item" id="btn-source" title="View source">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 22h14a2 2 0 0 0 2-2V7l-5-5H6a2 2 0 0 0-2 2v4" />
  <path d="M14 2v4a2 2 0 0 0 2 2h4" />
  <path d="m5 12-3 3 3 3" />
  <path d="m9 18 3-3-3-3" /></svg><span>Source</span>
      </button>
    </nav>

    <div id="side-status">
      <div class="status-chip" id="chip-engine" title="Network engine">
        <span class="dot" id="dot-engine"></span><span id="st-engine">engine: booting…</span>
      </div>
      <div class="status-chip" id="chip-wisp" title="Wisp tunnel">
        <span class="dot" id="dot-wisp"></span><span id="st-wisp">wisp: …</span>
      </div>
      <div class="status-chip dim" title="Curl engine version">
        <span id="st-curl">libcurl: …</span>
      </div>
      <div class="status-chip dim" title="Page scripts always run">
        <span class="dot ok"></span><span id="st-scripts">scripts: auto-allowed</span>
      </div>
      <div id="engine-select-wrap" title="Network engine">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z" /></svg>
        <select id="engine-select" aria-label="Network engine">
          <option value="auto">auto</option>
          <option value="libcurl">libcurl + wisp</option>
          <option value="relay">local relay</option>
        </select>
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg>
      </div>
      <div id="st-url" title="Current address"></div>
    </div>
  </aside>

  <!-- ── main ────────────────────────────────────────────────── -->
  <main id="main">

    <!-- PS5-style home chrome -->
    <header id="ps-header">
      <nav class="ps-sections" aria-label="Nexus sections">
        <button class="ps-section active" id="ps-games" type="button">Games</button>
        <button class="ps-section" id="ps-media" type="button">Media</button>
      </nav>
      <div class="ps-actions">
        <button class="ps-action" id="ps-search" type="button" title="Search or enter a web address" aria-label="Search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7.2"/><path d="m20 20-4-4"/></svg>
        </button>
        <button class="ps-action" id="ps-settings" type="button" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/><path d="m19.4 15 .1.1a1.7 1.7 0 0 1-2.4 2.4l-.1-.1a1.7 1.7 0 0 0-2.9 1.2v.2a1.7 1.7 0 0 1-3.4 0v-.2a1.7 1.7 0 0 0-2.9-1.2l-.1.1a1.7 1.7 0 0 1-2.4-2.4l.1-.1a1.7 1.7 0 0 0-1.2-2.9H4a1.7 1.7 0 0 1 0-3.4h.2a1.7 1.7 0 0 0 1.2-2.9l-.1-.1a1.7 1.7 0 0 1 2.4-2.4l.1.1a1.7 1.7 0 0 0 2.9-1.2V2a1.7 1.7 0 0 1 3.4 0v.2a1.7 1.7 0 0 0 2.9 1.2l.1-.1a1.7 1.7 0 0 1 2.4 2.4l-.1.1a1.7 1.7 0 0 0 1.2 2.9h.2a1.7 1.7 0 0 1 0 3.4h-.2a1.7 1.7 0 0 0-1.2 2.9Z"/></svg>
        </button>
        <button class="ps-profile" id="ps-profile" type="button" title="History and bookmarks" aria-label="Profile and library">
          <span class="ps-avatar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.2"/><path d="M5.2 20a6.8 6.8 0 0 1 13.6 0"/></svg></span>
          <i class="ps-online" aria-hidden="true"></i>
        </button>
        <span id="ps-clock">4:42 PM</span>
      </div>
    </header>

    <div id="ps-tiles" aria-label="Pinned apps and sites">
      <button class="ps-app art-plus" type="button" data-url="https://duckduckgo.com/" title="Search the web" aria-label="Search the web">
        <span class="ps-app-icon"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 10v28M10 24h28"/></svg></span>
      </button>
      <div class="ps-selected-entry">
        <button class="ps-app ps-selected" id="ps-explore" type="button" title="Nexus Explore" aria-label="Nexus Explore">

        </button>
        <span class="ps-app-label">Explore</span>

      </button>
      <button class="ps-app art-stories" type="button" data-url="https://news.ycombinator.com/" title="News" aria-label="News">

        <button class="iconbtn go" id="btn-go" title="Go"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14" />
  <path d="m12 5 7 7-7 7" /></svg></button>
      </div>

      <button class="iconbtn" id="btn-bookmark" title="Bookmark this page"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z" /></svg></button>
    </div>

    <!-- pinned sites (real favicons, no emoji) -->
    <div id="bookmarkbar"></div>

    <!-- viewport (tab views injected here) -->
    <div id="viewport"></div>

    <!-- devtools drawer -->
    <div id="devtools" class="hidden">
      <div id="dev-head">

}

async function engineRelay(method, url, opts = {}) {
  const headers = new Headers();
  for (const [k, v] of opts.headers || []) {
    const lk = k.toLowerCase();
    if (["user-agent", "content-length", "host", "connection"].includes(lk)) continue;
    try { headers.set(k, v); } catch {}
  }
  headers.set("X-Proxy-UA", state.ua);
  const init = { method, headers, signal: opts.signal, credentials: "omit" };
  if (opts.body != null && method !== "GET" && method !== "HEAD") init.body = opts.body;
  const r = await fetch("/proxy?url=" + encodeURIComponent(url), init);
  const body = await r.arrayBuffer();
  const hdrs = [];
  r.headers.forEach((v, k) => hdrs.push([k, v]));
  return {
    status: r.status, statusText: r.statusText, headers: hdrs, body,
    finalUrl: r.headers.get("X-Final-URL") || url,
    engine: "relay",
  };
}

const ENGINE_FN = { libcurl: engineLibcurl, relay: engineRelay };

function engineChain() {
  const local = state.localMode;
  switch (state.enginePref) {
    case "libcurl": return local ? ["libcurl", "relay"] : ["libcurl"];
    case "relay": return local ? ["relay"] : ["libcurl"];
    default: return local ? ["libcurl", "relay"] : ["libcurl"];
  }
}

async function engineFetch(method, url, opts = {}) {
  const chain = engineChain().filter((n) =>
    (n !== "libcurl" || (state.libcurlReady && state.wispOk)) &&
    (n !== "relay" || state.localMode));
  let lastErr = null;
  for (const name of chain) {
    if (opts.signal?.aborted) throw new DOMException("aborted", "AbortError");
    try {
      const res = await ENGINE_FN[name](method, url, opts);
      state.lastEngine = res.engine;
      updateBadges();
      return res;
    } catch (e) {
      if (e && e.name === "AbortError") throw e;
      lastErr = e;
      if (state.enginePref === "auto")
        consoleLog("warn", `engine ${name} failed for ${hostOf(url)}: ${e.message || e}`, "engine");
    }
  }
  throw lastErr || new Error("no engine available");
}

function saveCookies() {
  if (!state.cookieSession) return;
  try {
    const jar = state.cookieSession.export_cookies();
    if (jar) localStorage.setItem("hyperion.jar", jar);
  } catch {}
}

/* ═══════════════════════ net log ═══════════════════════ */
function netAdd(tab, row) {
  row.id = ++state.netSeq;
  row.ts = Date.now();
  tab.net.unshift(row);
  if (tab.net.length > 600) tab.net.pop();
  if (tab === state.active) renderNetwork();
}
function headerGet(headers, name) {
  const ln = name.toLowerCase();
  for (const [k, v] of headers || []) if (k.toLowerCase() === ln) return v;
  return null;
}

/* ═══════════════════════ console ═══════════════════════ */

  if (!tab) return;

}

function activateTab(tab) {

/* ═══════════════════════ URL handling ═══════════════════════ */
function normalizeUrl(input) {
  input = (input || "").trim();
  if (!input) return null;
  if (/^about:/i.test(input)) return input.toLowerCase();
  if (/^[a-z][a-z0-9+.-]*:\/\//i.test(input)) return input;
  if (/^(localhost|127\.0\.0\.1|0\.0\.0\.0)(:\d+)?(\/|$|\?)/i.test(input))
    return "http://" + input;
  if (!/\s/.test(input) && /^[a-z0-9-]+(\.[a-z0-9-]+)+(:\d+)?([/?#].*)?$/i.test(input))
    return "https://" + input;
  if (/^\d{1,3}(\.\d{1,3}){3}(:\d+)?(\/|$)/.test(input)) return "http://" + input;
  return null;
}
function searchUrl(q) {
  return "https://html.duckduckgo.com/html/?q=" + encodeURIComponent(q);
}

/* ═══════════════════════ HTML rewriting ═══════════════════════ */
const SUB_RES_SELECTORS = [
  ["script[src]", ["src"]], ["link[href]", ["href"]],
  ["img[src]", ["src"]], ["img[srcset]", ["srcset"]],
  ["source[src]", ["src"]], ["source[srcset]", ["srcset"]],
  ["iframe[src]", ["src"]], ["frame[src]", ["src"]],
  ["embed[src]", ["src"]], ["object[data]", ["data"]],
  ["video[src]", ["src"]], ["video[poster]", ["poster"]],
  ["audio[src]", ["src"]], ["track[src]", ["src"]],
  ["input[src]", ["src"]], ["use[href]", ["href"]],
  ["image[href]", ["href"]], ["input[formaction][type=submit]", ["formaction"]],
  ["button[formaction]", ["formaction"]],
];

function rewriteSrcset(v) {
  if (!v || v.includes("data:")) return v;
  return v.split(",").map((part) => {
    const bits = part.trim().split(/\s+/);
    if (!bits[0]) return part;
    const a = absolutize(bits[0]);
    if (a) bits[0] = toProxy(a);
    return bits.join(" ");
  }).join(", ");
}
function absolutize(u, base) {
  try { return new URL(u, base).href; } catch { return null; }
}
function rewriteCssText(text, base) {
  return text
    .replace(/url\(\s*(['"]?)([^'")]+)\1\s*\)/g, (m, q, u) => {
      if (/^(data:|blob:|#|javascript:)/i.test(u)) return m;
      const a = absolutize(u, base);
      return a ? `url(${q}${toProxy(a)}${q})` : m;
    })
    .replace(/@import\s+(['"])([^'"]+)\1/g, (m, q, u) => {
      const a = absolutize(u, base);
      return a ? `@import ${q}${toProxy(a)}${q}` : m;
    });
}

function processHtml(text, finalUrl, topLevel = false) {
  const doc = new DOMParser().parseFromString(text, "text/html");
  const local = state.localMode;

  // strip CSP / frame-embedding blockers
  doc.querySelectorAll("meta[http-equiv]").forEach((m) => {
    const v = (m.getAttribute("http-equiv") || "").toLowerCase();
    if (v.includes("content-security-policy") || v.includes("refresh")) {
      if (v.includes("content-security-policy")) m.remove();
    }
  });

  // <base> = the real page URL (relative resolution stays correct)
  doc.querySelectorAll("base").forEach((b) => b.remove());
  const base = doc.createElement("base");
  base.id = "hbase";
  base.href = finalUrl;
  const head = doc.head || doc.documentElement;
  head.insertBefore(base, head.firstChild);

  const abs = (u) => absolutize(u, finalUrl);

  // anchors + forms keep their real target in data-*; local mode rewrites the
  // href/action through the proxy, standalone keeps absolute originals
  doc.querySelectorAll("a[href]").forEach((a) => {
    const href = a.getAttribute("href") || "";
    if (!href || /^javascript:/i.test(href)) return;
    const u = abs(href);
    if (!u || !/^https?:/i.test(u)) return;
    a.setAttribute("data-hhref", u);
    if (!/^(mailto:|tel:)/i.test(href))
      a.setAttribute("href", local ? toProxy(u) : u);
  });
  doc.querySelectorAll("form[action]").forEach((f) => {
    const u = abs(f.getAttribute("action") || "");
    if (u) { f.setAttribute("data-haction", u); f.setAttribute("action", local ? toProxy(u) : u); }
  });

  // top-level page: iframes get their src parked in data-hsrc so NO raw load
  // starts; the runtime then requests the document through the engine
  if (topLevel) {
    doc.querySelectorAll("iframe[src],frame[src]").forEach((fr) => {
      const u = abs(fr.getAttribute("src") || "");
      if (u && /^https?:/i.test(u)) {
        fr.setAttribute("data-hsrc", u);
        fr.removeAttribute("src");
      }
    });
  }

  // every subresource through the proxy (local mode only — in standalone mode
  // classic subresources are no-cors and load directly from the target origin)
  if (local) {
    for (const [sel, attrs] of SUB_RES_SELECTORS) {
      doc.querySelectorAll(sel).forEach((el) => {
        for (const attr of attrs) {
          const v = el.getAttribute(attr);
          if (!v) continue;
          if (attr === "srcset") { el.setAttribute("srcset", rewriteSrcset(v)); continue; }
          if (/^(data:|blob:|#|javascript:|mailto:|tel:)/i.test(v)) continue;
          const u = abs(v);
          if (!u || !/^https?:/i.test(u)) continue;
          el.setAttribute(attr, toProxy(u));
        }
      });
    }

    // inline styles + <style> blocks
    doc.querySelectorAll("[style]").forEach((el) => {
      const v = el.getAttribute("style");
      if (v && v.includes("url(")) el.setAttribute("style", rewriteCssText(v, finalUrl));
    });
    doc.querySelectorAll("style").forEach((el) => {
      if (el.textContent && /url\(|@import/i.test(el.textContent))
        el.textContent = rewriteCssText(el.textContent, finalUrl);
    });
  }

  // meta refresh → let the runtime forward it
  // (left in place; runtime resolves it against <base>)

  // inject the runtime right after <base> — before ANY page script
  const runtime = state.runtimeSrc
    .replace(/__PROXY_PREFIX__/g, P)
    .replace(/__APP_ORIGIN__/g, location.origin)
    .replace("__CONFIG__", JSON.stringify({ standalone: !local, topLevel: !!topLevel }))
    .replace(/<\/script/gi, "<\\/script");
  const s = doc.createElement("script");
  s.textContent = runtime;
  head.insertBefore(s, base.nextSibling);

  const dt = /^\s*(<!DOCTYPE[^>]*>)/i.exec(text);
  return (dt ? dt[1] : "<!DOCTYPE html>") + doc.documentElement.outerHTML;
}

function looksHtml(buf, ct) {
  return /text\/html|application\/xhtml\+xml/i.test(ct) ||
    (!ct && new TextDecoder().decode(buf.slice(0, 512)).trimStart().startsWith("<"));
}

function textViewerHtml(text, url, ct) {

}

function renderTextViewer(tab, text, url, ct) {

}

function setIframeSrcdoc(tab, html) {
  tab.iframe.removeAttribute("src");
  tab.iframe.srcdoc = html;

function setIframeSrc(tab, url) {

/* ═══════════════════════ navigation ═══════════════════════ */
async function navigate(tab, rawUrl, opts = {}) {
  let url = normalizeUrl(rawUrl) || searchUrl(rawUrl);
  const seq = ++tab.seq;
  ++state.navSeq;

  if (url === "about:start" || url === "about:blank") {
    if (tab.ctrl) tab.ctrl.abort();
    renderStart(tab);
    if (!opts.noPush) pushHistory(tab, { url });
    tab.lastNav = null;
    syncOmnibox();
    return;
  }

  const method = (opts.method || "GET").toUpperCase();
  tab.status = "loading";
  tab.overlay.onclick = null;
  renderTabState(tab);
  $("btn-reload").innerHTML = svgIco("x");

  const ctrl = new AbortController();
  tab.ctrl = ctrl;
  const t0 = performance.now();
  let headers = [["accept", "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"],
                 ["accept-language", "en-US,en;q=0.9"]];
  let body = null;

  if (method !== "GET" && method !== "HEAD" && opts.entries) {
    const entries = opts.entries;
    if ((opts.enctype || "").includes("multipart") || opts.hasFile) {
      const fd = new FormData();
      for (const en of entries) {
        if (en.file) fd.append(en.k, new Blob([en.file.buf], { type: en.file.type }), en.file.name);
        else fd.append(en.k, en.v ?? "");
      }
      body = fd;
    } else {
      const sp = new URLSearchParams();
      for (const en of entries) sp.append(en.k, en.v ?? "");
      body = sp.toString();
      headers.push(["content-type", "application/x-www-form-urlencoded"]);
    }
  }

  try {
    const res = await engineFetch(method, url, { headers, body, signal: ctrl.signal });
    if (seq !== tab.seq) return;                 // superseded
    const ms = Math.round(performance.now() - t0);
    const ct = headerGet(res.headers, "content-type") || "";
    const buf = res.body;

    netAdd(tab, {
      status: res.status, method, url: res.finalUrl, engine: res.engine,
      size: buf.byteLength, ms, type: "document",
    });

    if (res.status >= 400)
      throw new Error(`HTTP ${res.status} ${res.statusText || ""}`.trim());

    tab.lastNav = { url, method, opts: { method, entries: opts.entries, enctype: opts.enctype, hasFile: opts.hasFile } };
    tab.url = res.finalUrl;
    tab.status = "idle";

    const isHtml = looksHtml(buf, ct);

    if (isHtml) {
      const text = decodeBuf(buf, ct);
      tab.raw = text;
      setIframeSrcdoc(tab, processHtml(text, res.finalUrl, true));
      tab.title = titleFrom(text) || hostOf(res.finalUrl);
      tab.icon = null;
    } else if (/^(text\/|application\/(json|xml|javascript|x-javascript)|.*\+(xml|json))/i.test(ct)) {
      const text = decodeBuf(buf, ct);
      tab.raw = text;
      setIframeSrcdoc(tab, textViewerHtml(text, res.finalUrl, ct));
      tab.title = hostOf(res.finalUrl);
    } else {
      tab.raw = "";
      // binary: standalone shows it via a blob URL; local mode offloads to the proxy
      if (state.localMode) {
        setIframeSrc(tab, toProxy(res.finalUrl));
      } else {
        const blob = new Blob([buf], { type: ct || "application/octet-stream" });
        setIframeSrc(tab, URL.createObjectURL(blob));
      }
      tab.title = hostOf(res.finalUrl);
    }

    hideOverlay(tab);
    if (!opts.noPush && !opts.replaceHist) pushHistory(tab, { url, method, opts: tab.lastNav.opts });
    if (opts.histIdx != null) tab.hidx = opts.histIdx;
    syncOmnibox(true);
    renderTabState(tab);
    document.title = (tab.title || hostOf(tab.url)) + " · Nexus";
    if (state.cookieSession) saveCookies();
  } catch (e) {
    if (e && e.name === "AbortError") {
      if (seq === tab.seq) { tab.status = "idle"; renderTabState(tab); $("btn-reload").innerHTML = svgIco("rotate-cw"); }
      return;
    }
    if (seq !== tab.seq) return;
    netAdd(tab, { status: 0, method, url, engine: state.lastEngine, size: 0,
                  ms: Math.round(performance.now() - t0), type: "document",
                  error: e.message || String(e) });
    renderError(tab, url, e);
    toast("Navigation failed: " + (e.message || e), true);
  } finally {
    if (seq === tab.seq) { $("btn-reload").innerHTML = svgIco("rotate-cw"); $("btn-reload").disabled = false; }
  }
}

function titleFrom(html) {
  const m = /<title[^>]*>([\s\S]*?)<\/title>/i.exec(html);
  return m ? m[1].replace(/\s+/g, " ").trim().slice(0, 120) : null;
}
function decodeBuf(buf, ct) {
  let enc = "utf-8";
  const m = /charset=([\w-]+)/i.exec(ct || "");
  if (m) enc = m[1];
  try { return new TextDecoder(enc).decode(buf); }
  catch { return new TextDecoder("utf-8").decode(buf); }
}

function pushHistory(tab, entry) {
  tab.hist = tab.hist.slice(0, tab.hidx + 1);
  tab.hist.push({ ...entry, ts: Date.now(), title: tab.title });
  if (tab.hist.length > 200) tab.hist.shift();
  tab.hidx = tab.hist.length - 1;
  if (tab === state.active) {
    state.history.unshift({ url: entry.url, title: tab.title || hostOf(entry.url), ts: Date.now() });
    if (state.history.length > 500) state.history.pop();
    saveJSON("hyperion.history", state.history);
  }
  updateNavButtons();
}

function goBack(tab = state.active) {
  if (!tab || tab.hidx <= 0) return;
  const e = tab.hist[--tab.hidx];
  navigate(tab, e.url, { noPush: true, ...e.opts, histIdx: tab.hidx });
  updateNavButtons();
}
function goFwd(tab = state.active) {
  if (!tab || tab.hidx >= tab.hist.length - 1) return;
  const e = tab.hist[++tab.hidx];
  navigate(tab, e.url, { noPush: true, ...e.opts, histIdx: tab.hidx });
  updateNavButtons();
}
function updateNavButtons() {
  const t = state.active;
  $("btn-back").disabled = !t || t.hidx <= 0;
  $("btn-fwd").disabled = !t || t.hidx >= t.hist.length - 1;
}

function syncOmnibox(force) {
  const o = $("omni");
  if (!force && document.activeElement === o) return;
  const t = state.active;
  o.value = !t || t.url === "about:start" ? "" : unproxy(t.url);
  if (document.activeElement === o) o.select();

/* ═══════════════════════ messages from pages ═══════════════════════ */
window.addEventListener("message", async (e) => {
  const d = e.data;
  if (!d || typeof d !== "object" || !d.h) return;
  const tab = state.tabs.find((t) => t.iframe.contentWindow === e.source);
  if (!tab) return;                                // validate by source window

  switch (d.h) {
    case "console":
      tab.console.push({ level: d.level, text: d.text, src: hostOf(tab.url), ts: Date.now() });
      if (tab.console.length > 800) tab.console.shift();
      if (tab === state.active) renderConsole();
      break;

    case "title":
      if (d.title) { tab.title = d.title; renderTabs();
        if (tab === state.active) document.title = d.title + " · Nexus"; }
      break;

    case "favicon":
      if (d.href) {
        if (!/^https?:/i.test(d.href)) {
          tab.icon = d.href;                       // data:/blob: — usable as-is
          renderTabs();
        } else if (state.localMode) {
          tab.icon = toProxy(d.href);
          renderTabs();
        } else {
          // standalone: fetch through the engine, show as blob URL
          engineFetch("GET", d.href, {}).then((r) => {
            if (tab.icon && tab.icon.startsWith("blob:")) URL.revokeObjectURL(tab.icon);
            tab.icon = URL.createObjectURL(new Blob([r.body],
              { type: headerGet(r.headers, "content-type") || "image/x-icon" }));
            renderTabs();
          }).catch(() => {});
        }
      }
      break;

    case "ready":
      tab.status = "idle"; renderTabState(tab);
      hideOverlay(tab);
      if (d.title && (!tab.title || tab.title === hostOf(tab.url))) {
        tab.title = d.title; renderTabs();
      }
      break;

    case "nav":
      navigate(tab, d.url, {
        method: d.method, entries: d.entries,
        enctype: d.enctype, hasFile: d.hasFile,
      });
      break;

    case "open":
      const nt = makeTab();
      navigate(nt, d.url);
      activateTab(nt);
      break;

    case "req":                                    // page fetch/XHR via engine
    case "page":                                   // nested iframe document
      handlePageRequest(tab, d);
      break;

    case "res-pong": break;

    case "eval-result":
      tab.console.push({
        level: d.ok ? "log" : "error",
        text: d.result, src: "‹console›", ts: Date.now(),
      });
      if (tab === state.active) renderConsole();
      break;
  }
});

/* nested iframe document via the engine — runtime asked for a whole page */
async function handleFrameDoc(tab, d) {
  const t0 = performance.now();
  try {
    const res = await engineFetch("GET", d.url, {
      headers: [["accept", "text/html,application/xhtml+xml,*/*;q=0.8"]],
    });
    const ct = headerGet(res.headers, "content-type") || "";
    netAdd(tab, {
      status: res.status, method: "GET", url: d.url, engine: res.engine,
      size: res.body.byteLength, ms: Math.round(performance.now() - t0),
      type: "iframe",
    });
    if (res.status >= 400)
      throw new Error(`HTTP ${res.status} ${res.statusText || ""}`.trim());
    let html = null, raw = null;
    if (looksHtml(res.body, ct)) {
      html = processHtml(decodeBuf(res.body, ct), res.finalUrl, false);
    } else if (/^(text\/|application\/(json|xml|javascript|x-javascript)|.*\+(xml|json))/i.test(ct)) {
      html = textViewerHtml(decodeBuf(res.body, ct), res.finalUrl, ct);
    } else {
      raw = res.finalUrl;                 // binary → runtime falls back to raw src
    }
    tab.iframe.contentWindow.postMessage(
      { h: "res", id: d.id, kind: "page", html, raw }, "*");
  } catch (err) {
    netAdd(tab, {
      status: 0, method: "GET", url: d.url, engine: state.lastEngine, size: 0,
      ms: Math.round(performance.now() - t0), type: "iframe",
      error: err.message || String(err),
    });
    tab.iframe.contentWindow.postMessage(
      { h: "res", id: d.id, kind: "page", error: err.message || "network error", raw: d.url }, "*");
  }
}

async function handlePageRequest(tab, d) {
  if (d.h === "page") return handleFrameDoc(tab, d);
  const t0 = performance.now();
  const method = (d.method || "GET").toUpperCase();
  const headers = (d.headers || []).map((h) => [String(h[0]), String(h[1])]);
  let body = null;
  if (d.body && typeof d.body === "object" && d.body.__form) {
    const fd = new FormData();
    for (const en of d.body.__form) {
      if (en.file) fd.append(en.k, new Blob([en.file.buf], { type: en.file.type }), en.file.name);
      else fd.append(en.k, en.v ?? "");
    }
    body = fd;
  } else if (d.body != null) body = d.body;

  try {
    const res = await engineFetch(method, d.url, { headers, body });
    netAdd(tab, {
      status: res.status, method, url: d.url, engine: res.engine,
      size: res.body.byteLength, ms: Math.round(performance.now() - t0),
      type: "xhr",
    });
    tab.iframe.contentWindow.postMessage({
      h: "res", id: d.id, status: res.status, statusText: res.statusText,
      headers: res.headers, body: res.body,
    }, "*");
  } catch (err) {
    netAdd(tab, {
      status: 0, method, url: d.url, engine: state.lastEngine, size: 0,
      ms: Math.round(performance.now() - t0), type: "xhr",
      error: err.message || String(err),
    });
    tab.iframe.contentWindow.postMessage(
      { h: "res", id: d.id, error: err.message || "network error" }, "*");
  }
}

/* ═══════════════════════ devtools ═══════════════════════ */
function setDev(open, tabName) {
  state.devOpen = open;
  $("devtools").classList.toggle("hidden", !open);
  if (tabName) state.devTab = tabName;
  document.querySelectorAll(".dev-tab").forEach((b) =>
    b.classList.toggle("active", b.dataset.dev === state.devTab));
  document.querySelectorAll(".dev-pane").forEach((p) =>
    p.classList.toggle("active", p.id === "dev-" + state.devTab));
  renderConsole(); renderNetwork(); renderSource();
}

function renderConsole() {
  const box = $("console-lines");
  if (!state.devOpen || state.devTab !== "console") return;
  const tab = state.active;
  const lines = tab ? tab.console : [];
  box.innerHTML = lines.map((l) =>
    `<div class="cline ${esc(l.level)}">${esc(l.text)}${
      l.src ? `<span class="csrc">— ${esc(l.src)}</span>` : ""}</div>`).join("");
  box.scrollTop = box.scrollHeight;
}

function renderNetwork() {
  if (!state.devOpen || state.devTab !== "network") return;
  const tab = state.active;
  const rows = tab ? tab.net : [];
  $("net-rows").innerHTML = rows.map((r) => {
    const stCls = r.status === 0 ? "st-0" : "st-" + Math.floor(r.status / 100);
    const name = unproxy(r.url).replace(/^https?:\/\//, "");
    const rtype = r.type === "document" ? "doc" : r.type === "xhr" ? "xhr"
      : r.type === "iframe" ? "frame" : r.type || "res";
    return `<tr title="${esc(unproxy(r.url))}${r.error ? "\n" + esc(r.error) : ""}">
      <td><span class="rtype">${esc(rtype)}</span></td>
      <td class="${stCls}">${r.status || (r.error ? "ERR" : "—")}</td>
      <td>${esc(r.method)}</td>
      <td>${esc(name)}</td>
      <td class="eng-${esc(r.engine)}">${esc(r.engine)}</td>
      <td>${r.size ? fmtSize(r.size) : "—"}</td>
      <td>${r.ms != null ? r.ms + "ms" : "—"}</td>
    </tr>`;
  }).join("");
}
function fmtSize(n) {
  if (n < 1024) return n + "B";
  if (n < 1048576) return (n / 1024).toFixed(1) + "kB";
  return (n / 1048576).toFixed(1) + "MB";
}

function renderSource() {
  if (!state.devOpen || state.devTab !== "source") return;

  if (mod && e.key.toLowerCase() === "t") { e.preventDefault(); makeTab(); }
  else if (mod && e.key.toLowerCase() === "w") { e.preventDefault(); closeTab(state.active); }
  else if (mod && e.key.toLowerCase() === "l") { e.preventDefault(); document.body.classList.add("search-open"); $("omni").focus(); $("omni").select(); }
  else if (mod && e.key.toLowerCase() === "r") { e.preventDefault(); $("btn-reload").click(); }
  else if (e.key === "F5") { e.preventDefault(); $("btn-reload").click(); }
  else if (e.key === "F12") { e.preventDefault(); setDev(!state.devOpen); }
  else if (e.altKey && e.key === "ArrowLeft") { e.preventDefault(); goBack(); }
  else if (e.altKey && e.key === "ArrowRight") { e.preventDefault(); goFwd(); }
  else if (mod && e.key === "Tab") { e.preventDefault(); newTabSwitch(e.shiftKey ? -1 : 1); }

/* ═══════════════════════ boot ═══════════════════════ */
function probeWisp(url) {
  return new Promise((resolve) => {
    let ws;
    try { ws = new WebSocket(url || wispUrl()); }
    catch { return resolve(false); }
    let done = false;
    const fin = (v) => {
      if (done) return;
      done = true;
      clearTimeout(timer);
      try { ws.close(); } catch {}
      resolve(v);
    };
    const timer = setTimeout(() => fin(false), 7000);
    ws.binaryType = "arraybuffer";
    ws.onmessage = () => fin(true);       // first frame = Wisp initial window
    ws.onerror = () => fin(false);
    ws.onclose = () => fin(false);
  });
}

/* libcurl.js loader — local vendor, jsdelivr, unpkg (school networks often
   whitelist one CDN but not the other, so we try every source in order) */
const LIBCURL_JS = [
  "https://cdn.jsdelivr.net/npm/libcurl.js@0.7.4/libcurl.js",
  "https://unpkg.com/libcurl.js@0.7.4/libcurl.js",
];
const LIBCURL_WASM_SRC = [
  "https://cdn.jsdelivr.net/npm/libcurl.js@0.7.4/libcurl.wasm",
  "https://unpkg.com/libcurl.js@0.7.4/libcurl.wasm",
];

function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = src;
    s.onload = () => res();
    s.onerror = () => rej(new Error("script load failed: " + src));
    document.head.appendChild(s);
  });
}
async function headOk(url, ms = 4000) {
  try {
    const c = new AbortController();
    const t = setTimeout(() => c.abort(), ms);
    const r = await fetch(url, { method: "HEAD", signal: c.signal, cache: "no-store" });
    clearTimeout(t);
    return r.ok;
  } catch { return false; }
}

/* standalone = file:// or no local /proxy relay (X-Proxy-Engine header) */
async function detectMode() {
  if (location.protocol === "file:") { state.localMode = false; return; }
  try {
    const c = new AbortController();
    const t = setTimeout(() => c.abort(), 4000);
    const r = await fetch("/proxy?url=" + encodeURIComponent("https://example.com"),
      { method: "HEAD", signal: c.signal, cache: "no-store" });
    clearTimeout(t);
    state.localMode = r.ok && r.headers.get("X-Proxy-Engine") === "relay";
  } catch {
    state.localMode = false;
  }
}

async function initLibcurl() {
  try {
    if (typeof libcurl === "undefined") {
      const tries = [];
      if (location.protocol !== "file:") tries.push("/vendor/libcurl.js");
      tries.push(...LIBCURL_JS);
      for (const u of tries) {
        try { await loadScript(u); } catch { /* next source */ }
        if (typeof libcurl !== "undefined") break;
      }
    }
    if (typeof libcurl === "undefined")
      throw new Error("libcurl.js unavailable from every source");
    libcurl.logger = (type, text) => {
      if (type === "error" || type === "warn")
        consoleLog(type === "error" ? "error" : "debug", "[libcurl] " + text, "libcurl");
    };
    const wasmTries = [];
    if (location.protocol !== "file:" && await headOk("/vendor/libcurl.wasm"))
      wasmTries.push("/vendor/libcurl.wasm");
    wasmTries.push(...LIBCURL_WASM_SRC);
    let wasmOk = false;
    for (const u of wasmTries) {
      try { await libcurl.load_wasm(u); wasmOk = true; break; } catch { /* next */ }
    }
    if (!wasmOk) throw new Error("libcurl.wasm unavailable from every source");
    state.libcurlReady = true;
    try {
      const jar = localStorage.getItem("hyperion.jar");
      state.cookieSession = jar
        ? new libcurl.HTTPSession({ enable_cookies: true, cookie_jar: jar })
        : new libcurl.HTTPSession({ enable_cookies: true });
    } catch (e) {
      console.warn("cookie session failed", e);
      try { state.cookieSession = new libcurl.HTTPSession(); } catch {}
    }
    // Wisp failover: probe every candidate until one opens a tunnel
    state.wispOk = false;
    for (const u of wispCandidates()) {
      state.wispEndpoint = u;
      libcurl.set_websocket(u);
      if (await probeWisp(u)) { state.wispOk = true; break; }
    }
    if (!state.wispOk)
      toast(state.localMode
        ? "Wisp tunnel unreachable — falling back to the local relay"
        : "No Wisp server reachable — check this network", true);
    updateBadges();
  } catch (e) {
    state.libcurlErr = e;
    console.warn("libcurl init failed:", e);
    toast("libcurl.js unavailable — " +
      (state.localMode ? "using local relay" : "nothing else to fall back on") +
      " (" + (e.message || e) + ")", true);
    updateBadges();
  }
}

let booted = false;
async function boot() {
  if (booted) return;
  booted = true;

  // mode first (local relay vs standalone), then the page runtime
  await detectMode();

  if (typeof HYPERION_INJECTED !== "undefined" && HYPERION_INJECTED) {
    state.runtimeSrc = HYPERION_INJECTED;               // single-file build
  } else {
    try {
      state.runtimeSrc = await (await fetch("/injected.js")).text();
    } catch { state.runtimeSrc = ""; }
  }

  updateBadges();
  renderBookmarkBar();
  makeTab();
  syncBookmarkStar();

  initLibcurl().then(() => {
    syncBookmarkStar();
    updateBadges();
  });

  // keep star + url bar in sync after navigations
  setInterval(syncBookmarkStar, 1500);
}

document.addEventListener("DOMContentLoaded", boot);
if (document.readyState !== "loading") boot();

</script>
</body>
